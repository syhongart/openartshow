name: generate-image

# Gemini 로 이미지를 만들어 **브랜치와 PR 로** 올린다.
#
# ── 왜 수동(`workflow_dispatch`)인가 ──────────────────────────────────────
# 이미지는 **감독이 원할 때 한 번** 만드는 것이다. push·schedule 로 돌리면 요금이
# 자동으로 나가고, 그것을 막는 장치가 이 저장소에 없다.
#
# ⚠ **`main` 에 병합되기 전에는 감독 화면에 실행 버튼이 안 뜬다.** GitHub 은
#    기본 브랜치에 있는 워크플로만 dispatch UI 에 노출한다(보안담당 P5).
#
# ── ⚠⚠ 이 PR 은 **필수 상태검사가 저절로 붙지 않는다** ────────────────────
# 첫 판본은 여기에 *"PR 로 올리면 평소 게이트를 그대로 탄다"* 고 적었다. **거짓이었다**
# — 검수관·보안담당이 각각 반려·조건부수용 사유로 잡았다(2026-08-13). 바로 윗줄이
# 인용한 성질이 **PR 생성에도 똑같이 적용**되기 때문이다:
#
#   `GITHUB_TOKEN` 으로 만든 push·PR 은 **다른 워크플로를 발화하지 않는다**
#   (무한 루프 방지 정책). 이 저장소는 태스크 #130 으로 이미 실증했고
#   `valuation.yml:119-123` 이 그 함정을 적어 뒀다.
#
# 즉 이 워크플로가 연 PR 에는 `verify`·`smoke` 가 **아예 안 뜬다.** 결과는 둘 중 하나:
#   (a) 영원히 pending → 병합 불가
#   (b) 사람이 우회 병합 → **게이트 0으로 자산이 `main` 에 들어간다**
#
# **위험의 본체는 (b) 가 아니라 "게이트를 탄다"고 보증한 그 문장이었다.** 다음 사람이
# 초록불 부재를 *"아직 안 돌았네"* 로 읽고 우회할 유인을 만든다 — `CLAUDE.md` 가
# `main` unprotected 오기로 7일을 잃었다고 적은 그 형태를, **그 사고를 인용하는
# 문단이 재현했다.**
#
# ── 그래서 운용 절차는 이렇다 (사람이 해야 한다) ─────────────────────────
# 브랜치가 `claude/generated-image-*` 이고 `ci.yml` 의 push 트리거가 `claude/**` 이므로,
# **사람이 그 브랜치에 커밋을 하나 얹으면 그때 CI 가 돈다.** 부팀장이 할 일:
#   1. `git fetch origin claude/generated-image-<run_id>`
#   2. 이미지를 **HTML 참조와 함께** 자기 작업 브랜치에 올린다 — 이미지 파일만으로는
#      배포물에 안 실린다(아래 참조).
#   3. 사람 push → `ci.yml` 발화 → 정상 게이트.
# 근본 해소(PAT / ruleset 봇 우회)는 `valuation.yml:128-130` 이 이미 **감독 판정**으로
# 남긴 항목이다 — **같은 결정을 두 곳에서 따로 하지 않는다.**
#
# ── 이미지 파일만으로는 라이브에 안 나온다 (실측 2026-08-13) ──────────────
# `vite.config.js:96` 의 정적 복사 목록은 `galleries`·`world`·`assets`·`utils` 뿐이고
# `img` 는 없다. 대신 **HTML 이 `./img/…` 로 참조하면** vite 가 번들 자산으로 굽는다.
# 17KB 프로브로 실측: `frontend/img/_probe.png` + `<img src="./img/_probe.png">` →
# `dist/_bundle/_probe-DsHxVMo3.png` · HTML 은 `/openartshow/_bundle/…` 로 재작성.
# (4KB 미만이면 data URI 로 인라인된다 — 실제 이미지 크기에서는 해당 없다.)
# **그러므로 이 워크플로의 산출물은 "재료" 이고, 참조를 붙이는 커밋이 있어야 배포된다.**
#
# ── 조달 경로: Gemini API 유지 (팀장 판정 2026-08-13, 분기 C) ────────────
# Vertex AI Imagen 출력은 Google 의 **생성물 저작권 인덤니티 명시 대상**이고, 여기서 쓰는
# Gemini API 가 그 대상인지는 **법무가 확인하지 못했다**(1차 출처 egress 차단). 그런데도
# Gemini 를 유지한 근거는 비례성이다 — 홈 이미지 한 장에 결제 계정 + 인증 재작성(키 헤더
# → 서비스 계정/OAuth)은 과하고, 법무 적신호도 없다. 전환은 나중에도 열려 있다(A 와
# 반대로 이 분기는 가역적이다).
#
# **그래서 잔여 위험을 절차로 낮춘다. 아래 셋은 권고가 아니라 조건이다.**
#  ① **역이미지 검색 1회는 채택 확정 조건이다.** 모델이 학습한 실존 미술관 건축을 그대로
#     뱉을 수 있고, 프롬프트에서 이름을 빼도 확률이 0이 되지 않는다(유명 건축일수록
#     학습셋 중복이 많아 재현 확률이 오른다 — 법무 축 ⑤).
#     · **실행 주체**: 이 CI 환경은 egress 차단이라 **여기서 못 한다.** 감독 또는 부팀장이
#       환경 밖 브라우저에서 Google Lens · TinEye 로 1회.
#     · **결과 기록 위치**: 이미지를 반입하는 **PR 본문**. 안 적으면 안 한 것으로 친다.
#     · 이 조건을 적는 이유: 팀장이 *"적지 않으면 「권고」는 첫 회부터 생략된다"* 고 못박았다.
#  ② **프롬프트 원문을 저장소에 남긴다**(반입 PR 본문). 출처 다툼이 나면 "실존 대상을
#     배제했다" 를 입증할 유일한 기록이고, 저작물성 다툼에서 창작적 기여의 근거도 겸한다.
#  ③ **재론 조건 — 둘 중 하나면 Vertex 재상신이다**(경계를 안 적으면 같은 고리를 또 돈다):
#     · 이미지를 **상시 생성**하는 쪽으로 전환할 때
#     · Gemini API 가 인덤니티 **비대상**임이 1차 출처로 확정될 때
#
# ── IP 분류: 「외부 에셋」이다 (팀장 판정 2026-08-13, 분기 B) ─────────────
# `CLAUDE.md` 의 *"파츠 에셋은 자작 지오메트리만(외부 에셋은 §6 법무)"* 에서 AI 생성
# 이미지는 **자작이 아니다.** 자작 지오메트리의 특권은 두 위험이 **구조적으로 0** 이라는
# 전제에서 오는데 여기서는 둘 다 성립하지 않는다 — ⓐ 타 IP 유사성 확률이 0이 아니고
# ⓑ 권리 계보가 Google 약관에 의존한다. 애매하면 무거운 쪽이 기본값이다(fail-closed).
# §6 은 **이미지 장 단위가 아니라 조달 유형 단위**로 1회 태운다(이번 법무 검토가 그것).
# 개별 이미지는 위 조건 준수 확인만 한다.
#
# ── secret 안전 조항 (보안담당 경계 2026-08-10 · 점검 2026-08-13) ─────────
#  · **`pull_request_target` 을 쓰지 않는다.** 그것을 켜는 순간 **포크 PR 의 코드가
#    secret 컨텍스트에서 실행**된다. 저장소 전체에 실사용 0건이고 앞으로도 0건이다.
#  · **`ci.yml` 에 secret 스텝을 넣지 않는다.** 거기엔 `pull_request:` 트리거가 있어
#    포크 PR 에서 secret 이 **빈 문자열**로 들어온다 → *"빈 키로 돌았는데 통과한 것처럼"*
#    보이는 형태가 생긴다(이 저장소가 이름 붙인 "못 잰 것이 통과로 적히는 경향").
#    그래서 **이 워크플로는 독립**이다.
#  · **액션은 SHA 로 고정**한다(태그 핀은 mutable — 공급망 경로).
#  · **로그 마스킹을 방어로 세지 않는다.** GitHub 은 `secrets.*` 를 `***` 로 가리지만
#    **변형되면 못 가린다**(base64·URL 인코딩·부분 문자열). 그래서 스크립트가 응답
#    본문을 통째로 찍지 않고, 키 형식을 추측하는 대신 **키 값 자체로 치환**한다
#    (`scripts/generate-image.mjs` 의 `maskSecrets`).
#  · ⚠ **아직 안 한 것 ①**: secret 이 repository 레벨이라 `.github/workflows/` 의 어떤
#    워크플로든 참조할 수 있다. Environment + required reviewers 로 좁히는 것이
#    보안담당 권고인데, **없는 environment 를 참조하면 GitHub 이 보호규칙 없이 자동
#    생성**해 "방어가 있는 것처럼 보이는 0" 이 된다. 그래서 감독이 설정을 만든 뒤에
#    넣는다 — 지금 넣으면 그것이야말로 이 저장소가 경계하는 장식이다.
#  · ⚠ **아직 안 한 것 ②**: 생성(secret·read)과 PR(write)을 **별도 job 으로 안 갈랐다.**
#    보안담당 권고였고 갈랐으면 경계가 하나 더 생긴다. 안 한 이유는 artifact 왕복이
#    붙는데 이 개발 환경에서 내가 artifact 를 받을 수단이 없어 **검증할 수 없었기**
#    때문이다. 검수관이 수용했다(2026-08-13, P-5): 외부 입력이 `prompt`/`out`/`aspect`
#    뿐이고 셸 인젝션 0 이 실측됐으며 위험 감소가 왕복 비용보다 작다.
#    **안 한 것을 안 했다고 적어 둔다** — 다음 사람이 다시 판단할 수 있게.

on:
  workflow_dispatch:
    inputs:
      prompt:
        # ⚠ 이 문구는 **세 곳에 공개된다** — 이 run 의 Inputs, PR 본문, 그리고 공개
        #   저장소이므로 로그인 없이 열린다(보안담당 실측). 개인정보를 적지 마라.
        description: '어떤 그림인가 (영어 권장 · 공개 저장소의 실행 기록에 남는다)'
        required: true
        type: string
      out:
        description: '저장 경로 (frontend/ 아래 · png/jpg/webp 만)'
        required: false
        default: 'frontend/img/hero.png'
        type: string
      aspect:
        description: '비율 (Imagen 경로에서만 적용된다)'
        required: false
        default: '16:9'
        type: choice
        options: ['16:9', '4:3', '1:1', '3:4', '9:16']

# 최상위는 최소로 두고, 필요한 job 에서만 올린다(`ci.yml` 과 같은 패턴).
permissions:
  contents: read

# 연타·오작동으로 동시에 여러 건이 돌면 요금이 배로 나간다. 앞 회차를 취소하지는
# 않는다 — 이미 요금이 나간 호출을 버리는 셈이라 이득이 없다.
concurrency:
  group: generate-image
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # PR 을 만들려면 쓰기가 필요하다 — **이 job 에만** 준다.
    permissions:
      contents: write
      pull-requests: write
    # ⚠ `inputs.out` 을 **한 곳에서만** 푼다(검수관 P-b). 첫 판본은 네 스텝이 각각
    #   `${{ inputs.out }}` 을 적었고, 그것이 이 저장소가 반복해서 대가를 치른 **값
    #   미러링**이다 — 한쪽만 고치면 아무도 모른다.
    env:
      OUT: ${{ inputs.out }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24' }

      - name: 앞 회차가 열어둔 PR 이 남아 있는지 본다
        env:
          GH_TOKEN: ${{ github.token }}
        # ⚠ **막지 않고 알린다** — `valuation.yml:72-88` 의 대응물은 `exit 1` 인데
        #   여기서는 warning 이다. 차이가 실재해서다: valuation 은 **매일 자동으로** 돌아
        #   미병합분이 누적되지만, 이것은 **감독이 손으로 1회** 누른다. 앞 PR 이 열려 있다고
        #   새 이미지를 못 만들 이유가 없고, 검수관도 거짓 FAIL 을 함께 적었다
        #   (*"감독이 리뷰 중이라 일부러 열어둔 PR 도 FAIL 로 잡힌다"*). 검수관 재검수에서
        #   **warning 유지는 승인됐다**(2026-08-13).
        #   ⚠ 첫 판본은 이 근거로 `valuation.yml:148` 을 들었는데 **대응물이 아니었다** —
        #   그 줄은 *auto-merge 실패* 에 대한 warning 이다(검수관 P-4). 인용을 정정한다.
        #
        # 조회 방식은 **`valuation.yml:85-91` 의 형태를 그대로 가져온다.** 첫 판본은
        # 미검증 `--search` 문법 + `2>/dev/null` 이었고, 검수관이 *"선례의 결론을 또 절반만
        # 가져왔다"* 고 잡았다(같은 회차 두 번째다). `--search` 는 문법에 의존하지만
        # `startswith` 는 안 하고, 실패 원인을 지우지 않아야 "못 봤다" 와 "없다" 가 갈린다.
        run: |
          set -euo pipefail
          if ! OPEN=$(gh pr list --state open --limit 100 --json headRefName \
                        --jq '[.[] | select(.headRefName | startswith("claude/generated-image-"))] | length' \
                      2> /tmp/gh-list-err); then
            echo "::warning::gh pr list 가 실패했다 — 앞 회차 PR 을 **못 봤다**(0건이라는 뜻이 아니다)."
            cat /tmp/gh-list-err
          elif [ "$OPEN" -gt 0 ]; then
            echo "::warning::앞 회차가 만든 PR 이 ${OPEN}건 열려 있다. 봇 PR 은 CI 가 저절로 안 붙는다(위 헤더) — 먼저 처리하라."
          fi

      - name: 이미지 생성
        env:
          # **환경변수로만 넘긴다** — 명령줄 인자는 프로세스 목록에 남는다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMAGE_PROMPT: ${{ inputs.prompt }}
          IMAGE_OUT: ${{ env.OUT }}
          IMAGE_ASPECT: ${{ inputs.aspect }}
        run: node scripts/generate-image.mjs

      # ⚠ **이 스텝이 팀장 조건의 「실물」을 담당한다**(검수관 B-3). 아래 열거 스텝이
      #   FAIL 하면 job 이 끝나고 runner 파일시스템이 사라진다 — 그러면 사람에게 남는 것이
      #   **청크 이름과 바이트 수뿐**이고, 팀장 조건 *"사람이 실물을 보고 판정"* 이 성립하지
      #   않는다. 게다가 판정 A 를 정한 근거가 **비가역성**(*"스트립→보존은 원본이 없어
      #   불가능"*)이었는데 그 구현이 원본을 버리면 근거와 정면으로 어긋난다.
      #   그래서 **열거보다 먼저**, 그리고 뒤 스텝의 성패와 무관하게 올린다.
      #   artifact 는 저장소 blob 이 아니라 만료·삭제가 되므로 "영구 커밋" 축에 안 걸린다.
      #   ⚠ 또 하나: `ACCEPTED` 는 **타입** 화이트리스트라 회차마다 내용이 달라도 통과한다.
      #   매 회차 실물을 여기 올려야 *"확인한 대상과 커밋되는 대상이 다른"* 형태를 막는다.
      - name: 생성물을 artifact 로 남긴다 (열거 실패해도)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-image-${{ github.run_id }}
          # ⚠ 여기만 **검증 전 원본 경로**를 쓴다(검수관 P-b). 스크립트가 정규화한 값을
          #   쓰려면 그 스크립트가 성공해야 하는데, 이 스텝은 **실패했을 때가 존재 이유**다.
          #   upload-artifact v4 는 hidden file 을 기본 제외하므로 `.git/` 은 안 올라간다.
          path: ${{ env.OUT }}
          # ⚠ `error` 가 아니라 `warn` 인 이유: 생성 스텝이 키 오류로 죽으면 파일이 아예
          #   없는데, 그때 이 스텝까지 빨간불이면 **진짜 원인이 로그에서 묻힌다.**
          #   실물이 없는 채로 진행되지는 않는다 — 다음 스텝의 `readFileSync` 가 죽는다.
          #   즉 B-3 의 보증("매 회차 실물이 남는다")은 **파일이 만들어진 회차에 한해** 참이다.
          if-no-files-found: warn
          retention-days: 14

      - name: 메타데이터를 열거하고, 확인 안 된 것이 있으면 커밋 전에 선다
        # **스트립하지 않는다 — 팀장 판정 2026-08-13(분기 A) = 보존.**
        # 근거는 "위생" 이 아니라 **비가역성**이다: 보존→스트립은 언제든 되지만
        # 스트립→보존은 원본이 없어 불가능하다. 게다가 스트립해도 SynthID 는 픽셀에
        # 남아 실익도 없다.
        #
        # ⚠ **`--fail-on-extra` 가 팀장 조건이다.** *"로그를 「찍기만」 하고 자동 커밋하면
        #   확인 없는 영구 blob 이다."* 공개 저장소는 커밋되면 blob 이 안 지워지므로
        #   **처음 보는 청크가 있으면 여기서 job 이 죽는다.** 사람이 로그를 읽고 판정한 뒤
        #   `png-chunks.mjs` 의 `ACCEPTED` 에 근거와 함께 올려야 다음 회차가 통과한다.
        #   그 목록은 **비어 있는 채로 시작한다** — 우리는 아직 실물을 본 적이 없다.
        #   그래서 **첫 dispatch 는 여기서 실패하는 것이 정상**이고, 그것이 설계다.
        run: node scripts/png-chunks.mjs "$OUT" --fail-on-extra

      - name: 브랜치에 올리고 PR 을 연다
        env:
          GH_TOKEN: ${{ github.token }}
          PROMPT: ${{ inputs.prompt }}
          ASPECT: ${{ inputs.aspect }}
        run: |
          set -euo pipefail
          # ⚠ 세 사건을 갈라 본다(검수관 P1). 첫 판본은 `git status` 빈 출력 하나로
          #   뭉개서, **파일이 만들어졌고 요금도 나갔는데** "안 만들었다" 고 적었다.
          if [ ! -e "$OUT" ]; then
            echo "::error::생성물이 없다 — 앞 스텝이 파일을 만들지 않았다."
            exit 1
          fi
          if [ -z "$(git status --porcelain -- "$OUT")" ]; then
            echo "::error::파일은 있으나 git 이 안 잡는다 — .gitignore 대상이거나 내용이 기존과 같다: $OUT"
            exit 1
          fi
          BRANCH="claude/generated-image-${GITHUB_RUN_ID}"
          BASENAME="$(basename -- "$OUT")"   # `--` 가 없으면 `--version` 같은 입력이 옵션으로 해석된다
          git config user.email noreply@anthropic.com
          git config user.name Claude
          git checkout -b "$BRANCH"
          git add -- "$OUT"
          # ⚠ 프롬프트를 **커밋 메시지에 넣지 않는다**(보안담당 ②). 커밋 메시지는
          #   force-push 로도 안 지워진다 — GitHub 이 dangling commit 을 SHA URL 로
          #   보관하므로 *"실수로 적었으니 지우면 된다"* 가 성립하지 않는다. PR 본문은
          #   편집·삭제가 되므로 거기에만 둔다.
          {
            echo "이미지를 생성한다 — ${BASENAME}"
            echo
            echo "workflow_dispatch 로 감독이 실행했다. 프롬프트·모델·크기는 이 run 에 있다:"
            echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          git push -u origin "$BRANCH"
          # ── PR 본문 ─────────────────────────────────────────────────────
          # ⚠ **검수관 판정 줄을 미리 박아 넣지 않는다.** `valuation.yml:141` 은
          #   `해당없음 (2등급)` 을 넣어 두는데, 그것을 복사하면 여기서는 FAIL 한다 —
          #   실측: `judge(["frontend/img/hero.png"])` = **1등급**(라이브 자산 + §6 축).
          #   `review-record.yml:45-48` 이 *"실제 등급이 1이면 해당없음은 FAIL"* 로
          #   그 자리를 이미 막고 있다. 사람이 실제 판정을 받아 적어야 한다.
          {
            echo "Gemini 로 생성한 이미지다. \`workflow_dispatch\` 로 감독이 실행했다."
            echo
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| 경로 | \`${OUT}\` |"
            echo "| 요청 비율 | ${ASPECT} |"
            echo "| run | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
            echo
            echo "**프롬프트**"
            echo
            echo '```'
            printf '%s\n' "$PROMPT"
            echo '```'
            echo
            echo "## ⚠ 이 PR 은 이대로 병합할 수 없다"
            echo
            echo "1. **필수 상태검사가 안 붙는다.** \`GITHUB_TOKEN\` 이 만든 push·PR 은"
            echo "   다른 워크플로를 발화하지 않는다(태스크 #130 실증, \`valuation.yml:119-123\`)."
            echo "   초록불이 없는 것은 *아직 안 돈 것* 이 아니라 **영영 안 도는 것**이다."
            echo "   → 사람이 이 브랜치에 커밋을 하나 얹으면 \`ci.yml\` 이 그때 돈다."
            echo "2. **이미지 파일만으로는 라이브에 안 나온다.** \`vite.config.js:96\` 의 정적"
            echo "   복사 목록에 \`img\` 가 없다 — HTML 이 \`./img/…\` 로 **참조해야** vite 가"
            echo "   \`_bundle/\` 로 굽는다(2026-08-13 실측). 참조 커밋이 함께 와야 한다."
            echo "3. **검수관 판정이 필요하다.** 이 변경은 1등급이다(라이브 자산 · §6 법무 축)."
            echo "   판정 줄은 사람이 받아 적는다 — 미리 박아 넣으면 \`review-record\` 가 FAIL 한다."
            echo "4. **역이미지 검색 결과를 이 본문에 적어야 한다**(팀장 조건 2026-08-13, 분기 C)."
            echo "   모델이 학습한 실존 건축을 그대로 뱉을 수 있고, 프롬프트에서 이름을 빼도 확률은 0이"
            echo "   아니다. CI 는 egress 차단이라 여기서 못 한다 — 환경 밖 브라우저에서 Google Lens ·"
            echo "   TinEye 로 1회 돌리고 결과를 적는다. **안 적으면 안 한 것으로 친다.**"
            echo
            echo "   - [ ] 역이미지 검색 1회 — 결과:"
            echo "   - [ ] 이미지 실물을 artifact 로 내려받아 열어 봤다"
            echo
            echo "## 메타데이터 — 무엇을 봤고 무엇을 못 봤나"
            echo
            echo "위 run 의 「메타데이터를 열거하고」 스텝이 초록이면 **알려진 청크 이름만 들어 있다**는"
            echo "뜻이다. 그 이상은 아니다 — 아래는 이 게이트가 **원리상 못 보는 것**이고, 초록이어도"
            echo "그대로 남아 있다(\`scripts/png-chunks.mjs\` 헤더의 한계 목록과 같은 내용이다)."
            echo
            echo "| 못 본 것 | 왜 |"
            echo "| --- | --- |"
            echo "| **SynthID 워터마크** | 메타데이터가 아니라 **픽셀**에 박힌다. 청크를 다 지워도 남는다 |"
            echo "| **트레일러에 붙은 것** | PNG는 \`IEND\`, JPEG는 첫 \`SOS\` 에서 열거를 멈춘다. 그 뒤는 시야 밖이다(실측) |"
            echo "| **청크 내용** | 이름과 바이트 수만 본다. \`caBX 12KB\` 가 무엇을 주장하는지는 안 본다 |"
            echo
            echo "그래서 **실물을 직접 여는 것이 위 체크박스에 있다.** 초록불을 실물 확인으로 갈음하지 마라 —"
            echo "이 게이트를 만든 팀장 조건이 바로 *\"사람이 실물을 보고 판정\"* 이었다."
            echo
            echo "처음 보는 청크가 있었다면 job 이 커밋 전에 죽어 이 PR 자체가 없다. 그때도 이미지는"
            echo "run 의 artifact 에 남는다."
          } > /tmp/pr-body.md
          gh pr create --base main --head "$BRANCH" \
            --title "이미지를 생성한다 — ${BASENAME}" \
            --body-file /tmp/pr-body.md
