name: ci
# 회귀 안전망 — lint·typecheck·단위테스트·헤드리스 렌더 스모크를 PR/푸시마다 자동 실행.
#
# 2스텝 롤인: 초기엔 독립·정보용(배포 무영향). 안정화 후 deploy.yml에 needs로
# 선행 게이트화한다(그 변경은 배포 구조 변경이라 §10-4 cross-review).
# 현재 위치 — **1스텝(독립·정보용).** 이 워크플로가 실패해도 배포는 나간다.
# 다음 단계(#127)에서 `workflow_call` + deploy.yml `needs: verify` 로 결선한다.
on:
  push:
    # `claude/**` — 작업 브랜치에서도 돈다. 이유 둘.
    #  ① 게이트를 main 에 결선하기 전에 **러너에서 실제로 도는지** 확인할 곳이 필요하다.
    #     PR 을 열지 않고, 배포에 손대지 않고 실측할 수 있는 유일한 경로다.
    #  ② 결선 후에도 남길 값이 있다 — 회귀를 main 도착 전에 잡는다.
    # 단계 3(#127)에서 `main` 만 뺀다(deploy.yml 이 workflow_call 로 부르므로 이중 실행이
    # 되기 때문). `claude/**` 는 deploy 와 무관하므로 그대로 둔다.
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch: {}
# 최소권한 — 검증 전용(체크아웃·설치·테스트)이라 쓰기 불요. (검수관 R4)
permissions:
  contents: read
env:
  # 배포물은 자기완결(npm 런타임 의존 0). 개발 도구만 설치하며, playwright 브라우저는
  # 이 job에서 불필요(단위·린트·타입체크 전용)하므로 postinstall 다운로드를 막는다.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: npm ci
      - name: Lint (baseline)
        run: npm run lint
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
      # no-undef 스코프 — @ts-nocheck 모듈의 끊긴 cross-module 참조를 상시 검출
      # (C-3(2) chibi 런타임 크래시가 정적 게이트 사각을 빠져나간 사건의 산물).
      - name: Reference integrity (no-undef scope)
        run: npm run check:refs
      - name: Unit tests (vitest)
        run: npm test

  # ── 헤드리스 렌더 스모크 ────────────────────────────────────────────────
  # verify 와 **병렬**로 돈다(의존 없음). 이 job 이 보는 것은 verify 가 못 보는 축이다 —
  # 실제 `_site` 조립·부팅·CSP·자기완결·가로넘침·성능 불변식.
  #
  # 조립 레시피는 `scripts/smoke/assemble.mjs` 가 deploy.yml 과 1:1 로 재현한다.
  # 그 미러링이 어긋나 있으면 "스모크 PASS + 배포 실패" 가 성립한다(2026-07-29 실제
  # 사례 — `cp ... || true` 로 실패를 삼키고 있었다). 두 파일은 함께 갱신할 것.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: npm ci
      # 브라우저 바이너리 캐시. 키는 lockfile 해시 — playwright 버전이 바뀌면 자동으로
      # 미스가 나야 하고, lockfile 이 곧 그 버전의 SSOT 다(버전 문자열을 따로 적어두면
      # 값 미러링이 된다).
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # 캐시 히트여도 apt 의존은 러너에 남지 않는다 — 그 부분만 따로 건다.
      - name: Install chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install chromium system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # SMOKE_CHROMIUM_EXECUTABLE 을 **주지 않는다.** config.mjs 의 해석 순서상
      # env 없음 → 개발 컨테이너 경로 없음 → undefined → playwright 자체 해석으로
      # 방금 설치한 브라우저를 쓴다. 러너에 절대경로를 박으면 그게 다음 하드코딩이 된다.
      #
      # SMOKE_PERF_GATES=observe — [7][8] 성능 게이트를 **관측 모드**로 돌린다.
      # 러너에서 한 번도 안 돌려본 게이트라, 1차부터 차단으로 걸면 빨간불의 원인이
      # "코드 회귀"인지 "게이트의 러너 부적합"인지 못 가른다(검수관 조건 3).
      # 10회 연속 관측에서 base.geo/base.tex 분산 0 을 확인한 뒤 enforce 로 승격한다.
      # **관측은 면제가 아니라 데이터 수집이다** — 승격 없이 이 줄이 남으면 그때부터
      # 장식이 된다.
      - name: Headless smoke (vite 조립)
        env:
          SMOKE_PERF_GATES: observe
        run: npm run smoke:vite
