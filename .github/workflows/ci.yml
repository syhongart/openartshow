name: ci
# 회귀 안전망 — lint·typecheck·단위테스트·헤드리스 렌더 스모크를 PR/푸시마다 자동 실행.
#
# 2스텝 롤인 **완료** — 이 워크플로는 이제 배포의 선행 게이트다.
# `deploy.yml` 이 `uses: ./.github/workflows/ci.yml` 로 부르고 `needs: verify` 로 잇는다.
# 여기가 빨간불이면 배포 job 이 아예 안 뜬다.
#
# `workflow_run` 이 아니라 `workflow_call` 인 이유(둘 다 검토했다):
#  · `workflow_run` 은 워크플로 파일을 **기본 브랜치 판본**으로 실행한다 → 게이트 변경
#    자체를 머지 전에 검증할 수 없다.
#  · 더 나쁜 것 — 체크아웃 기본값이 default branch HEAD 라 `ref: head_sha` 를 명시하지
#    않으면 **CI 가 통과시킨 커밋과 다른 커밋을 배포한다.** 무검증보다 나쁘다.
#  · 로컬 `./` 참조는 **호출자와 같은 커밋의 파일**을 쓴다 → 그 문제가 원천 소거된다.
on:
  push:
    # `main` 은 여기 없다. deploy.yml 이 workflow_call 로 부르므로, 남겨두면 main 푸시마다
    # 독립 ci 와 호출된 ci 가 **이중으로** 돈다.
    # `claude/**` 는 남긴다 — deploy 와 무관하고, 회귀를 main 도착 전에 잡는다.
    branches: ['claude/**']
  pull_request:
  workflow_call: {}
  workflow_dispatch: {}
# 최소권한 — 검증 전용(체크아웃·설치·테스트)이라 쓰기 불요. (검수관 R4)
permissions:
  contents: read
env:
  # 배포물은 자기완결(npm 런타임 의존 0). 개발 도구만 설치하며, playwright 브라우저는
  # 이 job에서 불필요(단위·린트·타입체크 전용)하므로 postinstall 다운로드를 막는다.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci
      - name: Lint (baseline)
        run: npm run lint
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
      # no-undef 스코프 — @ts-nocheck 모듈의 끊긴 cross-module 참조를 상시 검출
      # (C-3(2) chibi 런타임 크래시가 정적 게이트 사각을 빠져나간 사건의 산물).
      - name: Reference integrity (no-undef scope)
        run: npm run check:refs
      # ⚠ 아래 둘은 **신설 당시 여기에 안 들어와 배포 경로에서 아무것도 안 막고 있었다**
      # (검수관 블로커 B2, 2026-08-17). 로컬 `npm run gate` 와 pre-commit 훅에만 배선돼
      # 있었고 그것은 `--no-verify`·훅 미설치 세션·GitHub 웹 편집을 전부 통과한다.
      # 필수 상태검사는 `verify`·`smoke` 둘이므로 여기 없으면 **게이트가 아니다.**
      # `tests/gate.test.ts` 의 GS-A 가 이제 `GATES` ↔ 이 파일의 정합을 검사한다 —
      # 게이트를 새로 만들고 여기 안 넣으면 그 검사가 빨간불이 된다.
      - name: Import cycles (ARCHITECTURE §2 불변식 2)
        run: npm run check:cycles
      - name: File size freeze (신규 부채 차단)
        run: npm run check:filesize
      - name: Unit tests (vitest)
        run: npm test
      # 워크플로가 `git add` 하는 경로가 `.gitignore` 대상인지 — 2026-07-28 밸류에이션이
      # 매일 죽던 사고를 게이트로 만든 것(#129). ignored path 에 대한 `git add` 는 비영
      # 종료하고 Actions 기본 쉘은 `bash -e` 다.
      #
      # **경로 필터를 걸지 않고 항상 돈다.** 그 사고의 발단은 워크플로가 아니라
      # `.gitignore` 쪽 커밋이었다 — 트리거를 워크플로 diff 로 좁히면 재발만 잡고
      # 최초 발생과 같은 형태는 다시 못 잡는다. 비용은 파일 몇 개 읽기다.
      - name: Workflow git add / .gitignore 정합
        run: npm run check:gitadd

  # ── 헤드리스 렌더 스모크 ────────────────────────────────────────────────
  # verify 와 **병렬**로 돈다(의존 없음). 이 job 이 보는 것은 verify 가 못 보는 축이다 —
  # 실제 `_site` 조립·부팅·CSP·자기완결·가로넘침·성능 불변식.
  #
  # 조립 레시피는 `scripts/smoke/assemble.mjs` 가 deploy.yml 과 1:1 로 재현한다.
  # 그 미러링이 어긋나 있으면 "스모크 PASS + 배포 실패" 가 성립한다(2026-07-29 실제
  # 사례 — `cp ... || true` 로 실패를 삼키고 있었다). 두 파일은 함께 갱신할 것.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci
      # 브라우저 바이너리 캐시. 키는 lockfile 해시 — playwright 버전이 바뀌면 자동으로
      # 미스가 나야 하고, lockfile 이 곧 그 버전의 SSOT 다(버전 문자열을 따로 적어두면
      # 값 미러링이 된다).
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # 캐시 히트여도 apt 의존은 러너에 남지 않는다 — 그 부분만 따로 건다.
      - name: Install chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # ── 이 단계가 **두 번 연속 25분 매달려 job 을 죽였다** (2026-08-19) ──────────
      #
      # 실측:
      #   정상 소요        1분 43초   (08:14:36 → 08:16:19, 성공 회차)
      #   매달린 소요      25분 00초  × 2회 (03:09:19→03:34:15 · 08:15:01→08:39:57)
      #   그때 스모크 본체 skipped    ← **한 번도 시작하지 못했다**
      #
      # 두 회차가 똑같이 25분인 것은 우연이 아니라 위 `timeout-minutes: 25`(job 전체)에
      # 걸린 것이다. 같은 커밋의 브랜치 CI 는 14분 38초에 통과했으므로 코드가 아니라
      # 러너의 apt 다.
      #
      # **왜 `continue-on-error` 가 「실패를 삼키는 것」이 아닌가** — 이 단계는 **준비**이지
      # 검증이 아니다. 검증은 아래 스모크 본체이고, 준비가 부족하면 본체가 **명확히**
      # 실패한다. 신호가 사라지지 않는다. 지금이 오히려 이 저장소가 금지한 «못 잰 것» 이다
      # — 25분 매달리다 취소되면 아무 정보도 안 남는다.
      #
      # ⚠ **검수관 §5 의 「`continue-on-error` 자동 블로커」와 이 패턴은 다르다**(검수관
      # 확인 2026-08-19, 권고 P1). 그 규칙은 **게이트(검증 스텝) 자체**에 이것이 걸려
      # 실패가 아무 데도 안 남는 경우를 겨냥한다 — `cp … || true` 로 «스모크 PASS + 배포
      # 실패» 를 만든 그 사고다. 여기는 **검증 앞의 준비 스텝**이고, 그 실패가 곧바로
      # 검증 스텝으로 전파된다: `launchBrowser()` 는 어떤 catch 로도 감싸이지 않아
      # (`scripts/smoke/run.mjs` · `browser-checks.mjs` 실측) 의존이 실제로 없으면
      # `main().catch` → `process.exit(1)` 로 job 이 빨간불이 된다.
      # **판정이 사라지는 것이 아니라 다음 스텝으로 이연되는 것**이라 다르다.
      #
      # ⚠ **이 두 줄은 동시에 진단이다.** apt 가 5분에 끊긴 회차에 스모크가 **그냥
      # 통과하면**, 캐시 히트 경로에서 `install-deps` 가 애초에 불필요했다는 뜻이다
      # (러너에 라이브러리가 이미 있다). 그것이 관찰되면 이 단계를 **아예 뺀다** — 백로그
      # `G-CI2`. 반대로 스모크가 라이브러리 부재로 죽으면 이 단계는 필요한 것이고,
      # 그때는 apt 재시도나 미러 교체로 간다.
      #
      # 8분의 근거: 정상값 1분 43초의 **4.7배**. 최악 소요는 8 + 12분 36초(스모크 본체
      # 정상값) = 20분 36초로 job 상한 25분 안에 남는다(앞 단계들 합계 약 17초 포함해도).
      # ⚠ 처음에 5분(2.9배)으로 잡았다가 넓혔다 — **정상값이 표본 1개**라, 러너가 느린 날
      # 정상적으로 3~4분 걸리면 오탐으로 끊긴다(검수관 권고 P2). 끊겨도 «조용한 초록불» 이
      # 아니라 «노이즈 있는 빨간불» 이라 안전 방향이지만, 노이즈를 줄일 여유가 상한 안에
      # 있으면 넓히는 쪽이 맞다.
      - name: Install chromium system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        timeout-minutes: 8
        continue-on-error: true
        run: npx playwright install-deps chromium
      # SMOKE_CHROMIUM_EXECUTABLE 을 **주지 않는다.** config.mjs 의 해석 순서상
      # env 없음 → 개발 컨테이너 경로 없음 → undefined → playwright 자체 해석으로
      # 방금 설치한 브라우저를 쓴다. 러너에 절대경로를 박으면 그게 다음 하드코딩이 된다.
      #
      # SMOKE_PERF_GATES=observe — [7][8] 성능 게이트를 **관측 모드**로 돌린다.
      # 러너에서 한 번도 안 돌려본 게이트라, 1차부터 차단으로 걸면 빨간불의 원인이
      # "코드 회귀"인지 "게이트의 러너 부적합"인지 못 가른다(검수관 조건 3).
      #
      # 승격 조건은 `scripts/smoke/run.mjs` 의 PERF_GATES 주석이 SSOT 다(여기 값을
      # 다시 적으면 한쪽만 고쳐도 아무도 모른다). 회차 집계는 태스크 #126.
      # **관측은 면제가 아니라 데이터 수집이다** — 승격 없이 이 줄이 남으면 그때부터
      # 장식이 된다.
      #
      # 성능 판정만 INFO 로 내려간다. 콘솔 에러·pageerror 가 잡히면 observe 에서도
      # FAIL 이다 — 페이지 에러는 러너 성능 편차가 아니다(검수관 B1).
      - name: Headless smoke (vite 조립)
        env:
          SMOKE_PERF_GATES: observe
        run: npm run smoke:vite
