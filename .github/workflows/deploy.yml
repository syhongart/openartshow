name: build-and-deploy
# 결선 검증(#127)은 끝났으므로 임시로 넓혔던 `claude/**` 를 도로 좁힌다 — 남겨두면
# 브랜치 푸시마다 스모크가 두 번 돈다(ci.yml 독립 run + 여기서 호출한 verify).
# 검증 결과는 run 30434091542(정상 → deploy 실행)와 30434607110(타입 에러 → deploy
# **skipped**)에 남아 있다. 게이트는 막히는 것을 본 뒤에야 통과다.
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: write }
# [동시성 게이트] gh-pages 배포는 항상 최신 커밋 1건만 반영한다. 큐에 밀린 옛 run이 뒤늦게
# 실행돼 최신 배포를 덮거나(구버전 롤백), 두 run이 gh-pages에 동시 push해 한쪽이 rejected로
# 실패하는 레이스를 차단 — 새 배포가 시작되면 진행 중·대기 중인 이전 배포를 자동 취소한다.
concurrency:
  group: pages-deploy
  cancel-in-progress: true
jobs:
  # [검증 게이트] lint·typecheck·참조무결성·단위테스트 + 헤드리스 렌더 스모크.
  # 정의는 ci.yml 한 곳뿐이다 — 여기에 스텝을 복제하면 검증 정의가 두 곳으로 갈라지고,
  # 그것이 이 저장소가 세 번 겪은 **값 미러링** 사고와 같은 구조가 된다.
  #
  # 로컬 `./` 참조는 **호출자와 같은 커밋**의 ci.yml 을 쓴다. 즉 게이트를 바꾸는 커밋도
  # 그 커밋 자신의 게이트로 검증된다.
  # permissions 는 호출된 워크플로가 좁힐 수만 있다 — write → read 는 좁히는 방향이라 합법.
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    # **이 한 줄이 게이트다.** verify 가 실패하면 이 job 은 아예 뜨지 않는다.
    # 오랫동안 deploy.yml 에는 검증 스텝이 0개였고, ci.yml 은 같은 push 에 병렬로 떠서
    # 빨간불이어도 배포가 나갔다. `ci.yml` 주석에 결선 계획이 적혀만 있었다.
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '20', cache: 'npm' }
      # vite 빌드 도구 설치. 런타임 배포물은 npm 의존 0 — 이 의존성은 빌드 전용.
      # 배포엔 브라우저 불요 → playwright/puppeteer 브라우저 다운로드 억제(시간·실패 회피).
      #
      # **생성기보다 앞이다.** 예전에는 생성기가 `npm ci` 앞에 있었는데, 스모크는
      # `node_modules` 가 설치된 상태에서 같은 생성기를 돌린다(검사1). 지금은 생성기 셋 다
      # `node:` 내장만 쓰므로 무해하지만, 그중 하나가 npm 의존을 얻는 순간
      # **"스모크 PASS + 배포 실패" 가 즉시 부활한다.** 비용 0 이므로 미리 막는다.
      # (검수관 R2 — `|| true` 로 막은 구멍의 다른 문이었다.)
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PUPPETEER_SKIP_DOWNLOAD: '1'
      # 생성기 — devlog/team/valuation·making·licenses·sitemap·robots 산출. vite build 이전 실행.
      # 개수를 적지 않는다(옛 주석은 "4종"이었다) — 목록이 늘 때 숫자만 남으면 거짓말이 된다.
      # 이 목록의 SSOT 는 `scripts/smoke/config.mjs` 의 `GENERATORS` 이고 여기와 1:1 이어야
      # 한다. 스모크 검사1 이 그 배열을 돌리므로, 어긋나면 한쪽만 검증된다.
      - run: |
          node scripts/build-devlog.mjs
          node scripts/build-team.mjs
          node scripts/build-valuation.mjs
          node scripts/build-making.mjs
          node scripts/build-licenses.mjs
      # Vite 배포기: dist(base /openartshow/) = 배포구조. HTML rename·CSP정합·자기완결은
      # vite.config 플러그인이 수행 → 소스 재배치 cp 로직 폐지(landing→index 등도 vite 가).
      - run: npx vite build
      # 조립: vite dist 를 통째 _site 로 + 생성기 산출물(devlog·team·valuation·sitemap·robots).
      #
      # 이 산출물들은 저장소에 커밋되지 않는다(.gitignore) — 위 생성기 3종이 만든 것이
      # 유일한 원본이다. 그래서 **복사 실패를 삼키면 안 된다.** 예전에는 `2>/dev/null ||
      # true` 였는데, 그때는 커밋된 사본이 안전망이었다. 지금 그걸 남겨두면 생성기가 조용히
      # 실패했을 때 sitemap·robots 없는 사이트가 그대로 배포되고 아무도 모른다.
      #
      # `_deploy-sha.txt` — **어느 커밋이 배포됐는지**를 배포물 자신이 들고 있게 한다.
      # 이것이 없으면 `verify-live` 가 "옛 판본이 그대로 200"인 경우를 통과시킨다
      # (검수관 B1). 롤백으로 보안 패치가 유실된 사고가 정확히 그 모양이었고,
      # 200·자산 0·콘솔 0 만으로는 그것을 판정할 수 없다.
      #
      # 파일명은 `scripts/smoke/config.mjs` 의 `DEPLOY_SHA_FILE` 에서 **읽어 온다.**
      # 처음엔 `env:` 에 문자열로 적어놓고 "SSOT 에서 온다"고 주석을 달았는데, 그것은
      # 상수 이름만 빌려온 것이지 유도가 아니었다 — 복사본은 그대로 둘이었다(검수관 N3).
      # 값 미러링을 지적받아 고친 커밋이 값 미러링을 다시 만든 것이 이번이 세 번째다.
      - run: |
          set -euo pipefail
          DEPLOY_SHA_FILE="$(node -e "import('./scripts/smoke/config.mjs').then(m=>process.stdout.write(m.DEPLOY_SHA_FILE))")"
          rm -rf _site && mkdir -p _site
          cp -r dist/.          _site/
          cp -r making devlog team valuation _site/
          cp sitemap.xml robots.txt _site/
          printf '%s\n' "$GITHUB_SHA" > "_site/$DEPLOY_SHA_FILE"
          touch _site/.nojekyll
      # **gh-pages 를 건드리는 유일한 스텝. main 에서만 돈다.**
      # 위 트리거가 `claude/**` 를 포함하는 동안(결선 검증 기간) 이 가드가 실제 배포를
      # 막는다. 검증이 끝나 트리거를 좁힌 뒤에도 이 줄은 남긴다 — 트리거가 다시 넓어져도
      # 라이브가 안 나가는 방어심층이다. 조립까지는 브랜치에서도 돌아 조립 자체를 검증한다.
      - uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages

  # ── 배포된 라이브 URL 을 실제로 열어본다 ────────────────────────────────────
  # **이 job 은 막지 않는다. 알린다.** `needs: deploy` 라 배포가 끝난 뒤에 돈다 —
  # 여기서 FAIL 이 나도 이미 나간 배포를 되돌리지 않는다(자동 롤백은 별건).
  #
  # 그래도 세우는 이유: 지금까지 **publish 이후를 아무도 안 봤다.** `_site` 검사 PASS 는
  # `https://…/openartshow/guide.html` 200 을 뜻하지 않는다 — gh-pages 반영·Pages 빌드·
  # base path 해석·캐시가 전부 그 사이에 있다. 검수관을 신설하게 만든 사고(guide.html
  # 라이브 404)가 정확히 이 자리에서 났고, 그 구멍이 오늘까지 열려 있었다.
  # 이 job 이 줄이는 것은 "라이브가 깨진 것을 감독이 발견하기까지의 시간"이다.
  #
  # 브라우저 캐시 키는 smoke job 과 **같다**(둘 다 lockfile 해시). `needs: deploy` 라
  # smoke 가 끝난 뒤 시작하므로 그때는 이미 저장돼 있어 히트한다. 키가 겹쳐도
  # `actions/cache` 는 중복 저장을 경고로 처리하고 job 을 깨지 않으므로, 순서에
  # 의존하지 않아도 안전하다 — 실질 비용은 캐시 미스 시 1~2분뿐이다.
  verify-live:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    # **최소권한.** 워크플로 레벨은 `contents: write` 지만 이 job 이 하는 일은
    # checkout · npm ci · 브라우저로 URL 열기뿐이다 — 쓰기가 전혀 필요 없다.
    # write 가 필요한 것은 `actions-gh-pages` 가 있는 `deploy` job 하나다(검수관 조건 2,
    # `ci.yml` 이 같은 이유로 read 로 좁힌 전례가 있다).
    #
    # 이 한 줄이 "아무것도 바꾸지 않고 관찰만 한다"는 이 job 의 성격에 대한 **구조적
    # 보증**이기도 하다 — 관측 데이터를 저장소에 커밋해 쌓는 설계를 원천 차단한다
    # (그 경로는 자기 트리거 루프를 만든다: 배포 → verify-live → 커밋 → 배포 → …).
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # 스크립트 내부 마감(11분)이 **항상 먼저 이겨야** 리포트가 나온다. 러너가 job 을
    # 죽이면 페이지별 근거가 한 줄도 안 남는다 — 마감 11분 + 최대 라운드 5분 + 셋업 3분
    # 을 덮도록 25분으로 잡는다(검수관 N4). 이 값은 안전망이지 판정 수단이 아니다.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      # puppeteer postinstall 의 Chrome 다운로드도 막는다. 알림 전용 job 에 네트워크
      # 실패 표면을 하나 더 다는 셈이고, 그 실패는 로그상 "라이브가 깨졌다"와 구별되지
      # 않는다(검수관 R3 — deploy job 에는 이미 있었다).
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install chromium system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # `SMOKE_LIVE_BASE_URL` 을 주지 않는다 — `scripts/site-url.mjs` 의 실제 배포 URL 을
      # 본다. 그 env 는 로컬 로직 검증·뮤테이션 전용 주입점이다.
      # `GITHUB_SHA` 는 러너가 자동으로 넣는다 → `_deploy-sha.txt` 대조(④)가 켜진다.
      #
      # `timeout-minutes` 는 안전망일 뿐 판정 수단이 아니다. 스크립트가 내부 마감
      # (기본 11분)을 지켜 라운드를 끊고 **리포트를 반드시 출력한다** — 러너가 job 을
      # 죽이면 페이지별 근거가 한 줄도 안 남는다(검수관 R1).
      - name: 라이브 URL 검증 (200 · 자산 0 · 콘솔 0 · 판본 일치)
        run: npm run smoke:live
