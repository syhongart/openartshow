name: build-and-deploy
# `claude/**` 는 **결선 검증용 임시 트리거**다(#127 단계 3). 브랜치에서도 이 워크플로를
# 돌려 "verify 가 막으면 deploy 가 skipped 되는가"를 눈으로 확인한다. publish 스텝이
# `github.ref` 로 막혀 있어 브랜치에서는 gh-pages 를 건드리지 않는다.
# **검증이 끝나면 이 줄에서 `claude/**` 를 뺀다** — 안 빼면 브랜치 푸시마다 스모크가
# 두 번 돈다(ci.yml 독립 run + 여기서 호출한 verify).
on: { push: { branches: [main, 'claude/**'] }, workflow_dispatch: {} }
permissions: { contents: write }
# [동시성 게이트] gh-pages 배포는 항상 최신 커밋 1건만 반영한다. 큐에 밀린 옛 run이 뒤늦게
# 실행돼 최신 배포를 덮거나(구버전 롤백), 두 run이 gh-pages에 동시 push해 한쪽이 rejected로
# 실패하는 레이스를 차단 — 새 배포가 시작되면 진행 중·대기 중인 이전 배포를 자동 취소한다.
concurrency:
  group: pages-deploy
  cancel-in-progress: true
jobs:
  # [검증 게이트] lint·typecheck·참조무결성·단위테스트 + 헤드리스 렌더 스모크.
  # 정의는 ci.yml 한 곳뿐이다 — 여기에 스텝을 복제하면 검증 정의가 두 곳으로 갈라지고,
  # 그것이 이 저장소가 세 번 겪은 **값 미러링** 사고와 같은 구조가 된다.
  #
  # 로컬 `./` 참조는 **호출자와 같은 커밋**의 ci.yml 을 쓴다. 즉 게이트를 바꾸는 커밋도
  # 그 커밋 자신의 게이트로 검증된다.
  # permissions 는 호출된 워크플로가 좁힐 수만 있다 — write → read 는 좁히는 방향이라 합법.
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    # **이 한 줄이 게이트다.** verify 가 실패하면 이 job 은 아예 뜨지 않는다.
    # 오랫동안 deploy.yml 에는 검증 스텝이 0개였고, ci.yml 은 같은 push 에 병렬로 떠서
    # 빨간불이어도 배포가 나갔다. `ci.yml` 주석에 결선 계획이 적혀만 있었다.
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '20', cache: 'npm' }
      # 생성기 3종(선행) — devlog/team/valuation·sitemap 산출. vite build 이전 실행.
      - run: |
          node scripts/build-devlog.mjs
          node scripts/build-team.mjs
          node scripts/build-valuation.mjs
      # vite 빌드 도구 설치. 런타임 배포물은 npm 의존 0 — 이 의존성은 빌드 전용.
      # 배포엔 브라우저 불요 → playwright/puppeteer 브라우저 다운로드 억제(시간·실패 회피).
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PUPPETEER_SKIP_DOWNLOAD: '1'
      # Vite 배포기: dist(base /openartshow/) = 배포구조. HTML rename·CSP정합·자기완결은
      # vite.config 플러그인이 수행 → 소스 재배치 cp 로직 폐지(landing→index 등도 vite 가).
      - run: npx vite build
      # 조립: vite dist 를 통째 _site 로 + 생성기 산출물(devlog·team·valuation·sitemap·robots).
      #
      # 이 산출물들은 저장소에 커밋되지 않는다(.gitignore) — 위 생성기 3종이 만든 것이
      # 유일한 원본이다. 그래서 **복사 실패를 삼키면 안 된다.** 예전에는 `2>/dev/null ||
      # true` 였는데, 그때는 커밋된 사본이 안전망이었다. 지금 그걸 남겨두면 생성기가 조용히
      # 실패했을 때 sitemap·robots 없는 사이트가 그대로 배포되고 아무도 모른다.
      - run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site
          cp -r dist/.          _site/
          cp -r devlog team valuation _site/
          cp sitemap.xml robots.txt _site/
          touch _site/.nojekyll
      # **gh-pages 를 건드리는 유일한 스텝. main 에서만 돈다.**
      # 위 트리거가 `claude/**` 를 포함하는 동안(결선 검증 기간) 이 가드가 실제 배포를
      # 막는다. 검증이 끝나 트리거를 좁힌 뒤에도 이 줄은 남긴다 — 트리거가 다시 넓어져도
      # 라이브가 안 나가는 방어심층이다. 조립까지는 브랜치에서도 돌아 조립 자체를 검증한다.
      - uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
