name: build-and-deploy
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '20', cache: 'npm' }
      # 생성기 3종(선행) — devlog/team/valuation·sitemap 산출. vite build 이전 실행.
      - run: |
          node scripts/build-devlog.mjs
          node scripts/build-team.mjs
          node scripts/build-valuation.mjs
      # vite 빌드 도구 설치. 런타임 배포물은 npm 의존 0 — 이 의존성은 빌드 전용.
      # 배포엔 브라우저 불요 → playwright/puppeteer 브라우저 다운로드 억제(시간·실패 회피).
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PUPPETEER_SKIP_DOWNLOAD: '1'
      # Vite 배포기: dist(base /openartshow/) = 배포구조. HTML rename·CSP정합·자기완결은
      # vite.config 플러그인이 수행 → 소스 재배치 cp 로직 폐지(landing→index 등도 vite 가).
      - run: npx vite build
      # 조립: vite dist 를 통째 _site 로 + 생성기/정적(devlog·team·valuation·sitemap·robots).
      - run: |
          rm -rf _site && mkdir -p _site
          cp -r dist/.          _site/
          cp -r devlog team valuation _site/
          cp sitemap.xml robots.txt _site/ 2>/dev/null || true
          touch _site/.nojekyll
      - uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
