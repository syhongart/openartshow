# 매일 새벽 4시(KST) 시장가치 자동 산출 — 영구 스케줄러
# KST 04:00 = UTC 19:00 (전날). GitHub Actions cron은 UTC 기준.
# 주의: 스케줄 워크플로는 기본 브랜치에서만 발화한다. artshow 이전 후
#       기본 브랜치(main)에 이 파일이 있고 Actions가 켜져 있어야 동작한다.
name: daily-valuation
on:
  schedule:
    - cron: '7 19 * * *'   # 매일 04:07 KST
  workflow_dispatch: {}     # 수동 실행 버튼

permissions:
  contents: write
  # PR 생성·자동병합에 필요하다. `main` 이 보호돼 있어 직접 push 가 거부되므로
  # 봇도 PR 을 거친다(감독 카드 판정 2026-08-05 *"봇도 PR로"*).
  pull-requests: write

jobs:
  valuate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      # `build-devlog.mjs` 는 안 돌린다. 그것이 만드는 것(devlog/·sitemap.xml·robots.txt)은
      # **전부 `.gitignore` 대상**이라 여기서 만들어도 커밋되지 않고, 배포 때 `deploy.yml`
      # 이 다시 만든다. 예전에는 이 스텝이 만든 sitemap.xml 을 아래에서 `git add` 하려다
      # 워크플로가 죽었다(아래 참조).
      - name: 밸류에이션 산출
        run: node scripts/build-valuation.mjs
      - name: README 갱신
        run: node scripts/build-readme.mjs
      - name: 변경 시 커밋
        # ── 2026-07-28 부터 매일 실패하고 있었다 ────────────────────────────
        # 로그 실물(run 30396000067):
        #   The following paths are ignored by one of your .gitignore files:
        #   sitemap.xml
        #   valuation
        #   ##[error]Process completed with exit code 1.
        #
        # 원인: 2026-07-27 생성물 구조화로 `valuation/`·`sitemap.xml` 이 `.gitignore` 로
        # 들어갔는데(`.gitignore:105-106`) 이 워크플로의 `git add` 목록은 그대로였다.
        # ignored path 에 대한 `git add` 는 **비영 종료**하고 Actions 기본 쉘은 `bash -e` 다.
        # 구조를 바꾸면서 이 워크플로를 같이 안 본 것이다.
        #
        # 더 고약한 것: `git status --porcelain` 은 ignored 파일을 안 보여주므로 조건문은
        # `docs/valuation-history.json` 변화로만 발화했다. 즉 **발화하는 날에만 죽는**
        # 구조였고, 값이 안 바뀐 날은 조용히 "변경 없음 — 스킵" 으로 통과했다.
        #
        # 이 저장소에서 추적되는 생성물은 `docs/valuation-history.json` 하나뿐이다
        # (산출물이 아니라 **상태**다 — 날짜별 이력이라 다시 만들 수 없다).
        # ── 2026-07-30 부터 **또** 매일 실패했다 — 이번엔 main 보호 규칙 (7일 연속) ──
        # 로그 실물(run 30948796238):
        #   remote: error: GH013: Repository rule violations found for refs/heads/main.
        #   remote: - Changes must be made through a pull request.
        #   remote: - 2 of 2 required status checks are expected.
        #   ! [remote rejected] main -> main (push declined)
        #
        # 07-29 성공 / 07-30 실패이므로 그 사이에 `main` 보호가 켜졌다. **보호 자체는
        # 좋은 변화**인데 봇만 옛 방식(직접 push)에 남아 7일을 거부당했다.
        #
        # ⚠ 아래 `for i in 1 2 3` 재시도는 **이 실패에 무력했다.** 재시도는 경합
        # (non-fast-forward)을 푸는 장치이고 **정책 위반은 세 번 다 같은 이유로 거부된다.**
        # 재시도가 있으니 견고하다고 읽힐 자리였다 — 무엇을 푸는 장치인지 적어 둔다.
        #
        # 감독 카드 판정(2026-08-05): **"봇도 PR로"** — 보호를 그대로 두고 봇을 규칙에 맞춘다.
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # ── 미병합 봇 PR 이 남아 있으면 **여기서 죽는다** (검수관 블로커 B1) ──────
          # 아래 「PR 생성 + 자동 병합」 의 `gh pr merge --auto` 는 **거는 데 성공하면**
          # `||` 뒤가 실행되지 않는다. 상태검사가 영원히 pending 이면(아래 함정 주석)
          # job 은 매일 **초록으로 끝나고** 실제 병합은 결코 일어나지 않는다 —
          # 이 워크플로가 고치려던 결함(*"발화하는 날에만 죽고 조용히 스킵"*)과 **같은
          # 형태**이고, 붉은 X 조차 없어져 이전보다 나쁘다.
          #
          # 그래서 **다음 회차가 그것을 발견하게 한다.** 어제 것이 안 병합됐으면 오늘
          # 빨간불이 뜬다. 브랜치를 만들기 전에 막으므로 `bot/valuation-*` 누적도 없다(권고 R1).
          #
          # ⚠ 조회 자체가 실패한 경우와 **구분해서** 적는다(검수관 비블로커). `set -e` 아래서는
          # 둘 다 똑같이 job 을 죽이는데, `::error::` 문구가 전자를 후자로 읽히게 한다 —
          # "미병합 PR 이 있다" 와 "미병합 PR 이 있는지 못 봤다" 는 다른 사건이다.
          if ! OPEN=$(gh pr list --state open --limit 100 --json headRefName \
                        --jq '[.[] | select(.headRefName | startswith("bot/valuation-"))] | length' \
                      2> /tmp/gh-list-err); then
            echo "::error::gh pr list 가 실패했다 — 미병합 봇 PR 확인 자체를 **못 했다**(미병합이 있다는 뜻이 아니다)."
            cat /tmp/gh-list-err
            exit 1
          fi
          if [ "$OPEN" -gt 0 ]; then
            echo "::error::이전 회차 봇 PR 이 ${OPEN} 건 미병합으로 남아 있다 — 병합 경로가 막혀 있다."
            echo "::error::https://github.com/${GITHUB_REPOSITORY}/pulls?q=is%3Apr+is%3Aopen+head%3Abot%2Fvaluation"
            exit 1
          fi
          git config user.name  "artshow-bot"
          git config user.email "bot@artshow.local"
          if [ -z "$(git status --porcelain docs/valuation-history.json README.md)" ]; then
            echo "변경 없음 — 스킵"
            echo "changed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # build-team.mjs 산출물(making/team/)은 .gitignore 대상이므로 커밋하지 않는다.
          # 배포 때 deploy.yml 이 다시 만든다. 인사기록 갱신은 README 의 자동 블록을 통해 반영.
          BR="bot/valuation-$(date -u +%Y%m%d-%H%M%S)"
          git switch -c "$BR"
          git add docs/valuation-history.json README.md
          git commit -m "chore(valuation): $(date -u +%Y-%m-%d) 자동 산출"
          git push -u origin "$BR"
          echo "branch=$BR"   >> "$GITHUB_OUTPUT"
          echo "changed=1"    >> "$GITHUB_OUTPUT"

      - name: PR 생성 + 자동 병합
        if: steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BR: ${{ steps.commit.outputs.branch }}
        # ⚠⚠ **알려진 함정 — 이 스텝이 성공해도 병합은 안 될 수 있다.**
        # `GITHUB_TOKEN` 으로 만든 push·PR 은 **다른 워크플로를 발화하지 않는다**(무한 루프
        # 방지 정책). 이 저장소는 그것을 이미 실증했다 — 태스크 #130 *"봇 커밋이 배포를
        # 발화하지 않는다"*. 그러면 `ci.yml` 이 안 돌아 **필수 상태검사가 영원히 pending**
        # 이고 auto-merge 가 걸린 채 멈춘다.
        #
        # 그래도 **지금보다 낫다**: 예전에는 실패가 조용했고(7일 동안 아무도 몰랐다)
        # 감독이 발견했다. 이제는 **PR 이 열린 채 남아 눈에 보인다.**
        #
        # 근본 해소는 PAT(감독 작업) 또는 ruleset 봇 우회(감독 작업)이고, 어느 쪽이든
        # 감독 판정이 필요하다 — 그래서 여기서 정하지 않는다. 실측 결과는 태스크 #204 에.
        run: |
          set -euo pipefail
          # ⚠ heredoc 을 쓰지 않는다. YAML 블록 안에서는 종료 표식이 들여쓰기되는데
          # `<<'EOF'` 는 들여쓴 `EOF` 를 인식하지 않아 스크립트가 통째로 삼켜진다.
          # 파일로 쓰면 그 함정이 없다.
          {
            echo "밸류에이션 자동 산출 — \`daily-valuation\` 워크플로가 생성했다."
            echo
            echo "변경은 \`docs/valuation-history.json\`(추적되는 **상태** — 날짜별 이력이라"
            echo "다시 만들 수 없다)과 \`README.md\` 자동 블록뿐이다."
            echo
            echo "검수관 판정: 해당없음 (2등급 — 봇 자동 산출, 문서만. 라이브 런타임 도달 0)"
          } > /tmp/pr-body.md
          gh pr create --base main --head "$BR" \
            --title "chore(valuation): $(date -u +%Y-%m-%d) 자동 산출" \
            --body-file /tmp/pr-body.md
          # auto-merge 가 안 걸려도 **워크플로를 죽이지 않는다** — PR 은 이미 열렸고,
          # 그것이 이 변경의 핵심(실패가 보이게 하는 것)이다.
          gh pr merge --auto --squash "$BR" \
            || echo "::warning::auto-merge 를 못 걸었다 — PR 이 열린 채 남는다(위 주석의 알려진 함정)"
