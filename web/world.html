<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- 오픈월드(파셀 스트리밍) 스파이크: 자기완결(외부 호스트 0). CSP default-src 'self'. behind-flag: 어디에도 링크하지 않음. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'">
<title>오픈월드 · OpenArtShow</title>
<link rel="stylesheet" href="./vendor/fonts/fonts.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<style>
  :root{
    --bg:#14151A; --ink:#F5F5F2; --dim:#9A9EB1; --line:#3A3D4B;
    --violet:#8B72FF; --cyan:#72E6E1; --coral:#FF705E;
    --glass:linear-gradient(180deg, rgba(46,48,61,.72), rgba(20,21,27,.82));
    --app:var(--app-font, -apple-system,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;width:100%;background:var(--bg);color:var(--ink);font-family:var(--app);overflow:hidden;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  .plate{position:fixed;z-index:10;background:var(--glass);
    -webkit-backdrop-filter:blur(11px) saturate(150%);backdrop-filter:blur(11px) saturate(150%);
    border:1px solid rgba(255,255,255,.10);border-radius:14px;
    box-shadow:0 14px 32px -12px rgba(0,0,0,.52), inset 0 1px 0 rgba(255,255,255,.13)}

  .hud-info{top:16px;left:16px;padding:13px 18px;max-width:min(72vw,340px)}
  .hud-info .titlerow{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .hud-info .tick{width:3px;height:16px;border-radius:2px;background:var(--cyan);flex:none}
  .hud-info .title{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
  .hud-info .hint{font-size:11.5px;color:var(--dim);line-height:1.6}
  .hud-info .hint b{color:var(--ink);font-weight:600}
  .hud-info .pcell{margin-top:6px;font-size:11px;color:var(--cyan)}

  /* 클릭 유도 오버레이(데스크톱) */
  #enter{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;
    background:radial-gradient(120% 90% at 50% 40%, rgba(20,21,26,.35), rgba(10,10,14,.72));cursor:pointer;text-align:center;padding:24px}
  #enter .big{font-size:19px;font-weight:700;letter-spacing:-.01em}
  #enter .sub{font-size:12.5px;color:var(--dim);line-height:1.7}
  #enter.hide{display:none}

  /* NPC 말풍선 토스트(하단 중앙) */
  #chat{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;max-width:88vw}
  #chat .bub{background:rgba(20,21,27,.82);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 14px;font-size:12.5px;line-height:1.5;
    opacity:0;transform:translateY(8px);transition:.25s cubic-bezier(.2,.8,.2,1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:88vw}
  #chat .bub.on{opacity:1;transform:translateY(0)}
  #chat .bub .nm{color:var(--cyan);font-weight:700;margin-right:7px}

  /* 모바일 조이스틱 */
  #joy{display:none;position:fixed;left:20px;bottom:26px;z-index:20;width:112px;height:112px;border-radius:999px;
    background:rgba(20,21,27,.42);border:1px solid rgba(255,255,255,.12);touch-action:none}
  #joy .nub{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:999px;
    background:rgba(139,114,255,.55);border:1px solid rgba(255,255,255,.35);box-shadow:0 4px 12px -4px rgba(0,0,0,.6)}
  .is-touch #enter{display:none}
  .is-touch #joy{display:block}

  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div class="plate hud-info">
  <div class="titlerow"><span class="tick"></span><span class="title">오픈월드 · 파셀 스트리밍</span></div>
  <div class="hint" id="hintDesk"><b>클릭</b>해 둘러보기 · <b>WASD</b> 이동 · 마우스 시선 · <b>ESC</b> 커서 해제</div>
  <div class="hint mobhint" style="display:none">왼쪽 <b>조이스틱</b> 이동 · 오른쪽 <b>드래그</b> 시선</div>
  <div class="hint">문(개구부)을 지나 옆 전시실로 걸어서 넘어가 보세요.</div>
  <div class="pcell" id="pcell">파셀 (0,0)</div>
</div>

<div id="enter">
  <div class="big">클릭해 둘러보기</div>
  <div class="sub">WASD 이동 · 마우스로 시선 · 옆 방으로 걸어서 이동</div>
</div>

<div id="chat"></div>
<div id="joy"><div class="nub" id="joyNub"></div></div>

<script type="module">
import { SPACE_PRESETS } from './js/space-presets.js';
import { normalizeSpace } from './js/space.js';
import { encodeChibi, randomChibiChar } from './js/chibi.js';
import { createWorld } from './js/world.js';

// ── 정적 파셀 2개(프리셋 재사용) — 공유 경계에 개구부. behind-flag 스파이크. ──
// shell.entries는 space.js 가산 옵션(하위호환). withEntries가 프리셋 위에 얹는다.
function withEntries(preset, entries) {
  return normalizeSpace(Object.assign({}, preset.space, {
    shell: Object.assign({}, preset.space.shell, { entries }),
  }));
}
const spaceA = withEntries(SPACE_PRESETS[0], ['east']); // 미니멀 화이트 → 동쪽 문
const spaceB = withEntries(SPACE_PRESETS[1], ['west']); // 금계 라운지 → 서쪽 문

// ── 직원 AI NPC(파셀 0,0에 소환). 이름표는 핸들/역할(모델 브랜드명 노출 금지 §6). ──
const staff = [
  { id: 'npc-ayamo', nickname: '아야모', color: '#7ec8a0', char: randomChibiChar(),
    greetings: ['어서 오세요! 제가 안내할게요 ☺️', '반가워요~ 천천히 둘러보세요', '아야모예요! 같이 봐요'],
    remarks: [(t) => `『${t}』, 이 방의 자랑이에요`, (t) => `『${t}』 앞에 서면 마음이 편해져요`, () => '여긴 언제 와도 좋아요 🌿'] },
  { id: 'npc-lead', nickname: '팀장', color: '#8e7dbe', char: encodeChibi({ outfit: 'suit', hairStyle: 'short', glasses: true, top: '#39414f', bottom: '#2c3038' }),
    greetings: ['둘러보시는군요. 편하게 보세요.', '안녕하세요.'],
    remarks: [(t) => `『${t}』… 구성이 탄탄하네요`, (t) => `『${t}』 조명 각이 좋습니다`, () => '동선이 잘 잡혔네요'] },
  { id: 'npc-deputy', nickname: '부팀장', color: '#6a8caf', char: encodeChibi({ hairStyle: 'bob', top: '#5468c4', bottomType: 'pants', bottom: '#39414f' }),
    greetings: ['오세요~ 편하게 보시면 돼요', '안녕하세요!'],
    remarks: [(t) => `『${t}』 디테일 보세요, 좋아요`, () => '이 방 마감이 깔끔하죠'] },
];

const parcels = [
  { px: 0, pz: 0, space: spaceA, npc: { roster: staff, count: staff.length } },
  { px: 1, pz: 0, space: spaceB },
];

const canvas = document.getElementById('c');
// 셀 크기 = medium footprint 폭(9m) → 두 방의 경계 벽이 정확히 맞닿아 문끼리 정렬(스파이크 배치).
const V = createWorld({ canvas, parcels, opts: { cell: 9, preserveDrawingBuffer: true } });
window.__world = V;

function fit() { V.resize(window.innerWidth, window.innerHeight); }
window.addEventListener('resize', fit); fit();

// 현재 파셀 표시
const pcell = document.getElementById('pcell');
function refreshCell() { const p = V.getCurrentParcel(); pcell.textContent = `파셀 (${p.px},${p.pz})`; }
setInterval(refreshCell, 400);

// 클릭 유도 오버레이
const enter = document.getElementById('enter');
V.on('lock', ({ locked }) => { enter.classList.toggle('hide', locked); });
enter.addEventListener('click', () => { if (canvas.requestPointerLock) canvas.requestPointerLock(); });

// NPC 말풍선 토스트 — 최근 한 건만 부드럽게 표시(3.6초 후 소멸).
const chat = document.getElementById('chat');
V.on('chat', ({ name, text }) => {
  const b = document.createElement('div'); b.className = 'bub';
  b.innerHTML = `<span class="nm"></span><span class="tx"></span>`;
  b.querySelector('.nm').textContent = name; b.querySelector('.tx').textContent = text;
  chat.appendChild(b);
  requestAnimationFrame(() => b.classList.add('on'));
  setTimeout(() => { b.classList.remove('on'); setTimeout(() => b.remove(), 300); }, 3600);
  while (chat.children.length > 3) chat.removeChild(chat.firstChild);
});

// ── 모바일: 터치 감지 → 좌 조이스틱 + 우 드래그 시선 ──
const isTouch = (typeof window !== 'undefined') && ('ontouchstart' in window || (navigator.maxTouchPoints || 0) > 0);
if (isTouch) {
  document.body.classList.add('is-touch');
  const joy = document.getElementById('joy'), nub = document.getElementById('joyNub');
  let joyId = null, jcx = 0, jcy = 0; const JR = 40;
  function joyStart(e) { const t = e.changedTouches[0]; joyId = t.identifier; const r = joy.getBoundingClientRect(); jcx = r.left + r.width / 2; jcy = r.top + r.height / 2; joyMove(e); }
  function joyMove(e) {
    for (const t of e.changedTouches) { if (t.identifier !== joyId) continue;
      let dx = t.clientX - jcx, dy = t.clientY - jcy; const d = Math.hypot(dx, dy) || 1; const cl = Math.min(1, d / JR);
      const ux = dx / d * cl, uy = dy / d * cl; nub.style.transform = `translate(${ux * JR}px,${uy * JR}px)`;
      V.setTouchMove(-uy, ux);
    }
  }
  function joyEnd(e) { for (const t of e.changedTouches) { if (t.identifier !== joyId) continue; joyId = null; nub.style.transform = 'translate(0,0)'; V.setTouchMove(0, 0); } }
  joy.addEventListener('touchstart', (e) => { e.preventDefault(); joyStart(e); }, { passive: false });
  joy.addEventListener('touchmove', (e) => { e.preventDefault(); joyMove(e); }, { passive: false });
  joy.addEventListener('touchend', joyEnd); joy.addEventListener('touchcancel', joyEnd);
  let lookId = null, lx = 0, ly = 0;
  canvas.addEventListener('touchstart', (e) => { const t = e.changedTouches[0]; if (t.clientX < window.innerWidth * 0.4) return; lookId = t.identifier; lx = t.clientX; ly = t.clientY; }, { passive: true });
  canvas.addEventListener('touchmove', (e) => { for (const t of e.changedTouches) { if (t.identifier !== lookId) continue; V.lookDelta((t.clientX - lx) * 0.004, (t.clientY - ly) * 0.004); lx = t.clientX; ly = t.clientY; } }, { passive: true });
  canvas.addEventListener('touchend', (e) => { for (const t of e.changedTouches) { if (t.identifier === lookId) lookId = null; } });
}
</script>
</body>
</html>
