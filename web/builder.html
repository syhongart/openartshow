<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- 유튜브 임베드는 nocookie 단일 호스트만 프레임 허용(보안담당 실사). 그 외 프레임 차단. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'none'">
<title>공간 빌더 · OpenArtShow</title>
<link rel="stylesheet" href="./vendor/fonts/fonts.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<style>
  /* 팔레트 B 정본 + 프리미엄 글래스(감독: 굴절 느끼는 리퀴드 글래스) */
  :root{
    --bg:#14151A; --surface-1:#1F2128; --surface-2:#2A2C37; --line:#3A3D4B;
    --ink:#F5F5F2; --dim:#9A9EB1;
    --violet:#8B72FF; --cyan:#72E6E1; --coral:#FF705E; --error:#B0503F;
    --glass:linear-gradient(180deg, rgba(46,48,61,.72), rgba(20,21,27,.80));
    --glass-hero:linear-gradient(180deg, rgba(52,54,68,.82), rgba(22,23,30,.88));
    --glass-hi:inset 0 1px 0 rgba(255,255,255,.13);
    --glass-lo:inset 0 -1px 0 rgba(0,0,0,.40);
    --sh-hero:0 26px 52px -14px rgba(0,0,0,.62);
    --sh-plate:0 14px 32px -12px rgba(0,0,0,.52);
    --r-xl:18px; --r-lg:14px; --r-md:11px; --r-sm:8px;
    --app:var(--app-font, -apple-system,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--app);overflow:hidden;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  /* ===== 리퀴드 글래스 플레이트 — backdrop을 SVG 디스플레이스먼트로 휘게(굴절 느낌) ===== */
  .plate{position:fixed;z-index:10;background:var(--glass);
    backdrop-filter:blur(3px) saturate(155%) brightness(1.04) url(#refract);
    -webkit-backdrop-filter:blur(11px) saturate(150%); /* 사파리 등 굴절 미지원 폴백=블러 */
    border:1px solid rgba(255,255,255,.10);border-radius:var(--r-lg);
    box-shadow:var(--sh-plate), var(--glass-hi), var(--glass-lo);overflow:hidden}
  .plate::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
    background:radial-gradient(135% 68% at 12% 0%, rgba(255,255,255,.14), transparent 56%)} /* 유리 상단 sheen */
  .plate.hero{background:var(--glass-hero);border-radius:var(--r-xl);box-shadow:var(--sh-hero), var(--glass-hi), var(--glass-lo)}

  /* ↖ 정보 플레이트(히어로) */
  .hud-info{top:16px;left:16px;padding:14px 20px 13px 16px;min-width:194px}
  .hud-info .titlerow{display:flex;align-items:center;gap:9px;margin-bottom:11px}
  .hud-info .tick{width:3px;height:16px;border-radius:2px;background:var(--coral);flex:none}
  .hud-info .title{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
  .hud-info .pill{margin-left:auto;font-size:11px;font-weight:600;color:var(--dim);font-variant-numeric:tabular-nums;
    background:rgba(255,255,255,.06);border-radius:999px;padding:2px 9px}
  .hud-info .pill b{color:var(--ink)}
  .hud-info .gauge-lab{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.02em;color:var(--dim);margin-bottom:5px}
  .hud-info .gauge-lab b{color:var(--ink);font-variant-numeric:tabular-nums}
  .hud-info .track{height:5px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden}
  .hud-info .fill{height:100%;border-radius:999px;background:var(--violet);width:5%;transition:width .35s cubic-bezier(.2,.8,.2,1)}
  .hud-info .fill.warn{background:var(--coral)}

  /* ↗ 모드바(편집/관람 + 상태 + 설정) */
  .hud-modebar{top:16px;right:16px;padding:9px;display:flex;flex-direction:column;gap:9px;width:210px}
  .modeseg{display:flex;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:999px;padding:2px;position:relative}
  .modeseg button{flex:1;border:0;background:transparent;color:var(--dim);font:inherit;font-size:11.5px;font-weight:600;
    padding:6px 0;border-radius:999px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;position:relative;z-index:1;transition:color .2s}
  .modeseg button svg{width:13px;height:13px}
  .modeseg .thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc(50% - 2px);border-radius:999px;
    background:var(--surface-2);box-shadow:0 2px 8px -2px rgba(0,0,0,.5), inset 0 0 0 1px rgba(139,114,255,.5);
    transition:transform .22s cubic-bezier(.2,.8,.2,1)}
  .modeseg.view .thumb{transform:translateX(100%);box-shadow:0 2px 8px -2px rgba(0,0,0,.5), inset 0 0 0 1px rgba(114,230,225,.55)}
  .modeseg button.on{color:#fff}
  .hud-modebar .statusrow{display:flex;align-items:center;gap:8px;padding-top:2px}
  .hud-modebar .dot{width:8px;height:8px;border-radius:999px;background:var(--dim);flex:none;transition:.25s}
  .hud-modebar .dot.saved{background:var(--cyan);box-shadow:0 0 9px rgba(114,230,225,.7)}
  .hud-modebar .dot.dirty{background:var(--coral);box-shadow:0 0 9px rgba(255,112,94,.6)}
  .hud-modebar .stxt{font-size:11px;color:var(--dim)}
  .hud-modebar .gear{margin-left:auto;appearance:none;width:26px;height:26px;border-radius:8px;border:1px solid var(--line);
    background:rgba(255,255,255,.05);color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s}
  .hud-modebar .gear:hover{color:var(--ink);border-color:var(--violet)}
  .hud-modebar .gear svg{width:15px;height:15px}

  /* 설정 슬라이드 패널 */
  .hud-settings{top:112px;right:16px;width:262px;padding:16px}
  .hud-settings{transform:translateX(calc(100% + 20px));opacity:0;pointer-events:none;transition:.22s cubic-bezier(.2,.8,.2,1)}
  .hud-settings.on{transform:translateX(0);opacity:1;pointer-events:auto}
  .hud-settings h4{margin:0 0 14px;font-size:13px;letter-spacing:.02em;display:flex;align-items:center;gap:7px}
  .hud-settings h4 .x{margin-left:auto;cursor:pointer;color:var(--dim);font-size:15px;line-height:1}
  .hud-settings .fld{margin-bottom:15px}
  .hud-settings label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-bottom:7px}
  .hud-settings label b{color:var(--violet);font-variant-numeric:tabular-nums}
  .hud-settings input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:999px;background:rgba(255,255,255,.12);outline:none}
  .hud-settings input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:999px;background:var(--violet);border:2px solid var(--ink);cursor:pointer}
  .hud-settings input[type=text]{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:12.5px;padding:8px 11px;border-radius:9px}
  .hud-settings input[type=text]:focus{outline:none;border-color:var(--violet)}
  .hud-settings .publish{width:100%;appearance:none;border:1px solid var(--violet);color:#fff;font:inherit;font-weight:700;font-size:12.5px;
    background:rgba(139,114,255,.16);border-radius:10px;padding:10px 0;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:.12s}
  .hud-settings .publish:hover{background:rgba(139,114,255,.28)}
  .hud-settings .swatches{display:flex;gap:7px;align-items:center}
  .hud-settings .swatches button{width:22px;height:22px;border-radius:999px;border:2px solid transparent;background:var(--sw);cursor:pointer;padding:0;transition:.12s;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
  .hud-settings .swatches button:hover{transform:scale(1.12)}
  .hud-settings .swatches button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--violet)}
  .hud-settings .swatches input[type=color]{width:24px;height:24px;padding:0;border:1px solid var(--line);border-radius:7px;background:transparent;cursor:pointer;margin-left:2px}
  .hud-settings .swatches input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
  .hud-settings .swatches input[type=color]::-webkit-color-swatch{border:0;border-radius:5px}
  .hud-settings .finchips{display:flex;flex-wrap:wrap;gap:6px}
  .hud-settings .finchips button{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:11px;color:var(--ink);
    background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 7px;cursor:pointer;transition:.12s}
  .hud-settings .finchips button:hover{border-color:rgba(139,114,255,.6)}
  .hud-settings .finchips button.on{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet);background:rgba(139,114,255,.14)}
  .hud-settings .finchips i{width:13px;height:13px;border-radius:4px;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
  .hud-settings .presets{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
  .hud-settings .presets button{flex:0 0 auto;width:92px;padding:0;border:1px solid var(--line);border-radius:11px;background:rgba(0,0,0,.22);cursor:pointer;overflow:hidden;transition:.12s;text-align:left}
  .hud-settings .presets button:hover{border-color:rgba(139,114,255,.6);transform:translateY(-1px)}
  .hud-settings .presets button.on{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet)}
  .hud-settings .presets img{display:block;width:100%;height:92px;object-fit:cover;background:#14151a}
  .hud-settings .presets .pn{display:block;font-size:10.5px;font-weight:600;color:var(--ink);padding:5px 7px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hud-settings .bakebtn{width:100%;appearance:none;border:1px solid rgba(114,230,225,.45);color:#0f1418;font:inherit;font-weight:700;font-size:13px;
    background:linear-gradient(180deg,#8ef0e9,#5fd8d0);border-radius:10px;padding:11px 0;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.12s;box-shadow:0 6px 16px -6px rgba(114,230,225,.5)}
  .hud-settings .bakebtn:hover{filter:brightness(1.05);transform:translateY(-1px)}
  .hud-settings .bakebtn.on{background:linear-gradient(180deg,#3a3d4b,#2a2c37);color:var(--cyan);border-color:var(--cyan)}
  .hud-settings .bakebtn .bk-ic{font-size:14px}
  .hud-settings .bakehint{font-size:10px;color:var(--dim);line-height:1.6;margin:7px 2px 13px}
  .hud-settings .clearbtn{width:100%;margin-top:9px;appearance:none;border:1px solid rgba(176,80,63,.5);color:#e79b8d;font:inherit;font-size:12px;
    background:rgba(176,80,63,.10);border-radius:10px;padding:9px 0;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:.12s}
  .hud-settings .clearbtn:hover{background:rgba(176,80,63,.22);color:#ffd9d1}
  .hud-settings .keys{margin-top:13px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);font-size:10.5px;line-height:1.7;color:var(--dim)}
  .hud-settings .keys b{color:var(--ink);font-weight:600}

  /* → 파츠 도크(유리) */
  .hud-dock{top:120px;right:16px;width:250px;max-height:calc(100vh - 220px);display:flex;flex-direction:column;overflow:hidden;padding:0}
  .hud-dock .tabs{display:flex;gap:4px;padding:9px 9px 8px;border-bottom:1px solid rgba(255,255,255,.08)}
  .hud-dock .tabs button{flex:1;appearance:none;border:1px solid transparent;background:transparent;color:var(--dim);
    font:inherit;font-size:11.5px;padding:8px 2px 6px;border-radius:9px;cursor:pointer;transition:.12s;
    display:flex;flex-direction:column;align-items:center;gap:3px}
  .hud-dock .tabs button .tic{width:15px;height:15px;color:currentColor}
  .hud-dock .tabs button:hover{color:var(--ink)}
  .hud-dock .tabs button.on{color:var(--violet);background:rgba(139,114,255,.14)}
  .parts{padding:11px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .chip{appearance:none;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.04);color:var(--dim);font:inherit;font-size:11.5px;
    padding:7px 5px 8px;border-radius:11px;cursor:pointer;text-align:center;transition:.14s;position:relative;
    display:flex;flex-direction:column;align-items:center;gap:4px}
  .chip .chip-ic{width:100%;height:50px;object-fit:contain;pointer-events:none;
    background:radial-gradient(120% 100% at 50% 18%,rgba(43,44,55,.7) 0%,rgba(20,21,30,.7) 100%);border-radius:8px}
  .chip:hover{border-color:var(--violet);color:var(--ink);transform:translateY(-2px);box-shadow:0 8px 18px -8px rgba(0,0,0,.5)}
  .chip.on{color:#fff;border-color:var(--violet);background:rgba(139,114,255,.16)}
  .chip.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2.5px;background:var(--violet);border-radius:2px}

  /* ↙ 카메라·그리드 기즈모 */
  .hud-gizmo{bottom:16px;left:16px;padding:6px;display:flex;gap:5px}
  .hud-gizmo button{appearance:none;width:36px;height:36px;border-radius:9px;border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.04);color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s}
  .hud-gizmo button svg{width:17px;height:17px}
  .hud-gizmo button:hover{color:var(--ink);border-color:var(--violet)}
  .hud-gizmo button.on{color:var(--violet);border-color:var(--violet);background:rgba(139,114,255,.14)}

  /* ↓ 하단 툴바 */
  .hud-toolbar{bottom:16px;left:50%;transform:translateX(-50%);padding:8px;display:flex;align-items:center;gap:4px;border-radius:16px}
  .hud-toolbar .ic{appearance:none;width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:var(--dim);
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s}
  .hud-toolbar .ic:hover{background:rgba(255,255,255,.08);color:var(--ink)}
  .hud-toolbar .ic svg{width:19px;height:19px}
  .hud-toolbar .div{width:1px;height:22px;background:var(--line);margin:0 4px}
  .hud-toolbar .cta{appearance:none;border:0;background:var(--coral);color:#1a120f;font:inherit;font-weight:700;font-size:13.5px;
    border-radius:10px;padding:0 18px;height:38px;display:flex;align-items:center;gap:6px;cursor:pointer;transition:.12s;position:relative;overflow:hidden;
    box-shadow:0 0 12px rgba(255,112,94,.3)}
  .hud-toolbar .cta::after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;transform:translateX(-160%);
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transition:transform .5s}
  .hud-toolbar .cta:hover{filter:brightness(1.05);transform:translateX(-50%) translateY(-1px)}
  .hud-toolbar .cta:hover::after{transform:translateX(320%)}

  /* 선택 컨텍스트 독 */
  .hud-context{bottom:66px;left:50%;transform:translateX(-50%) translateY(8px);opacity:0;pointer-events:none;transition:.18s;
    padding:9px 13px;display:flex;align-items:center;gap:11px;font-size:12.5px;color:var(--dim);white-space:nowrap}
  .hud-context.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
  .hud-context .who{color:var(--ink);font-weight:600}
  .hud-context .bar{width:1px;height:18px;background:var(--line)}
  .hud-context .step{display:flex;align-items:center;gap:5px}
  .hud-context .step b{color:var(--ink);min-width:38px;text-align:center;font-variant-numeric:tabular-nums}
  .hud-context .sbtn{appearance:none;width:24px;height:24px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);
    font:inherit;font-size:14px;line-height:1;border-radius:7px;cursor:pointer;transition:.12s;display:flex;align-items:center;justify-content:center}
  .hud-context .sbtn:hover{border-color:var(--violet)}
  .hud-context .del{appearance:none;border:1px solid transparent;background:transparent;color:var(--error);font:inherit;font-size:12.5px;cursor:pointer;padding:5px 9px;border-radius:8px;transition:.12s}
  .hud-context .del:hover{background:rgba(176,80,63,.16);border-color:var(--error)}
  .hud-context .vidwrap{display:none;align-items:center;gap:7px}
  .hud-context .imgwrap{display:none;align-items:center;gap:7px}
  .hud-context input{background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:12.5px;padding:6px 10px;border-radius:8px;width:180px}
  .hud-context .mini{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font:inherit;font-size:12px;padding:6px 11px;border-radius:8px;cursor:pointer;transition:.12s}
  .hud-context .mini:hover{border-color:var(--violet)}
  .hud-context .mini.cta{background:var(--coral);border-color:var(--coral);color:#1a120f;font-weight:700}

  /* ↘ 미니맵 */
  .hud-minimap{bottom:16px;right:16px;width:132px;padding:9px 10px 10px}
  .hud-minimap .lab{font-size:9px;letter-spacing:.09em;color:var(--dim);margin-bottom:6px;text-transform:uppercase;display:flex;justify-content:space-between}
  .hud-minimap .lab b{color:var(--cyan);font-weight:600}
  .hud-minimap .map{position:relative;width:112px;height:96px;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.08);border-radius:7px;overflow:hidden}
  .hud-minimap .room{position:absolute;inset:11px;border:1px solid rgba(255,255,255,.14);border-radius:2px}
  .hud-minimap .dotp{position:absolute;width:4px;height:4px;border-radius:999px;background:var(--dim);transform:translate(-50%,-50%)}
  .hud-minimap .dotp.art{background:var(--cyan);box-shadow:0 0 4px rgba(114,230,225,.8)}
  .hud-minimap .spawn{position:absolute;width:6px;height:6px;border-radius:999px;background:var(--violet);box-shadow:0 0 6px rgba(139,114,255,.85);transform:translate(-50%,-50%)}

  /* 토스트 */
  .toast{position:fixed;left:50%;bottom:118px;transform:translateX(-50%) translateY(10px);opacity:0;transition:.2s;z-index:20;
    background:rgba(42,34,48,.92);border:1px solid var(--coral);color:#ffd9d1;font-size:13px;padding:9px 14px;border-radius:10px;pointer-events:none;backdrop-filter:blur(8px)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #playOverlay{display:none;position:fixed;inset:0;z-index:40;background:#0a0a0ecc;backdrop-filter:blur(4px);align-items:center;justify-content:center}

  .hud-settings{z-index:11} /* 도크 위 */
  body.settings-open .hud-dock{display:none} /* 설정 열면 도크와 상호배타(progressive disclosure) */

  /* 관람(view) 모드: 편집 크롬 숨김 → 완성 미리보기 */
  body.viewmode .hud-dock, body.viewmode .hud-gizmo, body.viewmode .hud-toolbar,
  body.viewmode .hud-context, body.viewmode .hud-settings{display:none!important}

  /* 모바일: 편집 크롬 전부 숨김 */
  .mobwarn{display:none}
  @media (max-width:640px){
    .desk{display:none!important}
    .mobwarn{display:block;position:fixed;left:12px;right:12px;bottom:14px;z-index:10;
      background:rgba(31,33,40,.9);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--dim);text-align:center;backdrop-filter:blur(8px)}
  }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<!-- 리퀴드 글래스 굴절 필터(backdrop 왜곡 = IOR 느낌). scale이 유리 두께/굴절 강도. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="refract" x="-20%" y="-20%" width="140%" height="140%">
  <feTurbulence type="fractalNoise" baseFrequency="0.009 0.012" numOctaves="2" seed="11" result="n"/>
  <feGaussianBlur in="n" stdDeviation="1.4" result="nb"/>
  <feDisplacementMap in="SourceGraphic" in2="nb" scale="11" xChannelSelector="R" yChannelSelector="G"/>
</filter></svg>

<!-- ↖ 정보(히어로) -->
<div class="plate hero hud-info desk">

  <div class="fld"><label>벽 마감</label>

      <button data-id="deepviolet" class="on"><i style="--sw:#2b2833"></i>딥바이올렛</button>
      <button data-id="kintsugi"><i style="--sw:linear-gradient(135deg,#171317 40%,#c39a4a)"></i>금계</button>

<div class="mobwarn">📱 모바일에서는 <b>감상</b>만 가능합니다. 공간 편집은 데스크톱에서 하세요. (드래그=둘러보기)</div>
<div class="toast" id="toast"></div>

<script type="module">
import * as THREE from 'three';
import { createBuilder } from './js/builder.js';
import { PART_TYPES } from './js/space.js';
import { createYouTubeSurface } from './js/ytembed.js';
import { buildPartPreview } from './js/space-render.js';

// 팔레트 썸네일 — 오프스크린 1회 렌더 → 아이콘 dataURL
function renderPartIcons(size = 60) {
  const R = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  R.setSize(size, size); R.setPixelRatio(2); R.setClearColor(0x000000, 0); R.outputColorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Scene();
  s.add(new THREE.HemisphereLight(0xfff6ea, 0x2a2a30, 1.25));
  const k = new THREE.DirectionalLight(0xffffff, 1.2); k.position.set(1.4, 2.2, 1.6); s.add(k);
  const cam = new THREE.PerspectiveCamera(32, 1, 0.05, 40);
  const icons = {};
  try {
    for (const type of Object.keys(PART_TYPES)) {
      const g = buildPartPreview(type); s.add(g);
      const box = new THREE.Box3().setFromObject(g); const c = box.getCenter(new THREE.Vector3()); const sz = box.getSize(new THREE.Vector3());
      const rad = Math.max(sz.x, sz.y, sz.z, 0.3) * 1.5 + 0.35;
      cam.position.set(c.x + rad * 0.8, c.y + rad * 0.65, c.z + rad * 1.0); cam.lookAt(c);
      R.render(s, cam); icons[type] = R.domElement.toDataURL();
      s.remove(g);
      g.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) { if (o.material.map) o.material.map.dispose(); if (o.material.normalMap) o.material.normalMap.dispose(); o.material.dispose(); } });
    }
  } finally { R.dispose(); }
  return icons;
}
let PART_ICONS = {};
try { PART_ICONS = renderPartIcons(); } catch (e) { PART_ICONS = {}; }

const canvas = document.getElementById('c');
const B = createBuilder(canvas, { preserveDrawingBuffer: true });
function fit(){ B.resize(window.innerWidth, window.innerHeight); }
window.addEventListener('resize', fit); fit();

// 카테고리 탭
const CAT_LABEL = { structure:'구조', exhibit:'전시', ambience:'분위기' };
const CAT_ICON = {
  structure:'<svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/></svg>',
  exhibit:'<svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="1.5"/><path d="m6 15 4-4 3 3 2-2 3 3"/><path d="M12 22v-4"/></svg>',
  ambience:'<svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0-4 10.5c.7.6 1 1 1 2V17h6v-1.5c0-1 .3-1.4 1-2A6 6 0 0 0 12 3Z"/><path d="M9 21h6"/></svg>'
};
const placeCats = ['structure','exhibit','ambience'];
const tabsEl = document.getElementById('tabs'), partsEl = document.getElementById('parts');
let curCat = 'structure';
placeCats.forEach((cat,i)=>{
  const b=document.createElement('button'); b.innerHTML=(CAT_ICON[cat]||'')+'<span>'+CAT_LABEL[cat]+'</span>'; if(i===0)b.className='on';
  b.onclick=()=>{ [...tabsEl.children].forEach(c=>c.classList.remove('on')); b.classList.add('on'); curCat=cat; renderParts(); };
  tabsEl.appendChild(b);
});
function renderParts(){
  partsEl.innerHTML='';
  Object.entries(PART_TYPES).filter(([,s])=>s.cat===curCat).forEach(([type,spec])=>{
    const c=document.createElement('button'); c.className='chip';
    if(PART_ICONS[type]){ const im=document.createElement('img'); im.className='chip-ic'; im.src=PART_ICONS[type]; im.alt=''; c.appendChild(im); }
    const lb=document.createElement('span'); lb.textContent=spec.label; c.appendChild(lb);
    c.onclick=()=>{ [...partsEl.querySelectorAll('.chip')].forEach(x=>x.classList.remove('on')); c.classList.add('on'); B.beginPlace(type); };
    partsEl.appendChild(c);
  });
}
renderParts();

// 상단 인디케이터 + 미니맵
const nParts=document.getElementById('nParts'), nCap=document.getElementById('nCap'), capFill=document.getElementById('capFill');
const miniRoom=document.getElementById('miniRoom'), miniN=document.getElementById('miniN');
const MINI_HALF = 7;
function drawMinimap(){
  const sp=B.getSpace();
  [...miniRoom.querySelectorAll('.dotp,.spawn')].forEach(n=>n.remove());
  const toPct=(v)=>Math.min(98,Math.max(2,((v+MINI_HALF)/(2*MINI_HALF))*100));
  const UNIQUE=new Set(['artwork','screen']); let n=0;
  (sp.parts||[]).forEach(p=>{ const d=document.createElement('span'); d.className='dotp'+(UNIQUE.has(p.t)?' art':''); d.style.left=toPct(p.x||0)+'%'; d.style.top=toPct(p.z||0)+'%'; miniRoom.appendChild(d); n++; });
  const sp2=document.createElement('span'); sp2.className='spawn'; sp2.style.left=toPct(sp.spawn?.x||0)+'%'; sp2.style.top=toPct(sp.spawn?.z||0)+'%'; miniRoom.appendChild(sp2);
  miniN.textContent=n;
}
function refresh(){ const s=B.getStats(); nParts.textContent=s.parts; nCap.textContent=s.uniqueTex; capFill.style.width=Math.max(4,Math.round(s.uniqueTex/80*100))+'%'; capFill.classList.toggle('warn',s.uniqueTex>=72); drawMinimap(); }

// 저장 상태
const saveDot=document.getElementById('saveDot'), saveTxt=document.getElementById('saveTxt');
function setSaveState(st){ saveDot.className='dot'+(st==='saved'?' saved':st==='dirty'?' dirty':''); saveTxt.textContent=st==='saved'?'저장됨':st==='dirty'?'변경됨':'새 공간'; }
setSaveState('idle');
B.on('change', ()=>{ refresh(); setSaveState('dirty'); if(!B.isBaked()) setBakeUI(false); }); refresh();

// 편집/관람 토글
const modeseg=document.getElementById('modeseg'), mEdit=document.getElementById('mEdit'), mView=document.getElementById('mView');
function setMode(mode){
  B.setViewMode(mode);
  const view = mode==='view';
  document.body.classList.toggle('viewmode', view);
  modeseg.classList.toggle('view', view);
  mEdit.classList.toggle('on', !view); mView.classList.toggle('on', view);
}
mEdit.onclick=()=>setMode('edit'); mView.onclick=()=>setMode('view');

// 설정 패널
const settings=document.getElementById('settings');
const bGear=document.getElementById('bGear');
function toggleSettings(open){ const on = open===undefined ? !settings.classList.contains('on') : open; settings.classList.toggle('on', on); document.body.classList.toggle('settings-open', on); }
bGear.onclick=(e)=>{ e.stopPropagation(); toggleSettings(); };
document.getElementById('bSettingsClose').onclick=()=>toggleSettings(false);
document.addEventListener('click',(e)=>{ if(settings.classList.contains('on') && !settings.contains(e.target) && e.target!==bGear && !bGear.contains(e.target)) toggleSettings(false); }); // 외부 클릭 닫힘
const lightRange=document.getElementById('lightRange'), lightVal=document.getElementById('lightVal');
lightRange.oninput=()=>{ const v=parseFloat(lightRange.value); lightVal.textContent=v.toFixed(2).replace(/0$/,'')+'×'; B.setLightIntensity(v); };
const titleInput=document.getElementById('titleInput'), spaceTitle=document.getElementById('spaceTitle');
titleInput.oninput=()=>{ const v=titleInput.value||'나의 공간'; spaceTitle.textContent=v; B.setSpaceName(titleInput.value); };
document.getElementById('bPublish').onclick=()=>{ if(B.save()) showToast('저장·발행했습니다. (공유 링크는 준비 중)'); else showToast('이미지가 커서 저장 공간을 초과했습니다.'); };
// 조명 색 — 스와치 + 직접 선택
const lightSwatches=document.getElementById('lightSwatches'), lightColorInput=document.getElementById('lightColor');
function pickLightColor(hex, fromSwatch){
  B.setLightColor(hex); lightColorInput.value=hex;
  [...lightSwatches.querySelectorAll('button')].forEach(b=>b.classList.toggle('on', b===fromSwatch));
}
[...lightSwatches.querySelectorAll('button')].forEach(b=>{ b.onclick=()=>pickLightColor(b.dataset.c, b); });
lightColorInput.oninput=()=>pickLightColor(lightColorInput.value, null);
// 마감(재질) 칩 — 바닥·벽·피처월. B.setFinish(kind,id)로 재빌드, 칩 활성표시.
const finGroups=[...document.querySelectorAll('.finchips[data-fin]')];
finGroups.forEach(grp=>{ const kind=grp.dataset.fin;
  [...grp.querySelectorAll('button')].forEach(b=>{ b.onclick=()=>{
    const applied=B.setFinish(kind, b.dataset.id);
    [...grp.querySelectorAll('button')].forEach(x=>x.classList.toggle('on', x.dataset.id===applied));
  }; });
});
function syncFinishChips(){ const f=B.getSpace().shell.finish; finGroups.forEach(grp=>{ const cur=f[grp.dataset.fin];
  [...grp.querySelectorAll('button')].forEach(x=>x.classList.toggle('on', x.dataset.id===cur)); }); }
syncFinishChips();
// 공간 크기 칩 — B.setFootprint(id)로 방 크기 변경(카메라 자동 맞춤·베이크 무효·undo 가능).
const sizeChips=document.getElementById('sizeChips');
function syncSizeChips(){ if(!sizeChips)return; const cur=B.getSpace().shell.footprint;
  [...sizeChips.querySelectorAll('button')].forEach(x=>x.classList.toggle('on', x.dataset.size===cur)); }
if(sizeChips){ [...sizeChips.querySelectorAll('button')].forEach(b=>{ b.onclick=()=>{
  B.setFootprint(b.dataset.size); syncSizeChips();
  showToast('공간 크기: '+b.textContent.split(' · ')[0]+' · Ctrl+Z로 되돌리기'); }; }); }
syncSizeChips();
// 프리셋 갤러리(#49) — 썸네일 카드, 클릭 시 현재 공간 교체(undo 가능)
const presetsEl=document.getElementById('presets');
B.getPresets().forEach(p=>{
  const b=document.createElement('button'); b.title=p.desc; b.dataset.id=p.id;
  const img=document.createElement('img'); img.alt=p.name; if(p.thumb) img.src=p.thumb;
  const nm=document.createElement('span'); nm.className='pn'; nm.textContent=p.name;
  b.appendChild(img); b.appendChild(nm);
  b.onclick=()=>{
    B.applyPreset(p.id); syncFinishChips(); syncSizeChips(); B.resetCamera(); // refresh()는 change 리스너가 처리(중복 제거) · 새 방 크기에 카메라 맞춤(검수 MINOR)
    [...presetsEl.querySelectorAll('button')].forEach(x=>x.classList.toggle('on', x===b));
    const title=B.getSpace().meta&&B.getSpace().meta.name; if(title){ spaceTitle.textContent=title; titleInput.value=title; }
    showToast(`'${p.name}' 프리셋 불러옴 · Ctrl+Z로 되돌리기`);
  };
  presetsEl.appendChild(b);
});
// 라이트 베이킹(GPU 셸 라이트맵) 토글 — 굽기 ↔ 다시 편집
const bBake=document.getElementById('bBake'), bakeLabel=document.getElementById('bakeLabel'), bakeHint=document.getElementById('bakeHint');
function setBakeUI(on){ bBake.classList.toggle('on', on); bakeLabel.textContent = on ? '다시 편집' : '굽기 · 완성 미리보기';
  bBake.querySelector('.bk-ic').textContent = on ? '✎' : '✦';
  bakeHint.textContent = on ? '지금은 구운(방문자) 화면. 편집하려면 다시 편집을 누르세요.' : '완성하면 조명을 셸에 구워 방문자는 가볍게 봅니다. 편집·조명색 바꾸면 자동 해제.'; }
bBake.onclick=()=>{
  if(B.isBaked()){ B.unbake(); setBakeUI(false); showToast('편집 모드로 돌아왔습니다.'); }
  else { const r=B.bake(); if(r.ok){ setBakeUI(true); showToast(`구웠습니다 — 셸 ${r.surfaces}면 라이트맵, 실시간 스포트→0 (${r.ms}ms). 방문자는 이 화면을 가볍게 봅니다.`); } }
};
B.on('unbaked', ()=>setBakeUI(false)); // 조명색 변경 등으로 자동 해제 시 버튼도 리셋(검수 조건1: UI 정합)
// 전체 지우기(확인 후)
document.getElementById('bClear').onclick=()=>{
  if(B.getSpace().parts.length===0){ showToast('이미 비어 있습니다.'); return; }
  if(confirm('배치한 파츠를 전부 지우고 다시 시작할까요? (되돌리기 가능)')){ B.clearSpace(); showToast('전체 지웠습니다. (⌘/Ctrl+Z로 복구)'); } // refresh/dirty는 change 리스너가 처리
};

// 기즈모
const bSnap=document.getElementById('bSnap');
bSnap.onclick=()=>{ const on=bSnap.classList.toggle('on'); B.setGridSnap(on); showToast(on?'그리드 스냅 켜짐':'그리드 스냅 꺼짐 (자유 배치)'); };
document.getElementById('bCamReset').onclick=()=>B.resetCamera();
document.getElementById('bFull').onclick=()=>{ const el=document.documentElement; if(!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen(); else if(document.exitFullscreen) document.exitFullscreen(); };

// 컨텍스트 독
const context=document.getElementById('context'), selLab=document.getElementById('selLab');
const vidwrap=document.getElementById('vidwrap'), vidUrl=document.getElementById('vidUrl'), rotV=document.getElementById('rotV');
const imgwrap=document.getElementById('imgwrap'), imgFile=document.getElementById('imgFile');
let selIndex=-1;
function fmtDeg(ry){ let d=Math.round((ry||0)*180/Math.PI)%360; if(d<0)d+=360; return d+'°'; }
function syncRot(){ if(selIndex<0)return; const p=B.getSpace().parts[selIndex]; if(p) rotV.textContent=fmtDeg(p.ry); }
B.on('select', ({index,part})=>{
  selIndex=index;
  if(index>=0){ context.classList.add('on'); selLab.textContent=(PART_TYPES[part.t]?.label||'파츠'); rotV.textContent=fmtDeg(part.ry);
    const isScreen=part.t==='screen'; vidwrap.style.display=isScreen?'flex':'none'; if(isScreen) vidUrl.value=B.getScreenVideo(index)||'';
    const isArt=part.t==='artwork'; imgwrap.style.display=isArt?'flex':'none'; // 작품만 이미지 버튼 노출(스크린 유튜브와 동형 조건부)
  } else context.classList.remove('on');
});
B.on('mode', ()=>{ context.classList.remove('on'); vidwrap.style.display='none'; imgwrap.style.display='none'; });
document.getElementById('rotDn').onclick=()=>{ B.rotateSelectedFine(-5*Math.PI/180); syncRot(); };
document.getElementById('rotUp').onclick=()=>{ B.rotateSelectedFine( 5*Math.PI/180); syncRot(); };
document.getElementById('bDel').onclick=()=>{ B.deleteSelected(); context.classList.remove('on'); }; // 선택 파츠 삭제(마우스 경로)

// 유튜브
document.getElementById('bVidSet').onclick=()=>{ const ok=B.setScreenVideo(selIndex, vidUrl.value); showToast(ok?'유튜브 영상을 스크린에 연결했습니다.':'유효한 유튜브 링크가 아닙니다.'); };
const playOverlay=document.getElementById('playOverlay'), playMount=document.getElementById('playMount');
document.getElementById('bPlay').onclick=()=>{ const src=B.getScreenVideo(selIndex); if(!src){ showToast('먼저 유튜브 링크를 적용하세요.'); return; }
  const { el }=createYouTubeSurface(src,{ width:Math.min(880,window.innerWidth-80), height:Math.min(495,(window.innerWidth-80)*9/16) }); playMount.replaceChildren(el); playOverlay.style.display='flex'; };
function closePlay(){ playOverlay.style.display='none'; playMount.replaceChildren(); }
document.getElementById('bPlayClose').onclick=closePlay;
playOverlay.addEventListener('click',(e)=>{ if(e.target===playOverlay) closePlay(); });

// 작품 이미지(파일 업로드 → 브라우저 내장 dataURL). 외부 URL 0(자기완결·CSP img-src data:).
// 최대 변 1400px로 리사이즈 후 JPEG 0.85로 압축 → setArtworkImage. 저장 용량 한계는 저장 시 경고.
document.getElementById('bImgPick').onclick=()=>{ if(selIndex<0)return; imgFile.click(); };
document.getElementById('bImgClear').onclick=()=>{ if(selIndex<0)return; if(B.setArtworkImage(selIndex,'')) showToast('작품 이미지를 제거했습니다.'); };
imgFile.onchange=()=>{ const f=imgFile.files&&imgFile.files[0]; if(f) loadArtworkImage(f); imgFile.value=''; }; // value 리셋: 같은 파일 재선택 허용
function loadArtworkImage(file){
  const idx=selIndex;
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=1400, iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
      const scale=Math.min(1, MAX/Math.max(iw,ih,1));
      const w=Math.max(1,Math.round(iw*scale)), h=Math.max(1,Math.round(ih*scale));
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      const dataURL=cv.toDataURL('image/jpeg',0.85); // JPEG 압축(저장 용량 관리)
      if(B.setArtworkImage(idx, dataURL)) showToast('작품 이미지를 걸었습니다.'); else showToast('작품 액자에만 이미지를 걸 수 있어요.');
    };
    img.onerror=()=>showToast('이미지를 열 수 없습니다.');
    img.src=reader.result;
  };
  reader.onerror=()=>showToast('파일을 읽을 수 없습니다.');
  reader.readAsDataURL(file);
}

// 토스트
const toast=document.getElementById('toast'); let toastT=0;
function showToast(msg){ toast.textContent=msg; toast.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>toast.classList.remove('show'),2600); }
B.on('cap', ({cap})=>showToast('작품·영상은 '+cap+'점까지 걸 수 있어요. (성능 상한)'));
B.on('saved', ()=>{ showToast('저장했습니다.'); setSaveState('saved'); });

// 툴바
document.getElementById('bSave').onclick=()=>{ if(!B.save()) showToast('이미지가 커서 저장 공간을 초과했습니다.'); };
document.getElementById('bLoad').onclick=()=>{ if(B.load()){ refresh(); syncFinishChips(); setSaveState('saved'); const nm=B.getSpace().meta?.name; if(nm){ spaceTitle.textContent=nm; titleInput.value=nm; } } else showToast('저장된 공간이 없습니다.'); };
document.getElementById('bUndo').onclick=()=>B.undo();
document.getElementById('bExport').onclick=()=>{ const blob=new Blob([B.exportJSON()],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='my-space.json'; a.click(); URL.revokeObjectURL(a.href); };

window.__builder = B;
</script>
</body>
</html>
