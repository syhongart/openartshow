<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- 방문자뷰: 자기완결(외부 호스트 0). CSP default-src 'self'. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'">
<title>관람 · OpenArtShow</title>
<link rel="stylesheet" href="./vendor/fonts/fonts.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<style>
  :root{
    --bg:#14151A; --ink:#F5F5F2; --dim:#9A9EB1; --line:#3A3D4B;
    --violet:#8B72FF; --cyan:#72E6E1; --coral:#FF705E;
    --glass:linear-gradient(180deg, rgba(46,48,61,.72), rgba(20,21,27,.82));
    --app:var(--app-font, -apple-system,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;width:100%;background:var(--bg);color:var(--ink);font-family:var(--app);overflow:hidden;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  .plate{position:fixed;z-index:10;background:var(--glass);
    -webkit-backdrop-filter:blur(11px) saturate(150%);backdrop-filter:blur(11px) saturate(150%);
    border:1px solid rgba(255,255,255,.10);border-radius:14px;
    box-shadow:0 14px 32px -12px rgba(0,0,0,.52), inset 0 1px 0 rgba(255,255,255,.13)}

  /* ↖ 정보 플레이트 */
  .hud-info{top:16px;left:16px;padding:13px 18px;max-width:min(72vw,320px)}
  .hud-info .titlerow{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .hud-info .tick{width:3px;height:16px;border-radius:2px;background:var(--cyan);flex:none}
  .hud-info .title{font-size:14.5px;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hud-info .hint{font-size:11.5px;color:var(--dim);line-height:1.6}
  .hud-info .hint b{color:var(--ink);font-weight:600}

  /* ↗ 설정 */
  .hud-gear{top:16px;right:16px;width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .hud-gear svg{width:18px;height:18px;color:var(--dim)}
  .hud-gear:hover svg{color:var(--ink)}
  .hud-settings{top:66px;right:16px;width:min(84vw,244px);padding:14px}
  .hud-settings{transform:translateX(calc(100% + 26px));opacity:0;pointer-events:none;transition:.2s cubic-bezier(.2,.8,.2,1)}
  .hud-settings.on{transform:translateX(0);opacity:1;pointer-events:auto}
  .hud-settings h4{margin:0 0 12px;font-size:12.5px;letter-spacing:.02em;color:var(--dim)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
  .row:last-child{margin-bottom:0}
  .row span{font-size:12.5px}
  .sw{appearance:none;width:42px;height:24px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.3);position:relative;cursor:pointer;flex:none;transition:.15s}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:999px;background:var(--dim);transition:.15s}
  .sw.on{background:rgba(114,230,225,.22);border-color:var(--cyan)}
  .sw.on::after{transform:translateX(18px);background:var(--cyan)}

  /* 클릭 유도 오버레이(데스크톱) */
  #enter{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;
    background:radial-gradient(120% 90% at 50% 40%, rgba(20,21,26,.35), rgba(10,10,14,.72));cursor:pointer;text-align:center;padding:24px}
  #enter .big{font-size:19px;font-weight:700;letter-spacing:-.01em}
  #enter .sub{font-size:12.5px;color:var(--dim);line-height:1.7}
  #enter.hide{display:none}

  /* 모바일 조작 힌트 + 조이스틱 */
  .mobhint{display:none}
  /* ⚠ 조이스틱 룩은 **여기 없다** — `js/shared/joystick-look.js` 가 SSOT 다.
     감독 지시 2026-08-24 «전부 같게 해라» (카드 판정 「크림+십자눈금 쪽」).

     걷어낸 것: 보라 노브(`rgba(139,114,255,.55)`)·회색 원·46px·**왼쪽 아래 상시 표시**.
     이 페이지는 저장소에서 **네 번째** 조이스틱이었고, 클래스 이름이 `#joy`/`.nub` 라
     `lu-joy` 로 세던 집계에 안 잡혔다 — 그래서 직전 회차가 *"세 벌"* 이라고 적었고
     그것이 틀렸다. **이름으로 세면 이름이 다른 것을 못 센다.** */
  #joy{z-index:20;touch-action:none}
  #joyNub{z-index:21}
  #looktip{display:none;position:fixed;right:22px;bottom:40px;z-index:20;font-size:11px;color:var(--dim);
    background:rgba(20,21,27,.5);border:1px solid var(--line);border-radius:10px;padding:8px 12px;pointer-events:none}
  .is-touch #enter{display:none}
  .is-touch #hintDesk{display:none} /* 모바일=데스크톱 조작 안내 숨김(조이스틱 힌트만) */
  /* ⚠ `#joy` 를 뺐다 — 이제 **터치한 자리에 뜬다**(감독 지시 «터치해야 조이스틱 나오고»).
     보임/숨김은 모듈의 `opacity` 가 하므로 `display` 로 켜면 등장 스프링이 죽는다. */
  .is-touch .mobhint,.is-touch #looktip{display:block}

  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

  /* v2 배지 */
  .v2-badge{position:fixed;top:16px;right:66px;z-index:10;
    background:rgba(139,114,255,.25);border:1px solid rgba(139,114,255,.45);
    border-radius:6px;padding:5px 11px;font-size:11px;font-weight:600;
    color:#8B72FF;letter-spacing:.02em;pointer-events:none}

  /* 들어올 때 어둠에서 밝아진다. 나가는 쪽(world2 진입 안내)이 어둠으로 덮고 넘기므로
     이 페이드인이 그 뒤를 받아 한 번의 디졸브가 된다 — 감독 지적 2026-08-24
     «팍 들어가는데.. 디졸브로 보여주면 어떨까?».
     각자 자기 쪽만 맡는다: 페이지를 넘어 상태를 옮기지 않으므로 직접 열었을 때도
     짧은 암전에서 시작하는데, 그것은 로딩을 덮어 주는 쪽이라 손해가 아니다. */
  @keyframes venueIn { from { opacity: 1 } to { opacity: 0 } }
  #venue-veil{ position:fixed; inset:0; z-index:9998; background:#000; pointer-events:none;
    animation: venueIn .55s ease-out forwards; }
  @media (prefers-reduced-motion: reduce){ #venue-veil{ display:none } }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="venue-veil" aria-hidden="true"></div>

<div class="v2-badge">✨ v2</div>

<div class="plate hud-info">
  <div class="titlerow"><span class="tick"></span><span class="title" id="spaceTitle">나의 전시실</span></div>
  <div class="hint" id="hintDesk"><b>클릭</b>해 둘러보기 · <b>WASD</b> 이동 · 마우스 시선 · <b>ESC</b> 커서 해제</div>
  <div class="hint mobhint">왼쪽 <b>조이스틱</b> 이동 · 오른쪽 <b>드래그</b> 시선</div>
</div>

<div class="plate hud-gear" id="bGear" aria-label="설정">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
</div>

<div class="plate hud-settings" id="settings">
  <h4>관람 설정</h4>
  <div class="row"><span>깊이 · 안개</span><button class="sw on" id="swFog" role="switch" aria-checked="true"></button></div>
  <div class="row"><span>라이트맵 굽기</span><button class="sw" id="swBake" role="switch" aria-checked="false"></button></div>
</div>

<div id="enter">
  <div class="big">클릭해 둘러보기</div>
  <div class="sub">WASD 이동 · 마우스로 시선 · ESC로 커서 해제</div>
</div>

<!-- ⚠ 손잡이가 링의 **형제**다 — 갤러리(`js/player.js`)와 같은 구조여야 모듈이 내는
     `knobCenter:'margin'` 갈래가 그대로 맞는다. 자식으로 두면 중심이 어긋난다. -->
<div class="lu-joy-base" id="joy" aria-hidden="true"></div>
<div class="lu-joy-knob" id="joyNub" aria-hidden="true"></div>
<div id="looktip">오른쪽 드래그 = 시선</div>

<script type="module">
import { decodeSpace, newSpace } from './js/space.js';
import {
  joystickCss, injectJoystickStyle, leanState, JOY_RADIUS, LEAN_MOVING, LEAN_RUNNING,
} from './js/shared/joystick-look.js';
import { createVisit } from './js/visit.js';
import { generateSpace, GEN_LAYOUTS, pickGalleryId } from './js/space-generate.js';
import { buildOutsideView } from './js/space-outside.js';

// 로드 소스 (앞의 것이 이긴다):
//   ?u=<작가>  → 그 작가의 갤러리 데이터로 **전시장을 자동생성**한다(space-generate).
//   ?src=local(또는 미지정) → localStorage 빌더 저장 키 → decodeSpace
//   그 외/실패 → DEFAULT
// URL에 space 데이터 인코딩 금지(space.js 계약) — 담기는 것은 **작가 아이디뿐**이고
// 공간은 그 자리에서 계산된다. 무저장 원칙이 그대로 유지된다.
//
// ⚠ 아이디 검증은 화이트리스트다 — `galleries/index.json` **목록에 있는 id 만** 연다.
// 형식 검사(정규식)로는 `../` 류를 막는 책임이 이쪽에 생기는데, 목록 대조는 그 책임
// 자체를 없앤다. world2 의 `decide/tenant-id.ts` 를 쓰지 않는 이유는 **세계 간 결합**이다
// (visit 이 world2 내부를 import 하면 공유가 아니게 된다 — 팀장 규칙 R2 와 같은 형태).
async function fetchJson(url) {
  try { const r = await fetch(url); return r.ok ? await r.json() : null; } catch (e) { return null; }
}

async function loadSpace() {
  const q = new URLSearchParams(location.search);
  const u = q.get('u');
  if (u) {
    const index = await fetchJson('./galleries/index.json');
    const id = pickGalleryId(index, u); // 목록에 없으면 null — 판정은 space-generate 가 소유한다
    if (id) {
      const doc = await fetchJson(`./galleries/${id}.json`);
      if (doc && Array.isArray(doc.artworks)) {
        const layout = GEN_LAYOUTS.includes(q.get('gen')) ? q.get('gen') : undefined;
        const roomUp = Math.max(0, Math.min(4, parseInt(q.get('room'), 10) || 0));
        // 액자 배율 노브 — 감독이 화면에서 비교해 정한다(`?art=1.0` ~ `?art=2.0`).
        // 범위 검증은 space-generate 가 소유한다(ART_SCALE) — 여기서 다시 자르지 않는다.
        const artScale = parseFloat(q.get('art'));
        const r = generateSpace(
          doc.artworks.map((a) => ({
            id: a.id, title: a.title, imageUrl: a.imageUrl, videoUrl: a.videoUrl, featured: a.featured,
          })),
          { layout, roomUp, artScale, name: doc.name, author: doc.artist || id },
        );
        // 미배치가 있으면 조용히 넘기지 않는다 — 작가는 자기 작품이 빠진 걸 알아야 한다.
        if (r.dropped.length) console.warn(`[visit] 자리를 못 찾은 작품 ${r.dropped.length}점:`, r.dropped.join(', '));
        return r.space;
      }
    }
  }
  const src = q.get('src');
  if (src === null || src === 'local') {
    try { const raw = localStorage.getItem('openartshow.space.v1'); const dec = raw && decodeSpace(raw); if (dec) return dec; } catch (e) {}
  }
  return newSpace();
}
const space = await loadSpace();

const canvas = document.getElementById('c');
const V = createVisit({ canvas, space, opts: { preserveDrawingBuffer: true } });
window.__visit = V;

// 창밖 풍경 — 창문이 있는 공간에만 붙인다(감독 지시 2026-08-24, 별도 파일 `space-outside`).
// 창문이 없으면 벽이 다 막아 보이지 않으므로 세울 이유가 없다(드로우콜만 는다).
// `visit.js` 는 건드리지 않는다 — 방 조립과 바깥은 별개이고, 통째로 빼도 방은 그대로다.
// ⚠ 카메라 far 를 **넘긴다**. 안 넘기면 풍경이 클리핑 평면 밖에 서서 통째로 안 보이고,
// 그 화면은 「아직 안 만들었다」와 구별되지 않는다(근거·실측은 space-outside.ts 헤더).
const outside = (space.parts || []).some((p) => p && p.t === 'window')
  ? buildOutsideView({ mood: new URLSearchParams(location.search).get('sky'), cameraFar: V.getCamera().far })
  : null;
if (outside) V.getScene().add(outside.group);
window.__outside = outside;

document.getElementById('spaceTitle').textContent = (space.meta && space.meta.name) || '나의 전시실';

function fit(){ V.resize(window.innerWidth, window.innerHeight); }
window.addEventListener('resize', fit); fit();

// 클릭 유도 오버레이 — 포인터락 획득/해제에 따라 표시.
const enter = document.getElementById('enter');
V.on('lock', ({locked})=>{ enter.classList.toggle('hide', locked); });
enter.addEventListener('click', ()=>{ if (canvas.requestPointerLock) canvas.requestPointerLock(); });

// 설정 패널
const settings = document.getElementById('settings'), bGear = document.getElementById('bGear');
bGear.addEventListener('click', (e)=>{ e.stopPropagation(); settings.classList.toggle('on'); });
document.addEventListener('click', (e)=>{ if(settings.classList.contains('on') && !settings.contains(e.target) && !bGear.contains(e.target)) settings.classList.remove('on'); });
const swFog = document.getElementById('swFog');
swFog.addEventListener('click', ()=>{ const on = V.toggleFog(); swFog.classList.toggle('on', on); swFog.setAttribute('aria-checked', on); });
const swBake = document.getElementById('swBake');
swBake.addEventListener('click', ()=>{ if(swBake.classList.contains('on')) return; V.bake(); swBake.classList.add('on'); swBake.setAttribute('aria-checked','true'); });

// ── 모바일: 터치 감지 → 좌 조이스틱(이동) + 우 드래그(시선) ──
const isTouch = (typeof window !== 'undefined') && ('ontouchstart' in window || (navigator.maxTouchPoints||0) > 0);
if (isTouch) {
  document.body.classList.add('is-touch');
  // ── 조이스틱 — **갤러리와 같은 방식**(감독 지시 2026-08-24 «전부 같게 해라») ────
  //
  // 바뀐 것이 룩만이 아니다. 이전에는 `#joy` 가 **왼쪽 아래 고정**이고 그 요소에 터치
  // 리스너가 달려 있어 «어디를 눌러야 하나» 가 있었다. 지금은 갤러리·오픈월드·world2 와
  // 같이 **왼쪽 절반 아무 데나 짚으면 그 자리에 뜬다.**
  //
  // ⚠ 반경이 `JR = 40` → `JOY_RADIUS`(60) 로 커진다. 같은 손가락 거리에서 기울기가
  // 작아지므로 **감도도 함께 바뀐다** — 룩만 옮긴 것이 아니다.
  const joy = document.getElementById('joy'), nub = document.getElementById('joyNub');
  injectJoystickStyle(document, 'lu-joy-style', joystickCss({
    base: '.lu-joy-base', knob: '.lu-joy-knob',
    on: '.lu-joy-base.lu-live', knobOn: '.lu-joy-knob.lu-live',
    lean: (v) => `.lu-joy-base.lu-lean${v}`,
    leanKnob: (v) => `.lu-joy-knob.lu-lean${v}`,
    knobCenter: 'margin', fixed: true,
  }));
  let joyId = null, jsx = 0, jsy = 0;
  function joyPlace(x, y){
    for(const el of [joy, nub]){ el.style.left = x+'px'; el.style.top = y+'px'; }
  }
  function joyStart(t){
    joyId = t.identifier; jsx = t.clientX; jsy = t.clientY;
    joyPlace(jsx, jsy);
    joy.classList.add('lu-live'); nub.classList.add('lu-live');
  }
  function joyMove(e){
    for(const t of e.changedTouches){ if(t.identifier!==joyId) continue;
      const dx = t.clientX-jsx, dy = t.clientY-jsy, len = Math.hypot(dx,dy);
      const scale = len > JOY_RADIUS ? JOY_RADIUS/len : 1;
      nub.style.left = (jsx + dx*scale)+'px'; nub.style.top = (jsy + dy*scale)+'px';
      const ux = (dx*scale)/JOY_RADIUS, uy = (dy*scale)/JOY_RADIUS;
      const lean = leanState(Math.hypot(ux, uy));
      for(const el of [joy, nub]){
        el.classList.toggle('lu-lean1', lean === LEAN_MOVING);
        el.classList.toggle('lu-lean2', lean === LEAN_RUNNING);
      }
      V.setTouchMove(-uy, ux); // 입력 계약 불변: 위로 밀면 전진(-uy), 오른쪽=우측 스트레이프
    }
  }
  function joyEnd(e){
    for(const t of e.changedTouches){ if(t.identifier!==joyId) continue;
      joyId = null;
      joy.classList.remove('lu-live','lu-lean1','lu-lean2');
      nub.classList.remove('lu-live','lu-lean1','lu-lean2');
      V.setTouchMove(0, 0);
    }
  }
  // ⚠ 리스너가 `#joy` 에서 **캔버스로** 옮겨 왔다 — 모듈 CSS 가 조이스틱에
  // `pointer-events:none` 을 주므로 그 요소는 이제 터치를 못 받는다(순수 시각 피드백).
  canvas.addEventListener('touchstart', (e)=>{
    for(const t of e.changedTouches){
      if(t.clientX < window.innerWidth*0.5 && joyId === null){ joyStart(t); e.preventDefault(); }
    }
  }, {passive:false});
  canvas.addEventListener('touchmove', (e)=>{ if(joyId!==null){ joyMove(e); e.preventDefault(); } }, {passive:false});
  canvas.addEventListener('touchend', joyEnd); canvas.addEventListener('touchcancel', joyEnd);
  // 우측 드래그 = 시선
  let lookId=null, lx=0, ly=0;
  canvas.addEventListener('touchstart', (e)=>{ const t=e.changedTouches[0]; if(t.clientX < window.innerWidth*0.5) return; lookId=t.identifier; lx=t.clientX; ly=t.clientY; }, {passive:true});
  canvas.addEventListener('touchmove', (e)=>{ for(const t of e.changedTouches){ if(t.identifier!==lookId) continue; V.lookDelta((t.clientX-lx)*0.004, (t.clientY-ly)*0.004); lx=t.clientX; ly=t.clientY; } }, {passive:true});
  canvas.addEventListener('touchend', (e)=>{ for(const t of e.changedTouches){ if(t.identifier===lookId) lookId=null; } });
}
</script>
</body>
