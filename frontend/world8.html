<!--
  world8 — **블렌더를 거친 GLB 가 곧 세계다.** world2 의 포크다.

  behind-flag: 어디에도 링크하지 않는다. 라이브 노출은 감독·팀장 게이트를 거친다.

  ── 왜 이 파일이 world2.html 의 복사본인가 ──────────────────────────────────
  감독 지시 2026-08-26: *"월드8에 월드 2의 기본 기능 다 들어가야지"*(카드 답
  「할 수 있는 것은 전부」) → *"지금 월드 2와 월드8 다르잖아. 그림자 구현방식도 다르고.
  치비도 다녀야하고. 구름. 천둥번개등 조이스틱으로 달리기 속도도 다르고."*

  앞선 회차는 world2 의 기능을 **부분 이식**하려 했고 다섯 축에서 다섯 번 막혔다.
  이식은 원리상 원본과 **다른 물건**을 만든다 — 감독이 지적한 차이가 정확히 그것이다.
  팀장 판정(2026-08-26)으로 **전체 포크**로 전환했고, 그래서 이 파일과 world2.html 의
  차이는 **제목·자산·부트 경로 셋뿐**이다. 조이스틱 구역·미니맵 서랍·HUD·노브 바·
  로딩 화면은 **한 글자도 안 고친다** — 안 고쳐야 같다.

  경위·판정 축·no-sync 정책은 `js/world8/README.md` 한 곳이다.

  ⚠ **세계가 되는 GLB 는 `<body data-glb>` 가 가리킨다.** 진짜 블렌더(bpy 5.0.1)가
  우리 내보내기를 읽고 조형물을 얹어 다시 쓴 파일이고, 절차는
  `scripts/asset/extract-world2-glb.mjs` + `blender-edit.py` 두 곳이다.
-->
<!-- connect-src 에 blob: 이 필요하다: GLTFLoader 가 VRM 내장 텍스처를 디코드할 때
     ImageBitmapLoader 가 버퍼뷰를 Blob→objectURL 로 만들고 fetch() 로 읽는다.
     'self' 만으로는 이 blob: fetch 가 막혀 텍스처 전체가 로드 실패한다
     (lab-glb.html 이 헤드리스 검증으로 발견한 것을 그대로 계승). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob:; object-src 'none'; base-uri 'none'">
<title>월드8 · 블렌더를 거친 세계 · OpenArtShow</title>
<link rel="stylesheet" href="./vendor/fonts/fonts.css">
<style>
  :root{
    --bg:#0B0D12; --ink:#F5F5F2; --dim:#9A9EB1; --line:#3A3D4B;
    --violet:#8B72FF; --cyan:#72E6E1;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
  body{font-family:'Pretendard','NanumGothic',system-ui,sans-serif}
  #w8-canvas{display:block;width:100vw;height:100vh;touch-action:none}

  /* ── 물속 (감독 지시 2026-07-31 "강에 사람이 빠지게해줘") ──────────────────
     카메라를 수면 아래로 내리는 것만으로는 **물속으로 안 읽힌다.** 물 판이
     FrontSide 라 아래에서는 안 보이고, 위를 올려다보면 하늘이 그대로 있어서
     물에 잠긴 게 아니라 땅에 파묻힌 것처럼 보인다.

     scene.fog 를 물빛으로 바꾸는 길은 버렸다 — 하늘 시스템이 매 프레임 안개색을
     시간대에 맞춰 덮어써서 둘이 싸우고, WebGL/WebGPU 렌더 경로 차이도 탄다.
     화면 오버레이는 두 백엔드에서 똑같이 동작한다(이 저장소의 백엔드 사각을
     피하는 정석 수단이다).

     **색은 여기가 SSOT 이고 세기는 `decide/swim.ts` 가 SSOT 다.** JS 는 opacity
     하나만 만진다 — 색을 JS 로 넘기면 같은 물빛이 두 곳에 살게 된다.

     z-index 5 — 캔버스(기본 0) 위, UI(6~10) 아래. 물에 빠졌다고 지도·HUD 가
     물빛에 잠기면 나갈 길을 못 찾는다.

     가장자리를 더 짙게 해 시야가 좁아진 느낌을 준다. 단색 한 장이면 화면에
     색유리를 댄 것처럼 보이지 물에 잠긴 것으로는 안 보인다.

     transition 을 걸지 않는다 — 잠김 보간은 `stepSubmersion` 이 시간으로 이미
     하고 있다. 여기에 또 걸면 두 보간이 겹쳐 물 밖에 나온 뒤에도 색이 남는다. */
  #w8-underwater{
    position:fixed;inset:0;z-index:5;pointer-events:none;opacity:0;
    background:radial-gradient(120% 100% at 50% 45%, #0d4256 0%, #05202e 100%);
  }

  /* ── 로딩 화면 ─────────────────────────────────────────────────────────
     바 보간을 CSS transition에 맡긴다. 로딩 중에는 메인 스레드가 가장 바쁘므로
     JS로 애니메이션을 돌리면 그 애니메이션부터 끊기고, 끊기는 진행바는
     "멈춤"의 신호로 읽혀 없느니만 못하다. */
  /* 바를 화면 정중앙에 **고정**하고 나머지는 그 위아래에 절대 배치한다.
     3초 뒤 라벨·문구가 나타날 때 바가 밀려나면, 조용히 지나가다 풍성해지는 게 아니라
     화면이 튀는 걸로 읽힌다. 자리를 옮기지 않고 겹쳐 띄우는 이유다. */
  #w8-loading{
    position:fixed;inset:0;z-index:10;
    display:grid;place-items:center;
    background:radial-gradient(120% 90% at 50% 40%, #151926 0%, var(--bg) 70%);
    transition:opacity .45s ease;
  }
  #w8-loading[data-state="done"]{opacity:0;pointer-events:none}
  #w8-loading-center{position:relative;display:grid;place-items:center;gap:10px}

  /* 부가 요소는 3초를 넘겨야(data-detail="rich") 나타난다 — 감독 지시.
     레이아웃에서 빠지지 않고 자리만 유지한 채 투명해진다(절대 배치라 바를 안 민다). */
  #w8-loading-label,#w8-loading-copy,#w8-loading-pct{
    position:absolute;left:50%;transform:translateX(-50%);
    margin:0;white-space:nowrap;
    opacity:0;transition:opacity .5s ease;
  }
  #w8-loading-label{bottom:calc(100% + 20px);font-size:15px;letter-spacing:.02em;color:var(--ink)}
  #w8-loading-pct{top:calc(100% + 14px);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  #w8-loading-copy{top:calc(100% + 40px);font-size:13.5px;line-height:1.5;color:var(--dim)}

  /* 퍼센트는 바의 수치 표현이므로 minimal에서도 보인다. "프로그레스 바만"의 일부다. */
  #w8-loading-pct{opacity:1}
  #w8-loading[data-detail="rich"] #w8-loading-label{opacity:1}
  /* 실패는 밀도와 무관하게 보여야 한다. 3초 전에 부팅이 깨지면 minimal이라 라벨이
     숨겨진 채 남고, 사용자는 멈춘 진행바만 보게 된다 — 오류를 감추는 최악의 상태다. */
  #w8-loading[data-state="error"] #w8-loading-label{opacity:1}

  #w8-loading-track{
    width:min(320px,62vw);height:2px;border-radius:2px;
    background:rgba(255,255,255,.12);overflow:hidden;
  }
  #w8-loading-bar{
    width:0%;height:100%;border-radius:2px;
    background:linear-gradient(90deg,var(--violet),var(--cyan));
    transition:width .35s cubic-bezier(.22,.61,.36,1);
  }
  /* 문구 교체는 JS가 텍스트만 갈고 페이드는 여기서 한다 — 로딩 중에는 메인 스레드가
     가장 바쁘므로 JS 애니메이션을 돌리면 그 애니메이션부터 끊긴다.
     rich 진입 + data-show 둘 다여야 보인다(3초 게이트와 교체 페이드가 각자 산다). */
  #w8-loading[data-detail="rich"] #w8-loading-copy[data-show="1"]{opacity:1}
  #w8-loading-note{
    position:absolute;top:calc(100% + 68px);left:50%;transform:translateX(-50%);
    margin:0;width:max-content;max-width:min(420px,80vw);white-space:normal;
    text-align:center;font-size:12.5px;line-height:1.6;color:var(--dim);
  }
  #w8-loading[data-state="error"] #w8-loading-bar{background:#FF705E}
  #w8-loading[data-state="error"] #w8-loading-note{color:#FFB4A8}

  /* 모션을 줄이고 싶다는 뜻은 존중한다 — 전환을 없애도 정보 전달은 그대로다. */
  @media (prefers-reduced-motion: reduce){
    #w8-loading,#w8-loading-bar,#w8-loading-copy{transition:none}
    #w8-loading-copy{transform:none}
  }


  /* ── 가상 조이스틱 ─────────────────────────────────────────────────────
     ⚠ **2026-08-21 개정 (팀장 판정 (나)).** 예전에는 `pointer-events:none` 으로 그림만
     그리고 터치는 캔버스가 받았다 — 「누른 자리에 조이스틱이 생기는」 설계였다. 그런데
     그 판정(화면 왼쪽 절반)이 편집(`?edit=1`)과 충돌하는 근원이었다: 같은 터치가
     조이스틱과 편집에 **둘 다** 들어가 물건이 선택되면서 동시에 아바타가 걸었다.

     그래서 **이 원 자체가 판정 영역**이 됐다(`pointer-events:auto` + 포인터 캡처).
     자리가 정해져야 영역이 정해지므로 「누른 자리에 생긴다」는 함께 내줬다 — 그 대가와
     되돌릴 조건은 `decide/touch.ts` 의 `assignSlot` 이 있던 자리 한 곳에 적었다.

     `touch-action:none` 이 필요한 이유: 없으면 브라우저가 스크롤로 해석해 드래그 도중
     `pointercancel` 을 던진다.

     기본이 `display:none` 이고 **`pointer:coarse` 에서만** 뜬다 — 데스크톱에 원이 상시
     보이면 안 된다. 폭이 아니라 포인터 종류로 보는 것은 저장소 관례다(`decide/touch.ts`
     의 `isTouchDevice`: *"좁은 창의 데스크톱에 조이스틱이 뜨거나 큰 태블릿에서 안 뜨는
     일을 막는다"*). */
  /* ⚠⚠ **2026-08-21 재개정 — 감독 판정 «조이스틱 고정이 불편해».**
     첫 개정(같은 날)이 원을 좌하단에 **고정**했고, 그 자리에 *"되돌릴 조건: 감독이
     「자리가 손에 안 맞는다」고 말할 때"* 라고 적어 뒀다. **그 조건이 발동했다.**

     그러나 옛 설계(화면 왼쪽 **절반 전체**가 판정)로 되돌리면 편집 충돌이 되살아난다.
     그래서 **둘 다** 되는 형태로 간다 — 판정을 「구역」이 받고, 원은 **누른 자리에
     그려진다**:

       `#w8-stick-zone`  좌하단 **구역**. 터치를 받는 것은 이것 하나다(고정)
       `#w8-stick`       원. 구역 안에서 **누른 자리로 움직인다**(`pointer-events:none`)

     즉 「엄지가 닿는 자리에 생긴다」는 복원되고, 「구역 밖은 편집 전용」은 유지된다.
     구역이 화면 절반이 아니라 **왼쪽 아래 일부**라는 것이 그 둘을 가르는 지점이다. */
  #w8-stick-zone{
    display:none;
    position:fixed;z-index:6;left:0;bottom:0;
    /* 엄지가 닿는 범위. 세로 폰에서 오른손 엄지는 화면 왼쪽 아래에서 움직인다.
       넓힐수록 손에 맞지만 편집이 좁아진다 — 이 값이 그 거래다.

       🔴 **`44vw` 인 것은 화면 중앙을 넘지 않기 위해서다**(검수관 블로커, 2026-08-21).
       첫 판본은 `52vw` 였고 **어떤 뷰포트에서도 중앙(50vw)을 넘었다.** 하단 중앙에는
       조준 막대(`#w8-aim .bar` — `left:50%` 정중앙 대칭, `z-index:46`)가 있어서,
       겹치는 자리의 터치를 그쪽이 가져간다(375px 화면 기준 겹침이 구역의 **47%**였다).
       조준 중에 다가가려고 미는 손이 거기서 씹힌다.
       ⚠ 이것은 **첫 판본(112px 고정, `left:18px`)에는 없던 회귀**다 — 그때는 왼쪽
       130px 안에 갇혀 있어 중앙까지 닿지 못했다. 구역으로 넓히면서 새로 들어갔고,
       바로 그날 아침 검수관이 *"`.bar` 가 하단 중앙을 가로지른다"* 고 이미 짚은 자리다.
       **넓히고 싶어지면 그 막대부터 본다.** */
    width:min(44vw, 300px);height:min(38vh, 300px);
    pointer-events:auto;touch-action:none;
  }
  /* 조준 중에는 구역을 막대 **위로** 올려 안 겹치게 한다.

     🔴 **`140px` 은 실측에서 나온 값이다**(검수관 헤드리스 4기기, 2026-08-21). 첫 조치는
     `72px` 이었고 *"막대 높이가 패딩 포함 ~40px"* 이라는 **내 추정**에서 나왔다 —
     **틀렸다.** 막대는 안내 문구 줄(`aim-mode.ts` 의 `msg` 가 **항상** 채운다)과 버튼 줄의
     2단이라 실제 높이가 **74.4px**, 좁은 화면에서는 문구가 줄바꿈해 **113.4px** 이다.
     `bottom:16px + safe` 를 더하면 막대 상단이 화면 바닥에서 **90.4px**(iPhone SE 는
     **129px**) 위에 온다. 72 는 그보다 작아 **네 기기 전부에서 겹쳤다**(세로 18.4~57.4px).

     ⚠ **텍스트만 보는 검사(`GS-J6`)가 이것을 못 잡았다** — 그 검사는 스스로 그 한계를
     적어 뒀고 정확히 거기서 새어 나갔다. 「문구 줄이 있다」는 CSS 선언에 안 보인다.
     그래서 아래 하한을 **검사로** 못 박는다(같은 파일의 `GS-J6` 세 번째 케이스).

     **줄이고 싶어지면 막대를 실제로 렌더해서 재라.** 추정하지 마라 — 내가 그래서 틀렸다.

     ⚠ 남은 이론적 사각 하나(검수관 권고, 비블로커): 막대의 `bottom` 은 `16px + safe-area`
     인데 이 회피값은 **safe-area 를 안 더한 고정값**이다. 계산상 「좁은 폭(320px, 문구가
     줄바꿈해 막대 113.4px) + safe-area 34px」 조합만 모자라는데(-23.4px), **그 조합의
     실존 iOS 기기가 없다** — 320~375px 기종은 홈버튼 세대라 safe-area 가 0 이고, 노치
     세대는 375px 이상이라 줄바꿈이 안 난다. **이 값을 다시 만질 때 이 계산도 같이 본다.** */
  body:has(#w8-aim[data-on="1"]) #w8-stick-zone{ bottom:140px;height:min(26vh, 200px) }
  @media (pointer:coarse){ #w8-stick-zone{display:block} }
  /* ── 룩은 **여기 없다** — `js/shared/joystick-look.js` 가 SSOT 다 ────────────────
     감독 지시 2026-08-24: *"작가갤러리룸의 조이스틱과 형식을 맞춰주고. **하드코딩하지
     말고 가지고 오는 방향으로** 해."*

     ⚠ **직전 회차에 내가 여기에 값을 복사했다.** 갤러리(`js/player.js`)의 CSS 를 그대로
     옮겨 적었고, 그러면 저장소에 같은 값이 **세 벌**이 된다(갤러리 · 오픈월드
     `js/world-boot.js` · 여기). 감독 지시는 그 부채를 끊으라는 것이다.

     지금은 `ui/touch-controls.ts` 가 `joystickCss({...})` 로 CSS 를 **받아서 주입**한다.
     색·크기·상태 색은 전부 그 모듈 한 곳이고 **여기에 다시 적지 않는다.**

     ⚠⚠ **레이아웃(구역 크기·조준 회피)은 위에 그대로 남는다** — 그것은 룩이 아니고,
     `44vw`·`140px` 는 검수관 블로커와 헤드리스 4기기 실측으로 정해진 값이다.

     ⚠⚠⚠ 스크립트가 안 돌면 조이스틱 룩이 없다. 조이스틱은 어차피 스크립트가 움직이므로
     룩만 남아도 의미가 없다 — 그래서 이 교환을 받아들인다. */

  /* ⚠ 손잡이의 중심 정렬도 **여기 없다**(2026-08-24). 모듈이 `knobCenter` 옵션으로 낸다 —
     갤러리는 형제 구조라 `margin` 으로, world2 는 자식 구조라 `50%`+`translate` 로 잡는다.
     그 두 갈래를 모듈이 알고 있으므로 여기 다시 적으면 값 미러링이 된다.
     (`drawKnob` 이 매 프레임 인라인 `transform` 으로 덮어쓰므로 CSS 값은 손을 떼었을 때의
     제자리이고, `left/top:50%` 는 그 인라인 `calc(-50% + …)` 의 기준점이라 필요하다.) */

  /* ── 성능 HUD ──────────────────────────────────────────────────────────
     기본은 아이콘 하나만. 펼쳐야 수치가 나온다 — 평소에 화면을 가리면
     "걸을 때 끊기는가"를 보는 데 방해가 된다. */
  #w8-hud{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:8;
    display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  #w8-hud-toggle{
    width:38px;height:38px;border-radius:10px;cursor:pointer;
    background:rgba(11,13,18,.62);border:1px solid var(--line);color:var(--ink);
    font-size:16px;line-height:1;padding:0;
  }
  #w8-hud-panel{display:none;background:rgba(11,13,18,.86);border:1px solid var(--line);
    border-radius:10px;padding:9px 10px;min-width:min(230px,64vw)}
  #w8-hud[data-open="1"] #w8-hud-panel{display:block}
  #w8-hud-body{
    margin:0 0 8px;white-space:pre-wrap;word-break:break-all;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11px;line-height:1.55;color:var(--ink);
  }
  /* 두 버튼이 한 줄에 선다. 마크는 자주·급히 눌러야 하므로 폭을 고정해 손가락이
     같은 자리를 찾게 하고, 복사는 남는 폭을 다 쓴다. */
  #w8-hud-copy,#w8-hud-mark{
    padding:7px 10px;border-radius:8px;cursor:pointer;
    background:rgba(139,114,255,.18);border:1px solid rgba(139,114,255,.5);
    color:var(--ink);font-size:12px;font-family:inherit;
  }
  #w8-hud-copy{width:calc(100% - 62px)}
  #w8-hud-mark{width:56px;margin-right:6px}

  /* ── 神 모드 하늘 패널 ──────────────────────────────────────────────────
     HUD 아래에 붙인다. 하늘을 바꾸면서 바로 위 수치를 보는 것이 이 패널의
     목적이므로 둘이 같은 시야 안에 있어야 한다. 기본 접힘. */
  /* ── 미니맵 = 왼쪽 책갈피 (감독 지시) ────────────────────────────────────
     "지도에 왼쪽 책갈피로 펼치고 접게 해."

     접을 때 `display:none` 을 쓰지 않는다 — 캔버스가 레이아웃에서 빠지면 크기가 0이
     되고, 다시 펼칠 때 한 프레임 동안 빈 지도가 보인다. `transform` 은 레이아웃을
     안 건드리고 화면 밖으로 밀어내기만 한다. */
  #w8-mapwrap{
    position:fixed;left:0;bottom:calc(120px + env(safe-area-inset-bottom));z-index:8;
    display:flex;align-items:flex-end;
    transition:transform .24s cubic-bezier(.4,0,.2,1);
    pointer-events:none;
  }
  #w8-mapwrap[data-open="0"]{
    /* 지도 폭만큼 왼쪽으로 밀되 **탭은 남긴다** */
    transform:translateX(calc(-100% + 26px));
  }
  #w8-mapwrap .sheet{
    padding:5px;border-radius:0 10px 10px 0;background:rgba(11,13,18,.78);
    border:1px solid var(--line);border-left:none;line-height:0;
  }
  #w8-map{display:block;width:104px;height:104px;border-radius:6px}
  /* 책갈피 — 지도 오른쪽에 붙어 함께 미끄러진다 */
  #w8-map-tab{
    pointer-events:auto;cursor:pointer;
    width:22px;height:52px;margin-bottom:6px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(11,13,18,.86);border:1px solid var(--line);border-left:none;
    border-radius:0 8px 8px 0;color:var(--dim);
    font-size:15px;font-family:inherit;line-height:1;padding:0;
  }
  #w8-map-tab:hover{color:var(--ink)}
  @media (min-width:760px){
    #w8-mapwrap{bottom:16px}
    #w8-map{width:132px;height:132px}
  }

  /* 왼쪽 고정 (감독 지시). 예전엔 `right:56px` 이라 닫힌 상태에서 오른쪽에 있다가,
     열면 패널이 왼쪽으로 펼쳐지며 **버튼까지 따라 움직이는** 것처럼 보였다.
     처음부터 왼쪽에 두면 열고 닫아도 버튼이 제자리에 있다. */
  /* ── 진입 바 (W8-3 S6) ────────────────────────────────────────────────────
     **상단 중앙**이다 — 좌상단은 하늘 패널(`#w8-god`), 왼쪽은 지도, 우측은 HUD 가
     이미 쓴다. 룩은 `#w8-god-body` 의 것을 그대로 따랐다(새 룩 판단을 안 연다).
     `hidden` 과 `data-show` 를 둘 다 쓰는 이유: 전자는 접근성 트리에서 빼고,
     후자는 CSS 가 본다 — 하나만 쓰면 스크린리더가 빈 칸을 읽거나 화면에 남는다. */
  #w8-tenant{
    position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    z-index:9;max-width:min(360px,88vw);
    background:rgba(11,13,18,.88);border:1px solid var(--line);border-radius:10px;
    padding:9px 11px;display:flex;flex-direction:column;gap:7px;
  }
  #w8-tenant[data-show="0"],#w8-tenant[hidden]{display:none}
  #w8-tenant .row{display:flex;align-items:center;gap:6px}
  #w8-tenant-title{font-size:12px;color:var(--ink);font-weight:600;flex:1 1 auto;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #w8-tenant-notice{margin:0;font-size:11px;line-height:1.45;color:var(--dim)}
  #w8-tenant-notice[hidden]{display:none}
  #w8-tenant-list,#w8-tenant-input{
    font-family:inherit;font-size:11.5px;padding:6px 8px;border-radius:8px;min-width:0;
    background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink);
  }
  #w8-tenant-list{flex:0 1 40%}
  #w8-tenant-input{flex:1 1 auto;width:100%}
  #w8-tenant-go,#w8-tenant-reset{
    font-family:inherit;font-size:11.5px;padding:6px 9px;border-radius:8px;cursor:pointer;flex:none;
    background:rgba(139,114,255,.24);border:1px solid rgba(139,114,255,.6);color:var(--ink);
  }
  #w8-tenant-reset{background:rgba(255,255,255,.06);border-color:var(--line);color:var(--dim)}
  #w8-tenant-reset[hidden]{display:none}

  #w8-god{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:9;
    max-width:min(300px,72vw)}
  #w8-god-toggle{
    display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:10px;cursor:pointer;
    background:rgba(11,13,18,.62);border:1px solid var(--line);color:var(--ink);
    font-size:12px;font-family:inherit;line-height:1;
  }
  #w8-god-toggle .cap{opacity:.85}
  #w8-god-toggle .caret{margin-left:2px;font-size:9px;color:var(--dim);transition:transform .2s}
  #w8-god[data-open="1"] #w8-god-toggle .caret{transform:rotate(180deg)}
  #w8-god-body{
    margin-top:6px;background:rgba(11,13,18,.88);border:1px solid var(--line);
    border-radius:10px;padding:10px 11px;display:flex;flex-direction:column;gap:8px;
  }
  #w8-god-body[hidden]{display:none}
  .w8-god-row{display:flex;align-items:center;flex-wrap:wrap;gap:5px}
  .w8-god-cap{font-size:10.5px;color:var(--dim);width:38px;flex:none}
  /* 되읽기 고지(팀장 조건 5). 줄 전체를 차지해 버튼 아래로 떨어진다 — 버튼 옆에 붙이면
     패널 폭이 밀리고, 이 문장은 한 번 읽히면 되는 것이라 자리를 다투지 않는다. */
  .w8-god-note{flex-basis:100%;font-size:10.5px;line-height:1.5;color:var(--cyan);margin-top:2px}
  .w8-god-row button{
    font-family:inherit;font-size:11.5px;padding:6px 9px;border-radius:8px;cursor:pointer;
    background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--dim);
  }
  .w8-god-row button.on{
    background:rgba(139,114,255,.28);border-color:rgba(139,114,255,.7);
    color:var(--ink);font-weight:600;
  }
  .w8-god-row[data-group="fx"] button.on{
    background:rgba(114,230,225,.24);border-color:rgba(114,230,225,.6);
  }
  /* 번개는 토글이 아니라 1회 발동이다. 비가 아니면 엔진이 무시하므로,
     반려됐을 때 잠깐 흐려져 "눌렀는데 왜 안 되지"를 남기지 않는다. */
  .w8-god-row button[data-bolt]{background:rgba(255,233,196,.14);border-color:rgba(255,233,196,.4)}
  .w8-god-row button[data-bolt].off{opacity:.35}
  @media (prefers-reduced-motion: reduce){ #w8-god-toggle .caret{transition:none} }

  /* ── 개발자 옵션 바 (감독 지시 2026-07-31 "유아이 바를 만들어봐") ──────────
     위치: 화면 우하단. #w8-god(좌상)·#w8-hud(우상)·#w8-mapwrap(좌하)이 이미 세 모서리를
     차지해 남은 자리가 여기뿐이다. #w8-god과 대각선이라 항상 분리되고, 캔버스 중앙
     (수면이 실제로 보이는 영역)을 가리지 않는다 — **미는 동안 물을 봐야 한다**가
     이 도구의 전부라서 모서리 배치가 요건이다.

     기본 접힘 — 기존 세 패널 전부와 같은 관례. 값은 접혀 있어도 계속 적용되므로
     상시 펼 필요가 없다.

     열면 위로 펼쳐진다(column-reverse). 아래엔 화면 끝/홈 인디케이터뿐이라 내려갈
     자리가 없다. 토글이 하단에 고정되고 그 위로 행이 쌓인다. */
  #w8-sliders{
    position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:8;
    display:flex;flex-direction:column-reverse;align-items:flex-end;gap:6px;
  }
  #w8-sliders-toggle{
    display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:10px;cursor:pointer;
    background:rgba(11,13,18,.62);border:1px solid var(--line);color:var(--ink);
    font-size:12px;font-family:inherit;line-height:1;
    transition:border-color .15s ease;
  }
  #w8-sliders-toggle .cap{opacity:.85}
  #w8-sliders-toggle .caret{margin-left:2px;font-size:9px;color:var(--dim);transition:transform .2s}
  #w8-sliders[data-open="1"] #w8-sliders-toggle .caret{transform:rotate(180deg)}

  /* 하나라도 지정값이면 토글에도 신호를 남긴다 — 접힌 채로는 행 안의 점이 안 보이므로,
     패널을 안 열어도 "지금 기본값이 아니다"를 알아야 지정값인 채로 세션을 끝내지 않는다. */
  #w8-sliders-toggle .dirty-dot{
    display:none;width:6px;height:6px;border-radius:50%;
    background:var(--cyan);box-shadow:0 0 4px var(--cyan);
  }
  #w8-sliders[data-dirty="1"] #w8-sliders-toggle .dirty-dot{display:inline-block}
  #w8-sliders[data-dirty="1"] #w8-sliders-toggle{border-color:rgba(139,114,255,.55)}

  #w8-sliders-body{
    width:min(260px,80vw);
    background:rgba(11,13,18,.88);border:1px solid var(--line);border-radius:10px;
    padding:10px 11px;display:flex;flex-direction:column;gap:10px;
  }
  #w8-sliders-body[hidden]{display:none}

  .w8-slide-row{display:flex;align-items:center;gap:6px}
  /* .w8-god-cap 폭 38px 을 그대로 재사용 — 좌측 패널과 라벨 정렬 리듬을 맞춘다 */
  .w8-slide-cap{
    font-size:10.5px;color:var(--dim);width:38px;flex:none;
    display:flex;align-items:center;gap:4px;line-height:1.3;
  }
  /* 지정값 점 — 색이 아니라 "있다/없다"를 1차 신호로 쓴다(색만으로 구분하지 않는다) */
  .w8-slide-pin{
    display:block;width:5px;height:5px;border-radius:50%;flex:none;
    background:var(--violet);opacity:0;transition:opacity .15s ease;
  }
  .w8-slide-row[data-overridden="1"] .w8-slide-pin{opacity:1}

  /* 트랙은 얇게(4px), 히트박스는 요소 높이(32px) 전체로 — 시각과 판정 영역을 분리한다.
     touch-action:none 은 #w8-canvas 와 같은 이유: 드래그 중 브라우저 제스처가 끼어들지
     않게 한다. */
  .w8-slide-input{
    -webkit-appearance:none;appearance:none;flex:1 1 auto;min-width:70px;
    height:32px;margin:0;background:transparent;touch-action:none;cursor:pointer;
  }
  .w8-slide-input::-webkit-slider-runnable-track{
    height:4px;border-radius:2px;background:rgba(255,255,255,.14);
  }
  .w8-slide-input::-webkit-slider-thumb{
    -webkit-appearance:none;width:20px;height:20px;border-radius:50%;margin-top:-8px;
    background:linear-gradient(145deg, rgba(139,114,255,.9), rgba(114,230,225,.8));
    border:1px solid rgba(255,255,255,.35);box-shadow:0 1px 5px rgba(0,0,0,.4);
  }
  .w8-slide-input::-moz-range-track{
    height:4px;border-radius:2px;background:rgba(255,255,255,.14);
  }
  .w8-slide-input::-moz-range-thumb{
    width:20px;height:20px;border-radius:50%;border:1px solid rgba(255,255,255,.35);
    background:linear-gradient(145deg, rgba(139,114,255,.9), rgba(114,230,225,.8));
    box-shadow:0 1px 5px rgba(0,0,0,.4);
  }
  .w8-slide-row[data-overridden="1"] .w8-slide-input::-webkit-slider-runnable-track{
    background:rgba(139,114,255,.28);
  }
  .w8-slide-row[data-overridden="1"] .w8-slide-input::-moz-range-track{
    background:rgba(139,114,255,.28);
  }

  .w8-slide-val{
    font-size:11px;color:var(--dim);width:36px;flex:none;text-align:right;
    font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .w8-slide-row[data-overridden="1"] .w8-slide-val{color:var(--ink);font-weight:600}

  .w8-slide-reset{
    width:26px;height:26px;flex:none;border-radius:8px;cursor:pointer;padding:0;
    background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--dim);
    font-size:13px;line-height:1;font-family:inherit;opacity:.4;
    transition:opacity .15s ease,color .15s ease,border-color .15s ease,background .15s ease;
  }
  .w8-slide-row[data-overridden="1"] .w8-slide-reset{
    opacity:1;color:var(--ink);border-color:rgba(139,114,255,.6);
    background:rgba(139,114,255,.16);
  }

  /* #w8-mapwrap 과 같은 브레이크포인트(760px)를 재사용해 넓은 화면에서 트랙에 여유를 준다 */
  @media (min-width:760px){
    #w8-sliders-body{width:280px}
    .w8-slide-input{min-width:120px}
  }
  @media (prefers-reduced-motion: reduce){
    #w8-sliders-toggle .caret,#w8-sliders-toggle,.w8-slide-pin,.w8-slide-reset{transition:none}
  }
</style>
</head>
<body data-page="world8" data-glb="./assets/worlds/world2-blender-edit.glb">
  <canvas id="w8-canvas"></canvas>

  <!-- 물속 틴트. `aria-hidden` — 화면에만 있는 연출이라 읽어 줄 내용이 없다 -->
  <div id="w8-underwater" aria-hidden="true"></div>

  <div id="w8-loading" data-detail="minimal">
    <div id="w8-loading-center">
      <p id="w8-loading-label">준비 중</p>
      <div id="w8-loading-track"><div id="w8-loading-bar"></div></div>
      <span id="w8-loading-pct">0%</span>
      <p id="w8-loading-copy" data-show="0"></p>
      <p id="w8-loading-note" hidden></p>
    </div>
  </div>

  <!-- 가상 조이스틱. 누른 자리에 나타난다(고정 위치가 아니다) — 기기·손 크기마다
       엄지가 닿는 자리가 달라서, 고정하면 누군가는 늘 불편하다. -->
  <!-- 조이스틱: **구역**이 터치를 받고, 원은 누른 자리에 그려진다 (`G-EDIT14`) -->
  <div id="w8-stick-zone" aria-hidden="true"><div id="w8-stick" data-on="0"><div id="w8-stick-knob"></div></div></div>

  <!-- 성능 HUD. 모바일에는 콘솔이 없어 화면 표시 + 복사가 실기기 수치를 받는 유일한 경로다. -->
  <!-- 기본 접힘(감독 지시 2026-07-30 "캡쳐하면 지도, HUD때문에 안보일테니깐"). `attachMapDrawer`
       의 startOpen=false 와 **같은 값이어야 한다** — 어긋나면 첫 페인트에 지도가 번쩍인다. -->
  <div id="w8-mapwrap" data-open="0">
    <div class="sheet"><canvas id="w8-map" width="192" height="192" aria-hidden="true"></canvas></div>
    <button id="w8-map-tab" type="button" aria-expanded="false" aria-controls="w8-map" aria-label="지도 펼치기">›</button>
  </div>

  <div id="w8-hud" data-open="0">
    <button id="w8-hud-toggle" type="button" aria-label="성능 정보 열기/닫기">📊</button>
    <div id="w8-hud-panel">
      <pre id="w8-hud-body">측정 중…</pre>
      <!-- 📍 는 **증상을 본 순간**을 시간축에 못 박는다. 리포트가 그 앞뒤 ±2.5초의
           이벤트만 뽑아 주므로, 감독의 지각과 내부 전이가 같은 축에 올라온다.
           근거·형식은 world2/decide/telemetry.ts 의 「이벤트 로그」 절 한 곳이다. -->
      <button id="w8-hud-mark" type="button" aria-label="지금 증상을 봤다고 표시">📍</button>
      <button id="w8-hud-copy" type="button">복사</button>
    </div>
  </div>

  <!-- 진입 — 누구의 땅을 보고 있는가 + 다른 작가로 가는 문 (W8-3 S6).
       감독 카드 2026-08-16 「진입은 **둘 다**」: 주소(`?u=`)에 있으면 그것, 없으면 여기서 고른다.
       **기본은 감춤이다** — 대장에 작가가 0명이고 사유도 없으면 안 뜬다(지금 라이브가 그 상태).
       판정은 world2/decide/tenant-entry.ts, 배선은 world2/ui/tenant-bar.ts(인라인 금지). -->
  <div id="w8-tenant" data-show="0" hidden>
    <div class="row">
      <span id="w8-tenant-title">마을 전체</span>
      <button id="w8-tenant-reset" type="button" hidden>마을 전체로</button>
    </div>
    <p id="w8-tenant-notice" hidden></p>
    <div class="row">
      <select id="w8-tenant-list" aria-label="작가 고르기"></select>
      <input id="w8-tenant-input" type="text" inputmode="latin" autocomplete="off"
             spellcheck="false" placeholder="작가 아이디" aria-label="작가 아이디로 이동">
      <button id="w8-tenant-go" type="button">이동</button>
    </div>
  </div>

  <!-- 神 모드 하늘 패널 — 시간대·날씨·이벤트. 로직은 world2/ui/sky-panel.ts(인라인 금지). -->
  <div id="w8-god" data-open="0">
    <button id="w8-god-toggle" type="button" aria-expanded="false" aria-controls="w8-god-body">
      <span aria-hidden="true">☀</span><span class="cap">하늘</span><span class="caret" aria-hidden="true">▾</span>
    </button>
    <div id="w8-god-body" hidden>
      <div class="w8-god-row" data-group="time">
        <span class="w8-god-cap">시간</span>
        <button type="button" data-time="day">주간</button>
        <button type="button" data-time="sunset">일몰</button>
        <button type="button" data-time="night">야간</button>
        <!-- 복합씬 — 감독 2026-08-21 *"주간 + 야간 섞고 싶어"*. 낮 밝기 · 켜진 등 ·
             진한 하늘 · 별.
             ⚠ 이 자리에 *"`?time=daylit` 과 같은 문"* 이라고 적었다가 **반증됐다**
             (검수관 B1′): 하늘 농도가 `SkySystem` 생성 옵션이라 세션당 1회만 평가돼
             버튼 경로에서는 낮 농도로 남아 있었다. 그 옵션을 함수로 바꿔 매 페인트마다
             묻게 한 뒤에야 두 문이 같아졌고, 그것을 `tests/world2-daylit.test.ts` 의
             GS-D6 이 돔 페인트 결과로 검사한다. -->
        <button type="button" data-time="daylit">복합</button>
        <button type="button" data-auto="1">자동</button>
      </div>
      <div class="w8-god-row" data-group="weather">
        <span class="w8-god-cap">날씨</span>
        <button type="button" data-weather="clear">맑음</button>
        <button type="button" data-weather="overcast">먹구름</button>
        <button type="button" data-weather="rain">비</button>
        <button type="button" data-weather="snow">눈</button>
      </div>
      <div class="w8-god-row" data-group="fx">
        <span class="w8-god-cap">이벤트</span>
        <button type="button" data-fx="rainbow">무지개</button>
        <button type="button" data-fx="aurora">오로라</button>
        <button type="button" data-bolt="1">번개⚡</button>
      </div>
      <div class="w8-god-row" data-group="safe">
        <span class="w8-god-cap">접근성</span>
        <button type="button" data-flash="1">광과민성 보호</button>
      </div>
      <!-- 세계를 GLB 파일로 굽는다. 로직은 world2/ui/export-panel.ts(인라인 금지).
           굽는 동안 화면이 멈추므로 버튼 글자가 곧 진행 표시다 — 그 이유는 그 파일에. -->
      <div class="w8-god-row" data-group="export">
        <span class="w8-god-cap">내보내기</span>
        <button id="w8-export-glb" type="button">GLB 내보내기</button>
        <button id="w8-import-glb" type="button">편집본 불러오기</button>
        <!-- 파일 입력은 감춘다 — 기본 위젯이 패널 폭을 밀어내고, 눌러야 할 것이
             버튼인지 입력칸인지 두 개가 되면 헷갈린다. 버튼이 이것을 대신 연다. -->
        <input id="w8-import-glb-file" type="file" accept=".glb,model/gltf-binary" hidden>
        <!-- 되읽기 성공 시에만 채워진다(팀장 조건 5). 「원장은 보존됩니다」를 함께 적는
             것이 요점 — 안 적으면 감독이 마을 편집을 잃었다고 읽는다. -->
        <span id="w8-import-note" class="w8-god-note" hidden></span>
      </div>
    </div>
  </div>

  <!-- 개발자 옵션 바 — 감독이 값을 직접 고르는 도구. 로직은 world2/ui/knob-bar.ts.
       행(슬라이더·버튼)은 **JS 가 만든다** — 노브 정의(키·범위·라벨)를 여기에 적으면 그것이
       곧 값 미러링이고, 이 저장소가 색·수치·임계값에서 세 번 데인 형태다. 정의는 소비처
       한 곳(`features/ocean.ts`·`main.ts` 의 그림자 절)에 있고 이 컨테이너는 자리만 잡는다.

       ⚠ 라벨이 오래 `🌊 수면` 이었다 — 소비자가 수면 하나뿐이던 때의 이름이다. 2026-08-11
       에 그림자 노브 5개와 [그림자 굽기] 버튼이 **같은 바에 누적**되면서 거짓이 됐고,
       감독께 링크를 드릴 때 *"수면 버튼을 누르면 그림자 옵션이 있다"* 를 말로 덧붙여야
       했다. 바는 소비자가 늘어나는 구조인데(`attachKnobBar` 는 여러 번 불린다) 라벨만
       첫 소비자에 묶여 있던 것이다 — 그래서 **중립 라벨**로 바꾼다. 다음 소비자가 붙을 때
       또 어긋나지 않는다. -->
  <div id="w8-sliders" data-open="0" data-dirty="0" hidden>
    <button id="w8-sliders-toggle" type="button" aria-expanded="false" aria-controls="w8-sliders-body">
      <span aria-hidden="true">⚙</span><span class="cap">개발자 옵션</span>
      <span class="dirty-dot" aria-hidden="true"></span>
      <span class="caret" aria-hidden="true">▾</span>
    </button>
    <div id="w8-sliders-body" hidden></div>
  </div>


<script type="module" src="./js/world8-boot.js"></script>
</body>
</html>
