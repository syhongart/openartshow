<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<!--
  world3 — 오픈월드 재작성(커널 아키텍처) 검증 페이지.

  behind-flag: 어디에도 링크하지 않는다. 라이브 미술관(world.html)과 완전히 분리돼 있고,
  이 페이지의 존재가 채택을 뜻하지 않는다. 라이브 노출은 감독·팀장 게이트를 거친다.
-->
<!-- connect-src 에 blob: 이 필요하다: GLTFLoader 가 VRM 내장 텍스처를 디코드할 때
     ImageBitmapLoader 가 버퍼뷰를 Blob→objectURL 로 만들고 fetch() 로 읽는다.
     'self' 만으로는 이 blob: fetch 가 막혀 텍스처 전체가 로드 실패한다
     (lab-glb.html 이 헤드리스 검증으로 발견한 것을 그대로 계승). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob:; object-src 'none'; base-uri 'none'">
<title>포근마을 (실험) · OpenArtShow</title>
<style>
  :root{
    --bg:#0B0D12; --ink:#F5F5F2; --dim:#9A9EB1; --line:#3A3D4B;
    --violet:#8B72FF; --cyan:#72E6E1;

    /* ── 포근마을 로딩 팔레트 (2026-08-08) ────────────────────────────────
       **HUD 변수(`--ink`·`--dim`)를 바꾸지 않고 따로 둔다.** 저것들은 어두운
       반투명 패널 위에 얹히는 글자색이라, 밝게 바꾸면 로딩은 예뻐지고 HUD 는
       읽을 수 없게 된다 — 한 변수가 두 배경 위에서 쓰이고 있었다.

       로딩만 밝히는 이유: 여기가 **첫인상**이다. 마을에 들어가는데 검은 화면에서
       시작하면 3D 가 뜨는 순간 톤이 튄다. 로딩 배경을 하늘색으로 두면 화면이
       그대로 하늘로 이어진다. */
    --v-sky:#cfeaff; --v-sky2:#a9d8f5;
    --v-ink:#3d4a3a; --v-dim:#6f7f68;
    --v-grass:#86cf63; --v-water:#7fd0e0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
  body{font-family:'Pretendard','NanumGothic',system-ui,sans-serif}
  #w3-canvas{display:block;width:100vw;height:100vh;touch-action:none}

  /* ── 물속 (감독 지시 2026-07-31 "강에 사람이 빠지게해줘") ──────────────────
     카메라를 수면 아래로 내리는 것만으로는 **물속으로 안 읽힌다.** 물 판이
     FrontSide 라 아래에서는 안 보이고, 위를 올려다보면 하늘이 그대로 있어서
     물에 잠긴 게 아니라 땅에 파묻힌 것처럼 보인다.

     scene.fog 를 물빛으로 바꾸는 길은 버렸다 — 하늘 시스템이 매 프레임 안개색을
     시간대에 맞춰 덮어써서 둘이 싸우고, WebGL/WebGPU 렌더 경로 차이도 탄다.
     화면 오버레이는 두 백엔드에서 똑같이 동작한다(이 저장소의 백엔드 사각을
     피하는 정석 수단이다).

     **색은 여기가 SSOT 이고 세기는 `decide/swim.ts` 가 SSOT 다.** JS 는 opacity
     하나만 만진다 — 색을 JS 로 넘기면 같은 물빛이 두 곳에 살게 된다.

     z-index 5 — 캔버스(기본 0) 위, UI(6~10) 아래. 물에 빠졌다고 지도·HUD 가
     물빛에 잠기면 나갈 길을 못 찾는다.

     가장자리를 더 짙게 해 시야가 좁아진 느낌을 준다. 단색 한 장이면 화면에
     색유리를 댄 것처럼 보이지 물에 잠긴 것으로는 안 보인다.

     transition 을 걸지 않는다 — 잠김 보간은 `stepSubmersion` 이 시간으로 이미
     하고 있다. 여기에 또 걸면 두 보간이 겹쳐 물 밖에 나온 뒤에도 색이 남는다. */
  #w3-underwater{
    position:fixed;inset:0;z-index:5;pointer-events:none;opacity:0;
    /* 포근마을: 짙은 심해(#0d4256→#05202e) → **얕고 맑은 물.** 마을 개울은 바닥이
       보이는 깊이라, 어두운 심해색이면 발목까지 왔는데 심연에 빠진 것으로 읽힌다.
       가장자리를 짙게 두는 구조는 그대로다(시야가 좁아진 느낌). */
    background:radial-gradient(120% 100% at 50% 45%, #6fc6d8 0%, #2b7f96 100%);
  }

  /* ── 로딩 화면 ─────────────────────────────────────────────────────────
     바 보간을 CSS transition에 맡긴다. 로딩 중에는 메인 스레드가 가장 바쁘므로
     JS로 애니메이션을 돌리면 그 애니메이션부터 끊기고, 끊기는 진행바는
     "멈춤"의 신호로 읽혀 없느니만 못하다. */
  /* 바를 화면 정중앙에 **고정**하고 나머지는 그 위아래에 절대 배치한다.
     3초 뒤 라벨·문구가 나타날 때 바가 밀려나면, 조용히 지나가다 풍성해지는 게 아니라
     화면이 튀는 걸로 읽힌다. 자리를 옮기지 않고 겹쳐 띄우는 이유다. */
  #w3-loading{
    position:fixed;inset:0;z-index:10;
    display:grid;place-items:center;
    /* 밝은 하늘 → 아래로 갈수록 옅은 잔디빛. 3D 가 뜨는 순간과 톤이 이어진다. */
    background:linear-gradient(180deg, var(--v-sky) 0%, var(--v-sky2) 52%, #e8f5dc 100%);
    transition:opacity .45s ease;
  }
  /* 밝은 바탕 위에서는 글자가 어두워야 한다. 로딩 안쪽에서만 뒤집는다 —
     같은 변수를 전역에서 뒤집으면 HUD 가 함께 죽는다(위 `:root` 주석). */
  #w3-loading{color:var(--v-ink)}
  #w3-loading #w3-loading-label{color:var(--v-ink)}
  #w3-loading #w3-loading-pct,
  #w3-loading #w3-loading-copy,
  #w3-loading #w3-loading-note{color:var(--v-dim)}
  #w3-loading[data-state="done"]{opacity:0;pointer-events:none}
  #w3-loading-center{position:relative;display:grid;place-items:center;gap:10px}

  /* 부가 요소는 3초를 넘겨야(data-detail="rich") 나타난다 — 감독 지시.
     레이아웃에서 빠지지 않고 자리만 유지한 채 투명해진다(절대 배치라 바를 안 민다). */
  #w3-loading-label,#w3-loading-copy,#w3-loading-pct{
    position:absolute;left:50%;transform:translateX(-50%);
    margin:0;white-space:nowrap;
    opacity:0;transition:opacity .5s ease;
  }
  #w3-loading-label{bottom:calc(100% + 20px);font-size:15px;letter-spacing:.02em;color:var(--ink)}
  #w3-loading-pct{top:calc(100% + 14px);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  #w3-loading-copy{top:calc(100% + 40px);font-size:13.5px;line-height:1.5;color:var(--dim)}

  /* 퍼센트는 바의 수치 표현이므로 minimal에서도 보인다. "프로그레스 바만"의 일부다. */
  #w3-loading-pct{opacity:1}
  #w3-loading[data-detail="rich"] #w3-loading-label{opacity:1}
  /* 실패는 밀도와 무관하게 보여야 한다. 3초 전에 부팅이 깨지면 minimal이라 라벨이
     숨겨진 채 남고, 사용자는 멈춘 진행바만 보게 된다 — 오류를 감추는 최악의 상태다. */
  #w3-loading[data-state="error"] #w3-loading-label{opacity:1}

  /* 밝은 바탕이라 트랙을 **어둡게** 뒤집었다. 흰 반투명(rgba(255,255,255,.12))은
     하늘색 위에서 사실상 안 보여, 바가 어디까지 왔는지 읽히지 않는다.
     두께도 2px → 4px — 밝은 배경에서는 얇은 선의 대비가 그만큼 약해진다. */
  #w3-loading-track{
    width:min(320px,62vw);height:4px;border-radius:4px;
    background:rgba(61,74,58,.14);overflow:hidden;
  }
  #w3-loading-bar{
    width:0%;height:100%;border-radius:4px;
    background:linear-gradient(90deg,var(--v-grass),var(--v-water));
    transition:width .35s cubic-bezier(.22,.61,.36,1);
  }
  /* 문구 교체는 JS가 텍스트만 갈고 페이드는 여기서 한다 — 로딩 중에는 메인 스레드가
     가장 바쁘므로 JS 애니메이션을 돌리면 그 애니메이션부터 끊긴다.
     rich 진입 + data-show 둘 다여야 보인다(3초 게이트와 교체 페이드가 각자 산다). */
  #w3-loading[data-detail="rich"] #w3-loading-copy[data-show="1"]{opacity:1}
  #w3-loading-note{
    position:absolute;top:calc(100% + 68px);left:50%;transform:translateX(-50%);
    margin:0;width:max-content;max-width:min(420px,80vw);white-space:normal;
    text-align:center;font-size:12.5px;line-height:1.6;color:var(--dim);
  }
  #w3-loading[data-state="error"] #w3-loading-bar{background:#FF705E}
  #w3-loading[data-state="error"] #w3-loading-note{color:#FFB4A8}

  /* 모션을 줄이고 싶다는 뜻은 존중한다 — 전환을 없애도 정보 전달은 그대로다. */
  @media (prefers-reduced-motion: reduce){
    #w3-loading,#w3-loading-bar,#w3-loading-copy{transition:none}
    #w3-loading-copy{transform:none}
  }


  /* ── 가상 조이스틱 ─────────────────────────────────────────────────────
     pointer-events:none 이 핵심 — 터치는 캔버스가 받고 여기는 그림만 그린다.
     조이스틱이 이벤트를 가로채면 손가락이 조이스틱 밖으로 나가는 순간 추적이 끊긴다. */
  #w3-stick{
    position:fixed;z-index:6;width:112px;height:112px;margin:-56px 0 0 -56px;
    border-radius:50%;pointer-events:none;
    border:1px solid rgba(255,255,255,.16);
    background:radial-gradient(circle, rgba(255,255,255,.07) 0%, rgba(255,255,255,.02) 70%);
    opacity:0;transition:opacity .18s ease;
  }
  #w3-stick[data-on="1"]{opacity:1}
  #w3-stick-knob{
    position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;
    transform:translate(-50%,-50%);
    background:linear-gradient(145deg, rgba(139,114,255,.85), rgba(114,230,225,.75));
    box-shadow:0 2px 12px rgba(0,0,0,.35);
  }
  @media (prefers-reduced-motion: reduce){ #w3-stick{transition:none} }

  /* ── 성능 HUD ──────────────────────────────────────────────────────────
     기본은 아이콘 하나만. 펼쳐야 수치가 나온다 — 평소에 화면을 가리면
     "걸을 때 끊기는가"를 보는 데 방해가 된다. */
  #w3-hud{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:8;
    display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  #w3-hud-toggle{
    width:38px;height:38px;border-radius:10px;cursor:pointer;
    background:rgba(11,13,18,.62);border:1px solid var(--line);color:var(--ink);
    font-size:16px;line-height:1;padding:0;
  }
  #w3-hud-panel{display:none;background:rgba(11,13,18,.86);border:1px solid var(--line);
    border-radius:10px;padding:9px 10px;min-width:min(230px,64vw)}
  #w3-hud[data-open="1"] #w3-hud-panel{display:block}
  #w3-hud-body{
    margin:0 0 8px;white-space:pre-wrap;word-break:break-all;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11px;line-height:1.55;color:var(--ink);
  }
  #w3-hud-copy{
    width:100%;padding:7px 10px;border-radius:8px;cursor:pointer;
    background:rgba(139,114,255,.18);border:1px solid rgba(139,114,255,.5);
    color:var(--ink);font-size:12px;font-family:inherit;
  }

  /* ── 神 모드 하늘 패널 ──────────────────────────────────────────────────
     HUD 아래에 붙인다. 하늘을 바꾸면서 바로 위 수치를 보는 것이 이 패널의
     목적이므로 둘이 같은 시야 안에 있어야 한다. 기본 접힘. */
  /* ── 미니맵 = 왼쪽 책갈피 (감독 지시) ────────────────────────────────────
     "지도에 왼쪽 책갈피로 펼치고 접게 해."

     접을 때 `display:none` 을 쓰지 않는다 — 캔버스가 레이아웃에서 빠지면 크기가 0이
     되고, 다시 펼칠 때 한 프레임 동안 빈 지도가 보인다. `transform` 은 레이아웃을
     안 건드리고 화면 밖으로 밀어내기만 한다. */
  #w3-mapwrap{
    position:fixed;left:0;bottom:calc(120px + env(safe-area-inset-bottom));z-index:8;
    display:flex;align-items:flex-end;
    transition:transform .24s cubic-bezier(.4,0,.2,1);
    pointer-events:none;
  }
  #w3-mapwrap[data-open="0"]{
    /* 지도 폭만큼 왼쪽으로 밀되 **탭은 남긴다** */
    transform:translateX(calc(-100% + 26px));
  }
  #w3-mapwrap .sheet{
    padding:5px;border-radius:0 10px 10px 0;background:rgba(11,13,18,.78);
    border:1px solid var(--line);border-left:none;line-height:0;
  }
  #w3-map{display:block;width:104px;height:104px;border-radius:6px}
  /* 책갈피 — 지도 오른쪽에 붙어 함께 미끄러진다 */
  #w3-map-tab{
    pointer-events:auto;cursor:pointer;
    width:22px;height:52px;margin-bottom:6px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(11,13,18,.86);border:1px solid var(--line);border-left:none;
    border-radius:0 8px 8px 0;color:var(--dim);
    font-size:15px;font-family:inherit;line-height:1;padding:0;
  }
  #w3-map-tab:hover{color:var(--ink)}
  @media (min-width:760px){
    #w3-mapwrap{bottom:16px}
    #w3-map{width:132px;height:132px}
  }

  /* 왼쪽 고정 (감독 지시). 예전엔 `right:56px` 이라 닫힌 상태에서 오른쪽에 있다가,
     열면 패널이 왼쪽으로 펼쳐지며 **버튼까지 따라 움직이는** 것처럼 보였다.
     처음부터 왼쪽에 두면 열고 닫아도 버튼이 제자리에 있다. */
  #w3-god{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:9;
    max-width:min(300px,72vw)}
  #w3-god-toggle{
    display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:10px;cursor:pointer;
    background:rgba(11,13,18,.62);border:1px solid var(--line);color:var(--ink);
    font-size:12px;font-family:inherit;line-height:1;
  }
  #w3-god-toggle .cap{opacity:.85}
  #w3-god-toggle .caret{margin-left:2px;font-size:9px;color:var(--dim);transition:transform .2s}
  #w3-god[data-open="1"] #w3-god-toggle .caret{transform:rotate(180deg)}
  #w3-god-body{
    margin-top:6px;background:rgba(11,13,18,.88);border:1px solid var(--line);
    border-radius:10px;padding:10px 11px;display:flex;flex-direction:column;gap:8px;
  }
  #w3-god-body[hidden]{display:none}
  .w3-god-row{display:flex;align-items:center;flex-wrap:wrap;gap:5px}
  .w3-god-cap{font-size:10.5px;color:var(--dim);width:38px;flex:none}
  .w3-god-row button{
    font-family:inherit;font-size:11.5px;padding:6px 9px;border-radius:8px;cursor:pointer;
    background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--dim);
  }
  .w3-god-row button.on{
    background:rgba(139,114,255,.28);border-color:rgba(139,114,255,.7);
    color:var(--ink);font-weight:600;
  }
  .w3-god-row[data-group="fx"] button.on{
    background:rgba(114,230,225,.24);border-color:rgba(114,230,225,.6);
  }
  /* 번개는 토글이 아니라 1회 발동이다. 비가 아니면 엔진이 무시하므로,
     반려됐을 때 잠깐 흐려져 "눌렀는데 왜 안 되지"를 남기지 않는다. */
  .w3-god-row button[data-bolt]{background:rgba(255,233,196,.14);border-color:rgba(255,233,196,.4)}
  .w3-god-row button[data-bolt].off{opacity:.35}
  @media (prefers-reduced-motion: reduce){ #w3-god-toggle .caret{transition:none} }

  /* ── 수면 파라미터 슬라이더 바 (감독 지시 2026-07-31 "유아이 바를 만들어봐") ────
     위치: 화면 우하단. #w3-god(좌상)·#w3-hud(우상)·#w3-mapwrap(좌하)이 이미 세 모서리를
     차지해 남은 자리가 여기뿐이다. #w3-god과 대각선이라 항상 분리되고, 캔버스 중앙
     (수면이 실제로 보이는 영역)을 가리지 않는다 — **미는 동안 물을 봐야 한다**가
     이 도구의 전부라서 모서리 배치가 요건이다.

     기본 접힘 — 기존 세 패널 전부와 같은 관례. 값은 접혀 있어도 계속 적용되므로
     상시 펼 필요가 없다.

     열면 위로 펼쳐진다(column-reverse). 아래엔 화면 끝/홈 인디케이터뿐이라 내려갈
     자리가 없다. 토글이 하단에 고정되고 그 위로 행이 쌓인다. */
  #w3-sliders{
    position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:8;
    display:flex;flex-direction:column-reverse;align-items:flex-end;gap:6px;
  }
  #w3-sliders-toggle{
    display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:10px;cursor:pointer;
    background:rgba(11,13,18,.62);border:1px solid var(--line);color:var(--ink);
    font-size:12px;font-family:inherit;line-height:1;
    transition:border-color .15s ease;
  }
  #w3-sliders-toggle .cap{opacity:.85}
  #w3-sliders-toggle .caret{margin-left:2px;font-size:9px;color:var(--dim);transition:transform .2s}
  #w3-sliders[data-open="1"] #w3-sliders-toggle .caret{transform:rotate(180deg)}

  /* 하나라도 지정값이면 토글에도 신호를 남긴다 — 접힌 채로는 행 안의 점이 안 보이므로,
     패널을 안 열어도 "지금 기본값이 아니다"를 알아야 지정값인 채로 세션을 끝내지 않는다. */
  #w3-sliders-toggle .dirty-dot{
    display:none;width:6px;height:6px;border-radius:50%;
    background:var(--cyan);box-shadow:0 0 4px var(--cyan);
  }
  #w3-sliders[data-dirty="1"] #w3-sliders-toggle .dirty-dot{display:inline-block}
  #w3-sliders[data-dirty="1"] #w3-sliders-toggle{border-color:rgba(139,114,255,.55)}

  #w3-sliders-body{
    width:min(260px,80vw);
    background:rgba(11,13,18,.88);border:1px solid var(--line);border-radius:10px;
    padding:10px 11px;display:flex;flex-direction:column;gap:10px;
  }
  #w3-sliders-body[hidden]{display:none}

  .w3-slide-row{display:flex;align-items:center;gap:6px}
  /* .w3-god-cap 폭 38px 을 그대로 재사용 — 좌측 패널과 라벨 정렬 리듬을 맞춘다 */
  .w3-slide-cap{
    font-size:10.5px;color:var(--dim);width:38px;flex:none;
    display:flex;align-items:center;gap:4px;line-height:1.3;
  }
  /* 지정값 점 — 색이 아니라 "있다/없다"를 1차 신호로 쓴다(색만으로 구분하지 않는다) */
  .w3-slide-pin{
    display:block;width:5px;height:5px;border-radius:50%;flex:none;
    background:var(--violet);opacity:0;transition:opacity .15s ease;
  }
  .w3-slide-row[data-overridden="1"] .w3-slide-pin{opacity:1}

  /* 트랙은 얇게(4px), 히트박스는 요소 높이(32px) 전체로 — 시각과 판정 영역을 분리한다.
     touch-action:none 은 #w3-canvas 와 같은 이유: 드래그 중 브라우저 제스처가 끼어들지
     않게 한다. */
  .w3-slide-input{
    -webkit-appearance:none;appearance:none;flex:1 1 auto;min-width:70px;
    height:32px;margin:0;background:transparent;touch-action:none;cursor:pointer;
  }
  .w3-slide-input::-webkit-slider-runnable-track{
    height:4px;border-radius:2px;background:rgba(255,255,255,.14);
  }
  .w3-slide-input::-webkit-slider-thumb{
    -webkit-appearance:none;width:20px;height:20px;border-radius:50%;margin-top:-8px;
    background:linear-gradient(145deg, rgba(139,114,255,.9), rgba(114,230,225,.8));
    border:1px solid rgba(255,255,255,.35);box-shadow:0 1px 5px rgba(0,0,0,.4);
  }
  .w3-slide-input::-moz-range-track{
    height:4px;border-radius:2px;background:rgba(255,255,255,.14);
  }
  .w3-slide-input::-moz-range-thumb{
    width:20px;height:20px;border-radius:50%;border:1px solid rgba(255,255,255,.35);
    background:linear-gradient(145deg, rgba(139,114,255,.9), rgba(114,230,225,.8));
    box-shadow:0 1px 5px rgba(0,0,0,.4);
  }
  .w3-slide-row[data-overridden="1"] .w3-slide-input::-webkit-slider-runnable-track{
    background:rgba(139,114,255,.28);
  }
  .w3-slide-row[data-overridden="1"] .w3-slide-input::-moz-range-track{
    background:rgba(139,114,255,.28);
  }

  .w3-slide-val{
    font-size:11px;color:var(--dim);width:36px;flex:none;text-align:right;
    font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .w3-slide-row[data-overridden="1"] .w3-slide-val{color:var(--ink);font-weight:600}

  .w3-slide-reset{
    width:26px;height:26px;flex:none;border-radius:8px;cursor:pointer;padding:0;
    background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--dim);
    font-size:13px;line-height:1;font-family:inherit;opacity:.4;
    transition:opacity .15s ease,color .15s ease,border-color .15s ease,background .15s ease;
  }
  .w3-slide-row[data-overridden="1"] .w3-slide-reset{
    opacity:1;color:var(--ink);border-color:rgba(139,114,255,.6);
    background:rgba(139,114,255,.16);
  }

  /* #w3-mapwrap 과 같은 브레이크포인트(760px)를 재사용해 넓은 화면에서 트랙에 여유를 준다 */
  @media (min-width:760px){
    #w3-sliders-body{width:280px}
    .w3-slide-input{min-width:120px}
  }
  @media (prefers-reduced-motion: reduce){
    #w3-sliders-toggle .caret,#w3-sliders-toggle,.w3-slide-pin,.w3-slide-reset{transition:none}
  }

  /* ── 배경음 토글 ────────────────────────────────────────────────────────
     자리: 우상단 성능 HUD(#w3-hud)의 **왼쪽**. 네 모서리는 이미 임자가 있다 —
     좌상 #w3-god, 우상 #w3-hud, 좌하 #w3-mapwrap, 우하 #w3-sliders. 다섯 번째
     것을 새 모서리에 두면 화면이 사방으로 둘러싸이므로, 이미 있는 것에 붙인다.
     44px 은 터치 대상 최소 크기다(감독은 모바일에서 보신다). */
  #w3-bgm{
    position:fixed;z-index:8;
    top:calc(10px + env(safe-area-inset-top));right:62px;
    width:44px;height:44px;border-radius:12px;
    background:rgba(11,13,18,.62);border:1px solid var(--line);color:var(--dim);
    font-size:17px;line-height:1;cursor:pointer;
    transition:color .2s,background .2s,border-color .2s;
  }
  /* 켜진 상태를 **색으로** 알린다. 아이콘만 바꾸면(♪/♪̸) 작은 화면에서 구별이 안 된다. */
  #w3-bgm[data-on="1"]{
    background:rgba(134,207,99,.22);border-color:rgba(134,207,99,.6);color:#dff5cf;
  }
  @media (prefers-reduced-motion: reduce){ #w3-bgm{transition:none} }
</style>

<body>
  <canvas id="w3-canvas"></canvas>

  <!-- 물속 틴트. `aria-hidden` — 화면에만 있는 연출이라 읽어 줄 내용이 없다 -->
  <div id="w3-underwater" aria-hidden="true"></div>

  <div id="w3-loading" data-detail="minimal">
    <div id="w3-loading-center">
      <p id="w3-loading-label">준비 중</p>
      <div id="w3-loading-track"><div id="w3-loading-bar"></div></div>
      <span id="w3-loading-pct">0%</span>
      <p id="w3-loading-copy" data-show="0"></p>
      <p id="w3-loading-note" hidden></p>
    </div>
  </div>

  <!-- 가상 조이스틱. 누른 자리에 나타난다(고정 위치가 아니다) — 기기·손 크기마다
       엄지가 닿는 자리가 달라서, 고정하면 누군가는 늘 불편하다. -->
  <div id="w3-stick" data-on="0"><div id="w3-stick-knob"></div></div>

  <!-- 성능 HUD. 모바일에는 콘솔이 없어 화면 표시 + 복사가 실기기 수치를 받는 유일한 경로다. -->
  <!-- 기본 접힘(감독 지시 2026-07-30 "캡쳐하면 지도, HUD때문에 안보일테니깐"). `attachMapDrawer`
       의 startOpen=false 와 **같은 값이어야 한다** — 어긋나면 첫 페인트에 지도가 번쩍인다. -->
  <div id="w3-mapwrap" data-open="0">
    <div class="sheet"><canvas id="w3-map" width="192" height="192" aria-hidden="true"></canvas></div>
    <button id="w3-map-tab" type="button" aria-expanded="false" aria-controls="w3-map" aria-label="지도 펼치기">›</button>
  </div>

  <!-- 배경음 토글. 로직은 world3/audio/village-bgm.ts(인라인 금지 — CSP script-src 'self').
       **기본은 꺼짐이다.** 자동재생은 브라우저가 막을 뿐 아니라, 소리가 갑자기 나는
       페이지는 그 자체로 나쁜 첫인상이다. 켜는 것은 사용자가 정한다. -->
  <button id="w3-bgm" type="button" data-on="0"
          aria-label="배경음 켜기/끄기" aria-pressed="false">♪</button>

  <div id="w3-hud" data-open="0">
    <button id="w3-hud-toggle" type="button" aria-label="성능 정보 열기/닫기">📊</button>

      <button id="w3-hud-copy" type="button">복사</button>
    </div>
  </div>

  <!-- 神 모드 하늘 패널 — 시간대·날씨·이벤트. 로직은 world3/ui/sky-panel.ts(인라인 금지). -->
  <div id="w3-god" data-open="0">
    <button id="w3-god-toggle" type="button" aria-expanded="false" aria-controls="w3-god-body">
      <span aria-hidden="true">☀</span><span class="cap">하늘</span><span class="caret" aria-hidden="true">▾</span>
    </button>
    <div id="w3-god-body" hidden>
      <div class="w3-god-row" data-group="time">
        <span class="w3-god-cap">시간</span>
        <button type="button" data-time="day">주간</button>
        <button type="button" data-time="sunset">일몰</button>
        <button type="button" data-time="night">야간</button>
        <button type="button" data-auto="1">자동</button>
      </div>
      <div class="w3-god-row" data-group="weather">
        <span class="w3-god-cap">날씨</span>
        <button type="button" data-weather="clear">맑음</button>
        <button type="button" data-weather="overcast">먹구름</button>
        <button type="button" data-weather="rain">비</button>
        <button type="button" data-weather="snow">눈</button>
      </div>
      <div class="w3-god-row" data-group="fx">
        <span class="w3-god-cap">이벤트</span>
        <button type="button" data-fx="rainbow">무지개</button>
        <button type="button" data-fx="aurora">오로라</button>
        <button type="button" data-bolt="1">번개⚡</button>
      </div>
      <div class="w3-god-row" data-group="safe">
        <span class="w3-god-cap">접근성</span>
        <button type="button" data-flash="1">광과민성 보호</button>
      </div>
    </div>
  </div>

  <!-- 수면 파라미터 바 — 감독이 값을 직접 고르는 도구. 로직은 world3/ui/knob-bar.ts.
       행(슬라이더)은 **JS 가 만든다** — 노브 정의(키·범위·라벨)를 여기에 적으면 그것이
       곧 값 미러링이고, 이 저장소가 색·수치·임계값에서 세 번 데인 형태다. 정의는
       `features/ocean.ts` 한 곳에 있고 이 컨테이너는 그것이 담길 자리만 잡는다. -->
  <div id="w3-sliders" data-open="0" data-dirty="0" hidden>
    <button id="w3-sliders-toggle" type="button" aria-expanded="false" aria-controls="w3-sliders-body">
      <span aria-hidden="true">🌊</span><span class="cap">수면</span>
      <span class="dirty-dot" aria-hidden="true"></span>
      <span class="caret" aria-hidden="true">▾</span>
    </button>
    <div id="w3-sliders-body" hidden></div>
  </div>
