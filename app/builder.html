<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- 유튜브 임베드는 nocookie 단일 호스트만 프레임 허용(보안담당 실사). 그 외 프레임 차단. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'none'">
<title>공간 빌더 · OpenArtShow</title>
<link rel="stylesheet" href="./vendor/fonts/fonts.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<style>
  :root{ --bg:#15161A; --panel:#1c1d23; --panel2:#23242c; --line:#31323c; --ink:#e7e5ee; --dim:#9b99a8;
    --violet:#8b7bd8; --cyan:#6fe3ff; --coral:#ff7a66; --app:var(--app-font, system-ui,sans-serif); }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--app);overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  /* 상단 바 */
  .topbar{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:14px;
    padding:0 18px;background:linear-gradient(#15161ae6,#15161a99);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);z-index:10}
  .brand{font-weight:700;letter-spacing:-.01em}.brand b{color:var(--violet)}
  .spacer{flex:1}
  .status{font-size:13px;color:var(--dim)}.status .cap{color:var(--cyan)}.status .cap.warn{color:var(--coral)}
  .btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
    font:inherit;font-size:13px;padding:7px 13px;border-radius:9px;cursor:pointer;transition:.12s}
  .btn:hover{border-color:var(--violet);transform:translateY(-1px)}
  .btn.cta{background:var(--violet);border-color:var(--violet);color:#fff;font-weight:600}
  /* 팔레트(우측 도킹) */
  .palette{position:fixed;top:64px;right:14px;width:250px;max-height:calc(100vh - 150px);display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;z-index:10;box-shadow:0 12px 40px #0007}
  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;appearance:none;border:0;background:transparent;color:var(--dim);font:inherit;font-size:12.5px;padding:11px 4px;cursor:pointer}
  .tabs button.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--violet)}
  .parts{padding:10px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .chip{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit;font-size:11.5px;
    padding:7px 5px 8px;border-radius:11px;cursor:pointer;text-align:center;transition:.12s;
    display:flex;flex-direction:column;align-items:center;gap:3px}
  .chip .chip-ic{width:46px;height:46px;object-fit:contain;pointer-events:none;
    background:radial-gradient(120% 100% at 50% 20%,#2b2c37 0%,#212230 100%);border-radius:8px}
  .chip:hover{border-color:var(--violet);transform:translateY(-1px)}
  .chip.on{border-color:var(--violet);background:#2b2740;color:#fff;box-shadow:0 0 0 1px var(--violet) inset}
  .hint{padding:10px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--dim);line-height:1.5}
  /* 선택 액션 도크 */
  .seldock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:none;gap:8px;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;z-index:11;box-shadow:0 10px 30px #0007}
  .seldock.on{display:flex}
  .seldock .lab{font-size:12.5px;color:var(--dim);padding:0 4px}
  .toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(10px);opacity:0;transition:.2s;
    background:#2a2230;border:1px solid var(--coral);color:#ffd9d1;font-size:13px;padding:9px 14px;border-radius:10px;z-index:20;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* 모바일: 편집 크롬 숨김(열람 전용) */
  .mobwarn{display:none}
  @media (max-width:640px){
    .palette,.seldock,.topbar .desk{display:none!important}
    .mobwarn{display:block;position:fixed;left:12px;right:12px;bottom:14px;z-index:10;
      background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--dim);text-align:center}
  }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div class="topbar">
  <div class="brand">Open<b>ArtShow</b> · 공간 빌더</div>
  <div class="spacer"></div>
  <div class="status desk">파츠 <b id="nParts">0</b> · 작품/영상 <span class="cap" id="nCap">0</span>/80</div>
  <button class="btn desk" id="bUndo">되돌리기</button>
  <button class="btn desk" id="bExport">내보내기</button>
  <button class="btn desk" id="bLoad">불러오기</button>
  <button class="btn cta desk" id="bSave">저장</button>
</div>

<aside class="palette desk">
  <div class="tabs" id="tabs"></div>
  <div class="parts" id="parts"></div>
  <div class="hint">파츠를 고르고 <b>바닥을 클릭</b>해 놓습니다. 놓은 파츠 <b>클릭</b>=선택 — <b>R</b>/<b>Shift+R</b> 회전, <b>Del</b> 삭제, <b>⌘/Ctrl+Z</b> 되돌리기.<br><b>WASD</b>/방향키=이동 · 드래그=둘러보기 · <b>Shift·우클릭</b>드래그=팬 · 휠=줌.</div>
</aside>

<div class="seldock" id="seldock">
  <span class="lab" id="selLab">선택됨</span>
  <button class="btn" id="bRot">회전 (R)</button>
  <button class="btn" id="bDel">삭제 (Del)</button>
  <span class="vidwrap" id="vidwrap" style="display:none;align-items:center;gap:6px;border-left:1px solid var(--line);padding-left:8px">
    <input id="vidUrl" type="text" inputmode="url" placeholder="유튜브 링크 붙여넣기" style="width:190px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:12.5px;padding:6px 9px;border-radius:8px">
    <button class="btn" id="bVidSet">적용</button>
    <button class="btn cta" id="bPlay">▶ 재생</button>
  </span>
</div>

<div id="playOverlay" style="display:none;position:fixed;inset:0;z-index:30;background:#0a0a0ecc;backdrop-filter:blur(4px);align-items:center;justify-content:center">
  <div style="position:relative">
    <button id="bPlayClose" class="btn" style="position:absolute;top:-44px;right:0">닫기 ✕</button>
    <div id="playMount"></div>
  </div>
</div>

<div class="mobwarn">📱 모바일에서는 <b>감상</b>만 가능합니다. 공간 편집은 데스크톱에서 하세요. (드래그=둘러보기)</div>
<div class="toast" id="toast"></div>

<script type="module">
import * as THREE from 'three';
import { createBuilder } from './js/builder.js';
import { PART_TYPES, PART_CATEGORIES } from './js/space.js';
import { createYouTubeSurface } from './js/ytembed.js';
import { buildPartPreview } from './js/space-render.js';

// 팔레트 썸네일 — 각 파츠 타입을 1회 오프스크린 렌더해 아이콘 dataURL 생성(감독: 그림으로 표시)
function renderPartIcons(size = 52) {
  const R = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  R.setSize(size, size); R.setPixelRatio(2); R.setClearColor(0x000000, 0); R.outputColorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Scene();
  s.add(new THREE.HemisphereLight(0xfff6ea, 0x2a2a30, 1.25));
  const k = new THREE.DirectionalLight(0xffffff, 1.2); k.position.set(1.4, 2.2, 1.6); s.add(k);
  const cam = new THREE.PerspectiveCamera(32, 1, 0.05, 40);
  const icons = {};
  try {
    for (const type of Object.keys(PART_TYPES)) {
      const g = buildPartPreview(type); s.add(g);
      const box = new THREE.Box3().setFromObject(g); const c = box.getCenter(new THREE.Vector3()); const sz = box.getSize(new THREE.Vector3());
      const rad = Math.max(sz.x, sz.y, sz.z, 0.3) * 1.5 + 0.35;
      cam.position.set(c.x + rad * 0.8, c.y + rad * 0.65, c.z + rad * 1.0); cam.lookAt(c);
      R.render(s, cam); icons[type] = R.domElement.toDataURL();
      s.remove(g);
      g.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) { if (o.material.map) o.material.map.dispose(); if (o.material.normalMap) o.material.normalMap.dispose(); o.material.dispose(); } });
    }
  } finally {
    R.dispose(); // 루프 중간 예외에도 오프스크린 컨텍스트 확실히 회수(검수관 권고)
  }
  return icons;
}
let PART_ICONS = {};
try { PART_ICONS = renderPartIcons(); } catch (e) { PART_ICONS = {}; }

const canvas = document.getElementById('c');
const B = createBuilder(canvas, { preserveDrawingBuffer: true });
function fit(){ B.resize(window.innerWidth, window.innerHeight); }
window.addEventListener('resize', fit); fit();

// 팔레트 구축 (배치 가능한 3카테고리)
const CAT_LABEL = { structure:'구조', exhibit:'전시', ambience:'분위기', finish:'마감' };
const placeCats = ['structure','exhibit','ambience'];
const tabsEl = document.getElementById('tabs'), partsEl = document.getElementById('parts');
let curCat = 'structure', curChip = null;
placeCats.forEach((cat,i)=>{
  const b=document.createElement('button'); b.textContent=CAT_LABEL[cat]; if(i===0)b.className='on';
  b.onclick=()=>{ [...tabsEl.children].forEach(c=>c.classList.remove('on')); b.classList.add('on'); curCat=cat; renderParts(); };
  tabsEl.appendChild(b);
});
function renderParts(){
  partsEl.innerHTML='';
  Object.entries(PART_TYPES).filter(([,s])=>s.cat===curCat).forEach(([type,spec])=>{
    const c=document.createElement('button'); c.className='chip';
    if(PART_ICONS[type]){ const im=document.createElement('img'); im.className='chip-ic'; im.src=PART_ICONS[type]; im.alt=''; c.appendChild(im); }
    const lb=document.createElement('span'); lb.textContent=spec.label; c.appendChild(lb);
    c.onclick=()=>{ [...partsEl.querySelectorAll('.chip')].forEach(x=>x.classList.remove('on')); c.classList.add('on'); curChip=c; B.beginPlace(type); };
    partsEl.appendChild(c);
  });
}
renderParts();

// 상태·이벤트 배선
const nParts=document.getElementById('nParts'), nCap=document.getElementById('nCap');
function refresh(){ const s=B.getStats(); nParts.textContent=s.parts; nCap.textContent=s.uniqueTex; nCap.classList.toggle('warn', s.uniqueTex>=72); }
B.on('change', refresh); refresh();

const seldock=document.getElementById('seldock'), selLab=document.getElementById('selLab');
const vidwrap=document.getElementById('vidwrap'), vidUrl=document.getElementById('vidUrl');
let selIndex=-1;
B.on('select', ({index,part})=>{
  selIndex=index;
  if(index>=0){ seldock.classList.add('on'); selLab.textContent=(PART_TYPES[part.t]?.label||'파츠')+' 선택됨';
    const isScreen = part.t==='screen';
    vidwrap.style.display = isScreen ? 'flex' : 'none';
    if(isScreen) vidUrl.value = B.getScreenVideo(index) || '';
  } else seldock.classList.remove('on');
});
B.on('mode', ()=>{ seldock.classList.remove('on'); vidwrap.style.display='none'; });

// 유튜브: 링크 적용(검증된 ID만 저장) + 클릭투로드 재생 오버레이
document.getElementById('bVidSet').onclick=()=>{
  const ok = B.setScreenVideo(selIndex, vidUrl.value);
  showToast(ok ? '유튜브 영상을 스크린에 연결했습니다.' : '유효한 유튜브 링크가 아닙니다.');
};
const playOverlay=document.getElementById('playOverlay'), playMount=document.getElementById('playMount');
document.getElementById('bPlay').onclick=()=>{
  const src=B.getScreenVideo(selIndex); if(!src){ showToast('먼저 유튜브 링크를 적용하세요.'); return; }
  const { el } = createYouTubeSurface(src, { width: Math.min(880, window.innerWidth-80), height: Math.min(495, (window.innerWidth-80)*9/16) });
  playMount.replaceChildren(el); playOverlay.style.display='flex';
};
function closePlay(){ playOverlay.style.display='none'; playMount.replaceChildren(); }
document.getElementById('bPlayClose').onclick=closePlay;
playOverlay.addEventListener('click', (e)=>{ if(e.target===playOverlay) closePlay(); });

const toast=document.getElementById('toast'); let toastT=0;
function showToast(msg){ toast.textContent=msg; toast.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>toast.classList.remove('show'),2600); }
B.on('cap', ({cap})=>showToast('작품·영상은 '+cap+'점까지 걸 수 있어요. (성능 상한)'));
B.on('saved', ()=>showToast('저장했습니다.'));

document.getElementById('bSave').onclick=()=>B.save();
document.getElementById('bLoad').onclick=()=>{ if(!B.load()) showToast('저장된 공간이 없습니다.'); };
document.getElementById('bUndo').onclick=()=>B.undo();
document.getElementById('bExport').onclick=()=>{
  const blob=new Blob([B.exportJSON()],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='my-space.json'; a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById('bRot').onclick=()=>B.rotateSelected(1);
document.getElementById('bDel').onclick=()=>{ B.deleteSelected(); seldock.classList.remove('on'); };

// 헤드리스 테스트 훅
window.__builder = B;
</script>
</body>
</html>
