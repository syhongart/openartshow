<!-- maximum-scale/user-scalable 을 넣지 않는다 — builder 는 3D 조작 화면이라 확대를 막지만
     마이페이지는 읽고 입력하는 문서형이라 확대를 막으면 접근성이 깎인다.
     대신 iOS 의 "입력 포커스 시 자동 확대"(= 확대되면서 가로 스크롤이 생긴다)는
     mypage.css 에서 입력 글자 크기 16px 로 막는다. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- CSP — builder.html 과 같은 형태. 다른 점 둘:
     ① frame-src 없음(유튜브 임베드가 없다. 프레임을 아예 안 쓰므로 default-src 'self' 가 덮는다)
     ② script-src 에 'unsafe-inline' 없음(인라인 실행 script 0. studio.html 과 같은 수준)
     img-src 의 data: 는 프로필 사진이 dataURL 로 저장되기 때문에 **반드시** 필요하다. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'">
<title>마이페이지 · OpenArtShow</title>
<!-- ⚠ 이 주석은 *"behind-flag: 어디에도 링크하지 않는다"* 였고 **더는 사실이 아니다**
     (검수관 P9, 2026-08-08). 이 페이지는 2026-08-08 감독 지시로 **라이브 승격**됐고
     랜딩의 프로필 메뉴가 링크한다(`scripts/lib/entrypoints.mjs` 의 `exposure: 'live'`).

     그러나 `noindex` 는 **그대로 둔다 — 이유가 바뀌었을 뿐 결론은 같다.**
     여기는 개인 프로필을 **편집하는** 화면이고 로그인한 본인에게만 의미가 있다. 검색에
     떠서 좋을 것이 없고, 공개용은 나중에 붙을 `/@별명` 쪽이다(`docs/MYPAGE-PLAN.md`).
     즉 "미완성이라 감춘다" 가 아니라 "공개 대상이 아니다" 다. -->
<meta name="robots" content="noindex, nofollow">
<style>
  /* 색: css/tokens.css 의 원시 팔레트를 이 페이지 이름에 잇는다 — 값을 여기 다시 적지 않는다.
     (2층 구조. 1층 = tokens.css 의 --oas-*, 2층 = 이 블록. builder.html·studio.html 과 같은 형태)

     ── 라이트를 고른 이유 ──────────────────────────────────────────────────
     builder 가 상시 다크인 것은 3D 캔버스 위에 뜨는 HUD 라서다(밝은 판이 화면을 가린다).
     마이페이지는 캔버스가 없고 **긴 폼 + 읽는 텍스트**라 studio 쪽 문제다. studio 가
     이미 라이트 표면 + -ink 딥변형 컨벤션으로 서 있으므로 같은 계열로 잇는다.

     ── Preview 도 라이트다 (2026-08-09 감독 판정) ──────────────────────────
     ⚠ **이 자리에는 원래 "Preview 만 다크로 반전한다" 가 적혀 있었다.** 근거는
     *"남이 보는 모습이니 편집 영역과 절대 섞이면 안 된다"* 였고, 그 판단 자체는 **감독
     지시가 아니라 우리 자체 판단**이었다(`MYPAGE-PLAN.md`·`BOARD.md`·`DEVLOG.md` 어디에도
     다크 지시 0건 — 2026-08-09 실측). 감독이 PC 화면을 보고 *"디자인이 구린데"* 라고
     지적해 후보 셋(다크를 띠로 / 다크를 버림 / 다크 유지)을 만들어 여쭈었고, *"다크는
     내가 정한 것"* 이라는 선택지를 함께 드렸으나 감독은 그것을 고르지 않고 **「다크를
     버린다」를 채택**했다. 즉 뒤집어도 되는 판단이었음이 확인됐다.

     **다음 사람에게**: 이 화면이 원래 다크였다가 누가 망친 것이 아니다. 되돌리지 마라.

     되돌린 근거는 취향이 아니라 조항이다 — `docs/DESIGN.md §3-1` 이
     *"개별 컴포넌트가 임의로 반대 모드의 배경색을 쓰지 않는다"* 이고, 같은 표가
     **「작가 프로필 = 라이트 에디토리얼」** 로 이 화면의 표면 모드를 이미 정해 두었다.
     사이트의 정본 라이트 언어(studio·guide)는 다크를 **가로 띠**(내비·히어로)로만 쓰고
     본문 안에 다크 카드를 박지 않는다.

     라이트 위 대비 실측(WCAG, sand #efe6d3 배경 기준) — 전부 기준 통과:
       그린 텍스트 --oas-green-text  5.51:1   본문 --oas-ink-cool   12.98:1
       보조 --oas-ink-dim            4.71:1   CTA  --oas-cta-ink     6.55:1

     "절대 안 섞임" 은 색 반전 대신 **sand 프레임 + 흰 카드 + 그린 이어브로우** 세 겹이
     진다. --pv-* 이름은 그대로 두고 값만 라이트로 다시 잇는다 — 그래서 mypage.css 의
     `.pv` 규칙은 이 전환에서 **한 줄도 바뀌지 않았다**(2층 토큰 구조가 값을 한 자리다). */
  :root{
    /* 편집 영역(라이트) */
    --bg:var(--oas-ivory);
    --surface:var(--oas-white);
    /* 입력·칩·카드라디오·링크행의 **채움면**.
       ── 왜 --oas-paper 가 아니라 --oas-sand-100 인가 (2026-08-09 실측) ──────
       원래 값은 --oas-paper(#fdfbf5)였고, 그것이 감독 지적 *"디자인이 구린데"* 의
       직접 원인이었다. 문제는 색 자체가 아니라 **바로 뒤 면과의 대비**다:

         조합                                      명도 대비
         입력 #fdfbf5  vs  패널 #ffffff (현행)      1.03   ← 사람 눈에 사실상 같은 색
         입력 #efe6d3  vs  바탕 #F3F0E9 (studio)    1.09

       1.03 이면 입력이 「면」이 아니라 **「테두리만 있는 빈 구멍」** 으로 읽힌다. 그래서
       별명 입력(최대 20자)이 652px 인 것이 그대로 허전함이 됐다.
       ⚠ **폭을 좁히는 처방은 이 문제를 안 푼다** — studio 는 같은 입력이 **925px** 인데도
       어색하지 않다. 채움이 있어 면으로 읽히기 때문이다. 폭 상한(.inp--short/--mid)은
       함께 넣었지만 그것만으로는 화면이 안 바뀐다. 둘 중 효과가 큰 쪽은 **이 한 줄**이다.

       --oas-paper 는 DESIGN.md §3-1 이 이미 **레거시로 이관**한 토큰이기도 하다
       ("페이지 레벨 배경 앵커 역할을 --bg-light 에 넘긴다"). */
    --surface-2:var(--oas-sand-100);
    --panel:var(--oas-panel);
    --line:var(--oas-warm-gray-300);
    --line-soft:var(--oas-border-light);
    --ink:var(--oas-ink-cool);
    --ink-body:var(--oas-ink-body);
    --ink-dim:var(--oas-ink-dim);
    --accent:var(--oas-accent-ink);
    --accent-soft:var(--oas-green-100);
    --accent-line:var(--oas-green-300);
    --cta:var(--oas-cta-ink);
    --cta-label:var(--oas-white);
    --danger:var(--oas-danger);
    --warn:var(--oas-warn-ink);

    /* 폼 필드 폭 상한 — 담을 내용의 길이에 맞춘다(≥560px 에서만 발동, mypage.css §13).
       세 단계뿐이고 그 이상 쪼개지 않는다: 짧은 값 / 한 줄 이름 / 긴 글·행 묶음.
         --w-short  별명(20자)·작가명처럼 **한눈에 끝나는 값**
         --w-mid    활동분야 카드·판정 문구처럼 한 줄짜리 덩어리
         --w-wide   소개 textarea·링크 행·필드 묶음. 긴 글은 폭이 아니라 **줄 길이**가
                    상한이다(한 줄 70자 남짓)
       ⚠ **토큰으로 올린 이유**: 첫 판본은 `720px` 를 3곳, `520px` 를 3곳에 리터럴로
       적었고 교차리뷰가 값 미러링으로 잡았다(조건 R2). 색·구름 고도·테스트 임계값에서
       이미 세 번 지불한 형태다.
       ⚠ 함께 지운 것: `.inp--area { max-width: 720px }` 는 **죽은 선언**이었다 —
       부모 `.fld` 가 이미 720 이라 자식의 720 은 발동할 수 없다. 검수관이 삭제
       뮤테이션으로 실측했다(7개 폭 전부 폭 변화 0 · 34 passed). 반면 `.linkrow` 는
       `<template>` 안에 있어 렌더되면 `.panel` 직속이라(`.fld` 밖) 자체 상한이
       필요하다 — 같은 720 이어도 죽은 선언이 아니다. */
    --w-short:320px;
    --w-mid:520px;
    --w-wide:720px;

    /* Preview — 라이트(위 주석의 감독 판정). 편집 영역과 **같은 계열**이므로 구분은
       색 반전이 아니라 층(sand 프레임 → 흰 카드)과 이어브로우가 진다.
       accent·cta 가 -ink 딥변형인 것이 핵심이다 — 원색(--oas-accent/--oas-cta)은
       라이트 위에서 대비 1.69~1.85:1 로 UI 기준(3:1) 미달이다(tokens.css 주석).
       실제로 다크 시절 「작품 문의」가 --oas-cta(#1fd677) 채움이었고, 라이트 배경에서
       그대로 두면 DESIGN.md 안티패턴 「풀채도 네온 대비」에 걸린다.

       ── ⚠ --pv-bg 와 --pv-surface-2 가 **같은 값인 것은 의도다** ───────────
       읽는 사람이 반드시 걸리는 자리라 근거를 적는다. 이 화면의 Preview 는 **4층**이고,
       대비는 「토큰끼리」가 아니라 **DOM 에서 실제로 맞닿는 면끼리** 성립한다:

         층                     토큰               맞닿는 뒤 면        대비
         body                   --bg (ivory)       —                   —
         .pv 프레임             --pv-bg            body                1.0899
         .pv__card              --pv-surface       .pv                 1.2404
         .pv__lock/__avatar/    --pv-surface-2     .pv__card           1.2404
           __genres 칩

       --pv-bg 와 --pv-surface-2 는 **서로 맞닿지 않는다** — 사이에 불투명한
       .pv__card(흰색)가 있다. 그래서 둘이 같은 값이어도 화면에서 겹쳐 보이는 자리가
       없다. 참고로 다크 시절 같은 자리(.pv__lock dark-2 on .pv__card dark-1)는
       **1.1588** 이었으므로, 라이트 전환은 이 축에서 **회귀가 아니라 개선**이다.

       **그러나 이 안전은 조건부다** — .pv__card 가 배경을 잃는 순간(투명·삭제) 두 면이
       직접 맞닿아 대비가 **정확히 1.00** 이 된다. 그 회귀는 눈으로만 잡히므로
       `tests/mypage-markup.test.ts` 의 「Preview 층 사슬」이 막는다: .pv__card 의
       불투명 배경 + 사슬 각 단의 대비를 함께 단언한다.

       두 토큰의 **이름이 갈려 있으므로 값이 같아도 서로 독립적으로 바꿀 수 있다**
       (한쪽만 고치면 그 순간 갈린다 — 연동된 것이 아니다). */
    --pv-bg:var(--oas-sand-100);
    --pv-surface:var(--oas-white);
    --pv-surface-2:var(--oas-sand-100);
    --pv-line:var(--oas-warm-gray-300);
    --pv-ink:var(--oas-ink-cool);
    --pv-dim:var(--oas-ink-dim);
    --pv-accent:var(--oas-accent-ink);
    --pv-cta:var(--oas-cta-ink);
    --pv-cta-label:var(--oas-white);

    /* 형태·틴트 — 오프셋·블러는 형태지만 **틴트는 색이다.**
       rgba(20,21,26) 은 --oas-dark-anchor(#14151A) 의 rgb 표기다. hex 토큰에서 알파만
       떼어내는 표준 수단이 아직 좁아서(`rgb(from …)`) 저장소 선례대로 rgba 를 직접
       적되(studio 의 --shadow-whisper, builder 의 --glass 와 같은 처리) **이 블록 한
       곳에만** 모은다 — mypage.css 안에는 색 리터럴이 0이어야 하고, 실제로 0이다.
       tokens.css 가 `rgb(from …)` 을 쓸 수 있게 되는 날 이 다섯 줄만 갈아끼우면 된다. */
    --r-lg:14px; --r-md:10px; --r-sm:7px;
    /* studio 의 --shadow-whisper 와 **같은 값이었다**. 1층으로 올려 미러링을 끝냈다(§5-3).
       ⚠ 이 주석은 한 번 **범위를 넘겨 적혔다**(교차리뷰 조건 1) — 바로 아래 `--sh-2` 가
       `--oas-shadow-panel` 과 같은 값인 채 리터럴로 남아 있었는데 *"미러링을 끝냈다"* 고
       썼다. 게다가 그 토큰은 소비처가 **저장소 전체 0건**이었다. 같은 커밋이
       `--oas-shadow-card-hover`/`-deep` 을 지운 근거가 *"죽은 토큰이면 무해하지만 **죽은
       정본 후보**는 유해하다"* 였으므로 그 기준이 그대로 적용되는 대상이었다 —
       **같은 사이클 안에서 내 기준을 내가 어겼다.** 지웠다. 필요해지면
       `var(--oas-shadow-panel)` 로 잇는다(값이 이미 거기 있다). */
    --sh-1:var(--oas-shadow-whisper);
    /* ⚠ `--sh-pv`(0 18px 38px -14px, 알파 .42)는 **삭제했다.** 다크 플레이트를 배경에서
       띄우기 위한 깊은 그림자였는데, 같은 값이 라이트 표면 아래로 가면 카드가 떠 보이는
       게 아니라 **때가 탄 것처럼** 보인다. 라이트용으로 값을 새로 적으면 --sh-1 과
       거의 같은 값을 두 곳에 적는 미러링이 되므로, `.pv` 가 --sh-1 을 그대로 쓴다. */
    --sh-knob:0 1px 3px rgba(20,21,26,.30);
    --veil-stripe:rgba(20,21,26,.055);
    --app:var(--app-font, -apple-system,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif);
  }
</style>

        <p class="pv__lock" data-mp="preview-private" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.3 10.6h11.4v9H6.3ZM8.6 10.6V7.9a3.4 3.4 0 0 1 6.8 0v2.7"/></svg>프로필을 비공개로 설정했습니다</p>

        <!-- 감독 지시 2026-08-08: *"빨간 표시를 누르면 캐릭터 꾸미기 화면으로 바로
             가게 하자"* — 아바타+이름 블록이 그 진입점이다.

             **`<button>` 이다.** Preview 는 "다른 사람이 보는 모습" 이지만 이 블록만은
             편집 진입점을 겸한다. `<div>` + click 리스너로 두면 키보드로 도달할 수 없고
             스크린리더가 누를 수 있다는 것을 모른다 — 「캐릭터」 탭의 같은 기능이 이미
             버튼이므로 여기만 다르면 그쪽만 접근 가능해진다. -->
        <button class="pv__id" type="button" data-mp="preview-identity">
          <span class="pv__avatar">
            <!-- img 자체에 계약 속성을 붙였다. JS 가 `el.src = …` 로 채울 수 있고,
                 src 없는 <img> 가 깨진 아이콘으로 보이지 않도록 hidden 으로 시작한다
                 (fallback 쪽이 기본으로 보이는 것 = 계약). -->
            <img class="pv__avatar-img" data-mp="preview-avatar" alt="" hidden>
            <span class="pv__avatar-fb" data-mp="preview-avatar-fallback" aria-hidden="true"></span>
          </span>
          <span class="pv__names">
            <strong class="pv__name" data-mp="preview-name"></strong>
            <span class="pv__meta">
              <span class="pv__nick" data-mp="preview-nickname"></span>
              <span class="pv__type" data-mp="preview-type" hidden></span>
            </span>
          </span>
          <!-- 누를 수 있다는 신호. 아이콘은 `aria-hidden` 이고, 목적은 바로 아래
               시각 숨김 텍스트가 말한다. -->
          <span class="pv__id-go" aria-hidden="true">
            <svg class="ico" viewBox="0 0 24 24" focusable="false"><path d="M4 16.5V20h3.5L18 9.5 14.5 6 4 16.5Z"/><path d="M13.2 7.3 16.7 10.8"/></svg>
          </span>
          <!-- ⚠ **`aria-label` 을 쓰지 않는다** (검수관 C1, 2026-08-08).
               `aria-label` 은 자손 텍스트보다 우선해 접근 이름을 **완전히 대체**한다.
               첫 판본이 그렇게 했고, 그 결과 스크린리더 사용자는 이 카드에서 **자기
               이름·별명·타입을 읽을 수 없었다** — `<div>` 였을 때는 읽혔으므로 회귀다.
               접근성을 근거로 `<button>` 을 골라 놓고 다른 축의 접근성을 깎은 셈이다.
               대신 시각 숨김 텍스트를 자손으로 두면 접근 이름이
               "…이름·별명·타입 + 캐릭터 꾸미기" 로 **누적**된다. -->
          <span class="sr-only">캐릭터 꾸미기</span>
        </button>

        <p class="pv__bioshort" data-mp="preview-bioshort"></p>
        <p class="pv__bio" data-mp="preview-bio"></p>
        <p class="pv__loc" data-mp="preview-location"></p>
        <div class="pv__genres" data-mp="preview-genres"></div>
        <div class="pv__links" data-mp="preview-links"></div>
        <button class="pv__inquiry" type="button" data-mp="preview-inquiry" hidden>작품 문의</button>

        <p class="pv__empty" data-mp="preview-empty">아직 소개가 없습니다</p>
      </div>
    </aside>

    <!-- ══ 편집 영역 ════════════════════════════════════════════════════════ -->
    <div class="ed">

      <!-- 탭 7개. 모바일 대응은 mypage.css 의 .ed__tabs 주석 한 곳에 적었다. -->
      <div class="ed__tabs" role="tablist" aria-label="마이페이지 편집 항목">
        <button class="tab" type="button" role="tab" id="mp-tab-basic"   aria-controls="mp-panel-basic"   aria-selected="true"  data-mp-tab="basic">기본 정보</button>
        <button class="tab" type="button" role="tab" id="mp-tab-avatar"  aria-controls="mp-panel-avatar"  aria-selected="false" data-mp-tab="avatar">캐릭터</button>
        <button class="tab" type="button" role="tab" id="mp-tab-about"   aria-controls="mp-panel-about"   aria-selected="false" data-mp-tab="about">소개</button>
        <button class="tab" type="button" role="tab" id="mp-tab-links"   aria-controls="mp-panel-links"   aria-selected="false" data-mp-tab="links">SNS·링크</button>
        <button class="tab" type="button" role="tab" id="mp-tab-artist"  aria-controls="mp-panel-artist"  aria-selected="false" data-mp-tab="artist">작가 정보</button>
        <button class="tab" type="button" role="tab" id="mp-tab-privacy" aria-controls="mp-panel-privacy" aria-selected="false" data-mp-tab="privacy">공개 설정</button>
        <button class="tab" type="button" role="tab" id="mp-tab-account" aria-controls="mp-panel-account" aria-selected="false" data-mp-tab="account">계정</button>
      </div>

      <!-- 비활성 패널의 hidden 은 JS 가 관리한다(계약). 초기 HTML 에 미리 적어 두는 것은
           JS 가 붙기 전 7개 패널이 한꺼번에 펼쳐지는 것을 막기 위해서다 — CSS 로
           display:none 시키지 않았으므로 JS 가 hidden 을 떼면 그대로 보인다. -->

      <!-- ── 기본 정보 ──────────────────────────────────────────────────── -->
      <section class="panel" role="tabpanel" id="mp-panel-basic" aria-labelledby="mp-tab-basic" data-mp-panel="basic">

        <div class="fld">
          <div class="fld__head">
            <label class="fld__label" for="mp-nickname">별명</label>
            <span class="fld__count" data-mp-count="nickname"></span>
          </div>
          <input class="inp inp--short" id="mp-nickname" type="text" data-mp-field="nickname" autocomplete="off" spellcheck="false">
          <p class="msg" data-mp-error="nickname"></p>
          <div class="suggest" data-mp-suggest="nickname"></div>
        </div>

        <div class="fld">
          <div class="fld__head">
            <label class="fld__label" for="mp-displayname">작가명</label>
          </div>
          <input class="inp inp--mid" id="mp-displayname" type="text" data-mp-field="displayName" autocomplete="off">
          <p class="msg" data-mp-error="displayName"></p>
        </div>

        <fieldset class="fld fld--set">
          <legend class="fld__label">활동 분야</legend>
          <!-- 카드형 라디오. studio.html 의 .theme-card 와 같은 형태(라벨 안에 input 을 숨기고
               형제 요소를 칠한다) — :has() 없이도 전 브라우저에서 동작한다. -->
          <div class="cards">
            <label class="card"><input type="radio" name="mp-usertype" value="artist" data-mp-field="userType" checked><span class="card__face">작가</span></label>
            <label class="card"><input type="radio" name="mp-usertype" value="gallery" data-mp-field="userType"><span class="card__face">갤러리</span></label>
            <label class="card"><input type="radio" name="mp-usertype" value="collector" data-mp-field="userType"><span class="card__face">컬렉터</span></label>
            <label class="card"><input type="radio" name="mp-usertype" value="member" data-mp-field="userType"><span class="card__face">일반 회원</span></label>
          </div>
          <p class="msg" data-mp-error="userType"></p>
        </fieldset>

        <div class="fld">
          <div class="fld__head">
            <span class="fld__label" id="mp-photo-label">프로필 사진</span>
          </div>
          <label class="filepick">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.2 8.4h3.4l1.5-2.2h7.8l1.5 2.2h3.4v10.4H3.2Z"/><circle cx="12" cy="13.3" r="3.4"/></svg>
            <span class="filepick__txt">사진 선택</span>
            <input class="filepick__input" type="file" accept="image/*" data-mp-field="profileImage" aria-labelledby="mp-photo-label">
          </label>
          <p class="msg" data-mp-error="profileImage"></p>
        </div>

      </section>

      <!-- ── 캐릭터 ─────────────────────────────────────────────────────── -->
      <section class="panel" role="tabpanel" id="mp-panel-avatar" aria-labelledby="mp-tab-avatar" data-mp-panel="avatar" hidden>
        <div class="avatar">
          <div class="avatar__frame">
            <img class="avatar__thumb" data-mp="avatar-thumb" alt="">
          </div>
          <button class="btn btn--line" type="button" data-mp="avatar-open">캐릭터 꾸미기</button>
        </div>

        <!-- ── 내 옷장 (감독 지시 2026-08-08: *"옷장리스트가 나오게 해줘"*) ──────
             편집기(`ui-avatar-editor.ts`)의 「내 옷장」과 **같은 저장소**를 읽는다
             (`readCloset`) — 여기에 목록을 다시 만들지 않는다. 저장·삭제는 편집기가
             하고 여기서는 **입기**만 한다. 삭제를 여기 두지 않는 이유는 실수 비용이다:
             옷 한 벌은 되돌릴 수단이 없고(서버 백업 0), 이 화면은 프로필을 고치러 온
             사람이 지나가며 보는 자리다. -->
        <div class="closet" data-mp="closet">
          <div class="closet__head">
            <h3 class="closet__title">내 옷장</h3>
            <span class="closet__count" data-mp="closet-count"></span>
          </div>
          <!-- ⚠ 옷장은 **로그인 전용**이다(`ui-avatar-editor.ts` 가 로그인 없으면 옷장
               탭 자체를 숨긴다). 그래서 문구가 "「캐릭터 꾸미기」에서 담으세요" 로만
               끝나면 게스트는 없는 탭을 찾게 된다(검수관 P4). -->
          <p class="closet__empty" data-mp="closet-empty" hidden>
            아직 저장한 옷이 없습니다. 「캐릭터 꾸미기」에서 마음에 드는 모습을 옷장에 담아 보세요.<!--
            --><span data-mp="closet-empty-guest" hidden> 옷장에 담으려면 로그인이 필요합니다.</span>
          </p>
          <!-- 갈아입기 결과는 **프로필 저장 상태줄과 나눠 쓰지 않는다**(검수관 P5).
               공유하면 "저장하지 않은 변경이 있습니다" 경고가 지워지고 초록 "완료" 로
               바뀌어, 저장이 된 것처럼 읽힌다(플래그는 그대로라 실제로는 안 됐다). -->
          <p class="closet__status" data-mp="closet-status" aria-live="polite"></p>
          <div class="closet__grid" data-mp="closet-list"></div>
          <!-- 행 템플릿 — 목록은 JS 가 채운다(마크업에 옷 개수를 적지 않는다). -->
          <template data-mp="closet-cell">
            <button class="closet__cell" type="button" data-mp-closet="load">
              <img class="closet__thumb" data-mp-closet="thumb" alt="">
              <span class="closet__name" data-mp-closet="name"></span>
            </button>
          </template>
        </div>
      </section>

      <!-- ── 소개 ───────────────────────────────────────────────────────── -->
      <section class="panel" role="tabpanel" id="mp-panel-about" aria-labelledby="mp-tab-about" data-mp-panel="about" hidden>

        <div class="fld">
          <div class="fld__head">
            <label class="fld__label" for="mp-bioshort">한 줄 소개</label>
            <span class="fld__count" data-mp-count="bioShort"></span>
          </div>
          <input class="inp inp--mid" id="mp-bioshort" type="text" data-mp-field="bioShort">
          <p class="msg" data-mp-error="bioShort"></p>
        </div>

        <div class="fld">
          <div class="fld__head">
            <label class="fld__label" for="mp-bio">소개</label>
            <span class="fld__count" data-mp-count="bio"></span>
          </div>
          <textarea class="inp inp--area" id="mp-bio" rows="7" data-mp-field="bio"></textarea>
          <p class="msg" data-mp-error="bio"></p>
        </div>

        <div class="fld">
          <div class="fld__head">
            <label class="fld__label" for="mp-location">활동 지역</label>
          </div>
          <input class="inp inp--short" id="mp-location" type="text" data-mp-field="location">
          <p class="msg" data-mp-error="location"></p>
        </div>

      </section>

      <!-- ── SNS·링크 ───────────────────────────────────────────────────── -->
      <section class="panel" role="tabpanel" id="mp-panel-links" aria-labelledby="mp-tab-links" data-mp-panel="links" hidden>

        <div class="links" data-mp="links-list"></div>

        <button class="btn btn--line btn--wide" type="button" data-mp="link-add">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5.4v13.2M5.4 12h13.2"/></svg>
          링크 추가
        </button>

        <!-- 한 행의 틀. platform 의 <option> 은 JS 가 채운다(플랫폼 목록 SSOT 는 links.ts
             한 곳이므로 여기 옮겨 적으면 그 순간 값 미러링이다). -->
        <template data-mp="link-row">
          <div class="linkrow">
            <div class="linkrow__main">
              <select class="inp inp--sel linkrow__platform" data-mp-link="platform" aria-label="플랫폼"></select>
              <input class="inp linkrow__url" type="text" data-mp-link="url" placeholder="@아이디 또는 주소" autocomplete="off" spellcheck="false" aria-label="아이디 또는 주소">
            </div>
            <input class="inp linkrow__label" type="text" data-mp-link="label" aria-label="링크 이름" hidden>
            <div class="linkrow__foot">
              <label class="swrow swrow--sm">
                <span class="swrow__name">공개</span>
                <input class="sw sw--sm" type="checkbox" data-mp-link="visible" checked>
              </label>
              <button class="iconbtn iconbtn--danger" type="button" data-mp-link="remove" aria-label="이 링크 삭제">
                <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.6 7.2h14.8M9.6 7.2V5.1h4.8v2.1M6.4 7.2l.9 12.1h9.4l.9-12.1M10.2 10.6v5.5M13.8 10.6v5.5"/></svg>
              </button>
            </div>
            <p class="msg" data-mp-link="error"></p>
          </div>
        </template>

      </section>

      <!-- ── 작가 정보 ──────────────────────────────────────────────────── -->
      <section class="panel" role="tabpanel" id="mp-panel-artist" aria-labelledby="mp-tab-artist" data-mp-panel="artist" hidden>

        <fieldset class="fld fld--set">
          <legend class="fld__label">장르</legend>
          <div class="chips">
            <label class="chip"><input type="checkbox" data-mp-field="genres" value="painting"><span class="chip__face">회화</span></label>
            <label class="chip"><input type="checkbox" data-mp-field="genres" value="photo"><span class="chip__face">사진</span></label>
            <label class="chip"><input type="checkbox" data-mp-field="genres" value="sculpture"><span class="chip__face">조각</span></label>
            <label class="chip"><input type="checkbox" data-mp-field="genres" value="media"><span class="chip__face">미디어아트</span></label>
            <label class="chip"><input type="checkbox" data-mp-field="genres" value="installation"><span class="chip__face">설치</span></label>
            <label class="chip"><input type="checkbox" data-mp-field="genres" value="digital"><span class="chip__face">디지털아트</span></label>
            <label class="chip"><input type="checkbox" data-mp-field="genres" value="craft"><span class="chip__face">공예</span></label>
            <label class="chip"><input type="checkbox" data-mp-field="genres" value="drawing"><span class="chip__face">드로잉</span></label>
            <label class="chip"><input type="checkbox" data-mp-field="genres" value="etc"><span class="chip__face">기타</span></label>
          </div>
          <p class="msg" data-mp-error="genres"></p>
        </fieldset>

        <div class="fld">
          <div class="fld__head">
            <label class="fld__label" for="mp-exhibitions">주요 전시</label>
            <span class="fld__count" data-mp-count="exhibitions"></span>
          </div>
          <textarea class="inp inp--area" id="mp-exhibitions" rows="6" data-mp-field="exhibitions"></textarea>
          <p class="msg" data-mp-error="exhibitions"></p>
        </div>

        <div class="fld">
          <div class="fld__head">
            <label class="fld__label" for="mp-gallery">소속 갤러리</label>
          </div>
          <input class="inp inp--mid" id="mp-gallery" type="text" data-mp-field="gallery">
          <p class="msg" data-mp-error="gallery"></p>
        </div>

        <div class="fld">
          <label class="swrow">
            <span class="swrow__name">작품 문의 가능</span>
            <input class="sw" type="checkbox" data-mp-field="inquiryOpen">
          </label>
          <label class="swrow">
            <span class="swrow__name">작품 판매 가능</span>
            <input class="sw" type="checkbox" data-mp-field="saleOpen">
          </label>
        </div>

      </section>

      <!-- ── 공개 설정 ──────────────────────────────────────────────────── -->
      <section class="panel" role="tabpanel" id="mp-panel-privacy" aria-labelledby="mp-tab-privacy" data-mp-panel="privacy" hidden>

        <!-- 마스터 스위치를 자식 5개와 **다른 층**에 둔다(요구사항).
             ① 마스터는 카드 밖 상단에 단독 행으로 크게
             ② 자식 5개는 들여쓴 카드 안, 좌측에 종속선
             ③ 마스터가 꺼지면 :has() 로 자식 층 전체가 덮인다(JS 없이도 성립).
                :has() 미지원 브라우저에서는 덮개가 안 뜰 뿐 기능 손실은 없다. -->
        <div class="master">
          <label class="swrow swrow--master">
            <span class="swrow__name">프로필 공개</span>
            <input class="sw sw--lg" type="checkbox" data-mp-vis="profile" checked>
          </label>

          <div class="master__kids">
            <div class="master__veil" aria-hidden="true"></div>
            <label class="swrow"><span class="swrow__name">소개</span><input class="sw" type="checkbox" data-mp-vis="bio" checked></label>
            <label class="swrow"><span class="swrow__name">활동 지역</span><input class="sw" type="checkbox" data-mp-vis="location" checked></label>
            <label class="swrow"><span class="swrow__name">SNS·링크</span><input class="sw" type="checkbox" data-mp-vis="links" checked></label>
            <!-- email 기본값은 꺼짐(schema.ts DEFAULT_VISIBILITY 와 같은 초기 상태). -->
            <label class="swrow"><span class="swrow__name">이메일</span><input class="sw" type="checkbox" data-mp-vis="email"></label>
            <label class="swrow"><span class="swrow__name">작품 문의</span><input class="sw" type="checkbox" data-mp-vis="inquiry" checked></label>
          </div>
        </div>

      </section>

      <!-- ── 계정 ───────────────────────────────────────────────────────── -->
      <section class="panel" role="tabpanel" id="mp-panel-account" aria-labelledby="mp-tab-account" data-mp-panel="account" hidden>

        <!-- 문구는 비워 둔다 — 카피는 내 소관이 아니다(자리·타이포까지만). JS 가 채운다. -->
        <p class="notice" data-mp="account-notice"></p>

        <div class="fld">
          <div class="fld__head">
            <span class="fld__label">로그인 수단</span>
          </div>
          <p class="readout" data-mp="account-provider"></p>
        </div>

        <div class="danger">
          <button class="btn btn--danger" type="button" data-mp="account-reset">프로필 초기화</button>
        </div>

      </section>

      <!-- ── 저장 ───────────────────────────────────────────────────────── -->
      <div class="actionbar">
        <span class="actionbar__status" data-mp="save-status" aria-live="polite"></span>
        <button class="btn btn--cta" type="button" data-mp="save">저장</button>
      </div>

    </div><!-- /.ed -->
  </div><!-- /.mp__grid -->
</div><!-- /.mp -->

</body>
</html>
