<!-- [실험] **블렌더를 거친 GLB 가 곧 세계다** — behind-flag(라이브 미노출, 어디에도 링크 안 함).
     감독 지시 2026-08-26: "월드8에 그 glb를 올려보자."

     ⚠ 월드7과 갈리는 것은 **파일이 어디서 오는가** 하나다. 저쪽은 감독이 고르고,
     여기는 `<body data-glb>` 가 가리키는 **고정 자산**이 부팅 즉시 열린다. 감독이
     *"지금 그파일이 없어서 내가 못올려"* 라고 해서, 감독이 하던 왕복(우리 내보내기 →
     블렌더에서 오브젝트 추가 → GLB 내보내기)을 **저장소에서 재현해** 구운 파일이다.
     만든 절차는 `scripts/asset/extract-world2-glb.mjs` + `blender-edit.py` 두 곳이고
     `bpy`(Blender as a Python Module) 5.0.1 이 실제로 읽고 썼다 — 흉내가 아니다.

     스크립트는 `world7.html` 과 **같은 파일**을 쓴다(`js/glb-world.js`). 268줄을
     복사하면 그것이 곧 값 미러링이라 한쪽만 고쳐지는 자리가 생긴다.

     ⚠ importmap 을 두지 않는다 — 이유는 `world7.html` 헤더 한 곳에 있다(dead 핀).
     이 페이지도 인라인 스크립트 0 · `script-src 'self'` 이고 vite 전용이다.

     ⚠ CSP 의 `blob:` 두 자리는 **성격이 다르다 — 재보고 적는다**(검수관 권고 P1).
     첫 판본은 `world2.html`·`lab-glb.html` 을 따라 적었고 «필수» 라고 단정했는데
     실측하지 않았다. 검수관이 뮤테이션으로 갈랐다:

       connect-src 에서 blob: 제거 → CSP violation 6건(= 임베드 이미지 6개) · 콘솔 18건
       img-src     에서 blob: 제거 → violation 0 · 콘솔 0 · HUD 정상

     GLTFLoader 가 이 경로에서 `ImageBitmapLoader`(fetch)만 타기 때문이다. 그래도
     `img-src blob:` 을 **지우지 않는다**: `createImageBitmap` 미지원 브라우저에서
     three 는 `ImageLoader`(<img>)로 폴백하므로 그때 필요해진다. 즉 connect-src 는
     **지금 쓰이는 것**이고 img-src 는 **안전망**이다. -->

  /* ⚠ 여기가 `#keys{display:none}` 이었고 **모바일에서 조작 안내가 통째로 사라졌다**
     (감독 신고 2026-08-26 "걸어다닐수가 없네"). 이 페이지는 조이스틱 손잡이를 안 그리는
