<!--
  world2 — 오픈월드 재작성(커널 아키텍처) 검증 페이지.

  behind-flag: 어디에도 링크하지 않는다. 라이브 미술관(world.html)과 완전히 분리돼 있고,
  이 페이지의 존재가 채택을 뜻하지 않는다. 라이브 노출은 감독·팀장 게이트를 거친다.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'">
<title>오픈월드 v2 (실험) · OpenArtShow</title>
<style>
  :root{
    --bg:#0B0D12; --ink:#F5F5F2; --dim:#9A9EB1; --line:#3A3D4B;
    --violet:#8B72FF; --cyan:#72E6E1;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
  body{font-family:'Pretendard','NanumGothic',system-ui,sans-serif}
  #w2-canvas{display:block;width:100vw;height:100vh;touch-action:none}

  /* ── 로딩 화면 ─────────────────────────────────────────────────────────
     바 보간을 CSS transition에 맡긴다. 로딩 중에는 메인 스레드가 가장 바쁘므로
     JS로 애니메이션을 돌리면 그 애니메이션부터 끊기고, 끊기는 진행바는
     "멈춤"의 신호로 읽혀 없느니만 못하다. */
  /* 바를 화면 정중앙에 **고정**하고 나머지는 그 위아래에 절대 배치한다.
     3초 뒤 라벨·문구가 나타날 때 바가 밀려나면, 조용히 지나가다 풍성해지는 게 아니라
     화면이 튀는 걸로 읽힌다. 자리를 옮기지 않고 겹쳐 띄우는 이유다. */
  #w2-loading{
    position:fixed;inset:0;z-index:10;
    display:grid;place-items:center;
    background:radial-gradient(120% 90% at 50% 40%, #151926 0%, var(--bg) 70%);
    transition:opacity .45s ease;
  }
  #w2-loading[data-state="done"]{opacity:0;pointer-events:none}
  #w2-loading-center{position:relative;display:grid;place-items:center;gap:10px}

  /* 부가 요소는 3초를 넘겨야(data-detail="rich") 나타난다 — 감독 지시.
     레이아웃에서 빠지지 않고 자리만 유지한 채 투명해진다(절대 배치라 바를 안 민다). */
  #w2-loading-label,#w2-loading-copy,#w2-loading-pct{
    position:absolute;left:50%;transform:translateX(-50%);
    margin:0;white-space:nowrap;
    opacity:0;transition:opacity .5s ease;
  }
  #w2-loading-label{bottom:calc(100% + 20px);font-size:15px;letter-spacing:.02em;color:var(--ink)}
  #w2-loading-pct{top:calc(100% + 14px);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  #w2-loading-copy{top:calc(100% + 40px);font-size:13.5px;line-height:1.5;color:var(--dim)}

  /* 퍼센트는 바의 수치 표현이므로 minimal에서도 보인다. "프로그레스 바만"의 일부다. */
  #w2-loading-pct{opacity:1}
  #w2-loading[data-detail="rich"] #w2-loading-label{opacity:1}
  /* 실패는 밀도와 무관하게 보여야 한다. 3초 전에 부팅이 깨지면 minimal이라 라벨이
     숨겨진 채 남고, 사용자는 멈춘 진행바만 보게 된다 — 오류를 감추는 최악의 상태다. */
  #w2-loading[data-state="error"] #w2-loading-label{opacity:1}

  #w2-loading-track{
    width:min(320px,62vw);height:2px;border-radius:2px;
    background:rgba(255,255,255,.12);overflow:hidden;
  }
  #w2-loading-bar{
    width:0%;height:100%;border-radius:2px;
    background:linear-gradient(90deg,var(--violet),var(--cyan));
    transition:width .35s cubic-bezier(.22,.61,.36,1);
  }
  /* 문구 교체는 JS가 텍스트만 갈고 페이드는 여기서 한다 — 로딩 중에는 메인 스레드가
     가장 바쁘므로 JS 애니메이션을 돌리면 그 애니메이션부터 끊긴다.
     rich 진입 + data-show 둘 다여야 보인다(3초 게이트와 교체 페이드가 각자 산다). */
  #w2-loading[data-detail="rich"] #w2-loading-copy[data-show="1"]{opacity:1}
  #w2-loading-note{
    position:absolute;top:calc(100% + 68px);left:50%;transform:translateX(-50%);
    margin:0;width:max-content;max-width:min(420px,80vw);white-space:normal;
    text-align:center;font-size:12.5px;line-height:1.6;color:var(--dim);
  }
  #w2-loading[data-state="error"] #w2-loading-bar{background:#FF705E}
  #w2-loading[data-state="error"] #w2-loading-note{color:#FFB4A8}

  /* 모션을 줄이고 싶다는 뜻은 존중한다 — 전환을 없애도 정보 전달은 그대로다. */
  @media (prefers-reduced-motion: reduce){
    #w2-loading,#w2-loading-bar,#w2-loading-copy{transition:none}
    #w2-loading-copy{transform:none}
  }

  #w2-hint{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:5;
    font-size:12px;color:var(--dim);letter-spacing:.02em;
    background:rgba(11,13,18,.55);border:1px solid var(--line);border-radius:999px;
    padding:7px 14px;pointer-events:none;max-width:88vw;text-align:center;
  }

  /* ── 가상 조이스틱 ─────────────────────────────────────────────────────
     pointer-events:none 이 핵심 — 터치는 캔버스가 받고 여기는 그림만 그린다.
     조이스틱이 이벤트를 가로채면 손가락이 조이스틱 밖으로 나가는 순간 추적이 끊긴다. */
  #w2-stick{
    position:fixed;z-index:6;width:112px;height:112px;margin:-56px 0 0 -56px;
    border-radius:50%;pointer-events:none;
    border:1px solid rgba(255,255,255,.16);
    background:radial-gradient(circle, rgba(255,255,255,.07) 0%, rgba(255,255,255,.02) 70%);
    opacity:0;transition:opacity .18s ease;
  }
  #w2-stick[data-on="1"]{opacity:1}
  #w2-stick-knob{
    position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;
    transform:translate(-50%,-50%);
    background:linear-gradient(145deg, rgba(139,114,255,.85), rgba(114,230,225,.75));
    box-shadow:0 2px 12px rgba(0,0,0,.35);
  }
  @media (prefers-reduced-motion: reduce){ #w2-stick{transition:none} }

  /* ── 성능 HUD ──────────────────────────────────────────────────────────
     기본은 아이콘 하나만. 펼쳐야 수치가 나온다 — 평소에 화면을 가리면
     "걸을 때 끊기는가"를 보는 데 방해가 된다. */
  #w2-hud{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:8;
    display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  #w2-hud-toggle{
    width:38px;height:38px;border-radius:10px;cursor:pointer;
    background:rgba(11,13,18,.62);border:1px solid var(--line);color:var(--ink);
    font-size:16px;line-height:1;padding:0;
  }
  #w2-hud-panel{display:none;background:rgba(11,13,18,.86);border:1px solid var(--line);
    border-radius:10px;padding:9px 10px;min-width:min(230px,64vw)}
  #w2-hud[data-open="1"] #w2-hud-panel{display:block}
  #w2-hud-body{
    margin:0 0 8px;white-space:pre-wrap;word-break:break-all;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11px;line-height:1.55;color:var(--ink);
  }
  #w2-hud-copy{
    width:100%;padding:7px 10px;border-radius:8px;cursor:pointer;
    background:rgba(139,114,255,.18);border:1px solid rgba(139,114,255,.5);
    color:var(--ink);font-size:12px;font-family:inherit;
  }

  /* ── 神 모드 하늘 패널 ──────────────────────────────────────────────────
     HUD 아래에 붙인다. 하늘을 바꾸면서 바로 위 수치를 보는 것이 이 패널의
     목적이므로 둘이 같은 시야 안에 있어야 한다. 기본 접힘. */
  #w2-god{position:fixed;top:calc(10px + env(safe-area-inset-top));right:56px;z-index:8;
    max-width:min(300px,72vw)}
  #w2-god-toggle{
    display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:10px;cursor:pointer;
    background:rgba(11,13,18,.62);border:1px solid var(--line);color:var(--ink);
    font-size:12px;font-family:inherit;line-height:1;
  }
  #w2-god-toggle .cap{opacity:.85}
  #w2-god-toggle .caret{margin-left:2px;font-size:9px;color:var(--dim);transition:transform .2s}
  #w2-god[data-open="1"] #w2-god-toggle .caret{transform:rotate(180deg)}
  #w2-god-body{
    margin-top:6px;background:rgba(11,13,18,.88);border:1px solid var(--line);
    border-radius:10px;padding:10px 11px;display:flex;flex-direction:column;gap:8px;
  }
  #w2-god-body[hidden]{display:none}
  .w2-god-row{display:flex;align-items:center;flex-wrap:wrap;gap:5px}
  .w2-god-cap{font-size:10.5px;color:var(--dim);width:38px;flex:none}
  .w2-god-row button{
    font-family:inherit;font-size:11.5px;padding:6px 9px;border-radius:8px;cursor:pointer;
    background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--dim);
  }
  .w2-god-row button.on{
    background:rgba(139,114,255,.28);border-color:rgba(139,114,255,.7);
    color:var(--ink);font-weight:600;
  }
  .w2-god-row[data-group="fx"] button.on{
    background:rgba(114,230,225,.24);border-color:rgba(114,230,225,.6);
  }
  @media (prefers-reduced-motion: reduce){ #w2-god-toggle .caret{transition:none} }
</style>

<body>
  <canvas id="w2-canvas"></canvas>

  <div id="w2-loading" data-detail="minimal">
    <div id="w2-loading-center">
      <p id="w2-loading-label">준비 중</p>
      <div id="w2-loading-track"><div id="w2-loading-bar"></div></div>
      <span id="w2-loading-pct">0%</span>
      <p id="w2-loading-copy" data-show="0"></p>
      <p id="w2-loading-note" hidden></p>
    </div>
  </div>

  <!-- 가상 조이스틱. 누른 자리에 나타난다(고정 위치가 아니다) — 기기·손 크기마다
       엄지가 닿는 자리가 달라서, 고정하면 누군가는 늘 불편하다. -->
  <div id="w2-stick" data-on="0"><div id="w2-stick-knob"></div></div>

  <!-- 성능 HUD. 모바일에는 콘솔이 없어 화면 표시 + 복사가 실기기 수치를 받는 유일한 경로다. -->
  <div id="w2-hud" data-open="0">
    <button id="w2-hud-toggle" type="button" aria-label="성능 정보 열기/닫기">📊</button>
    <div id="w2-hud-panel">
      <pre id="w2-hud-body">측정 중…</pre>
      <button id="w2-hud-copy" type="button">복사</button>
    </div>
  </div>

  <!-- 神 모드 하늘 패널 — 시간대·날씨·이벤트. 로직은 world2/ui/sky-panel.ts(인라인 금지). -->
  <div id="w2-god" data-open="0">
    <button id="w2-god-toggle" type="button" aria-expanded="false" aria-controls="w2-god-body">
      <span aria-hidden="true">☀</span><span class="cap">하늘</span><span class="caret" aria-hidden="true">▾</span>
    </button>
    <div id="w2-god-body" hidden>
      <div class="w2-god-row" data-group="time">
        <span class="w2-god-cap">시간</span>
        <button type="button" data-time="day">주간</button>
        <button type="button" data-time="sunset">일몰</button>
        <button type="button" data-time="night">야간</button>
        <button type="button" data-auto="1">자동</button>
      </div>
      <div class="w2-god-row" data-group="weather">
        <span class="w2-god-cap">날씨</span>
        <button type="button" data-weather="clear">맑음</button>
        <button type="button" data-weather="overcast">먹구름</button>
        <button type="button" data-weather="rain">비</button>
        <button type="button" data-weather="snow">눈</button>
      </div>
      <div class="w2-god-row" data-group="fx">
        <span class="w2-god-cap">이벤트</span>
        <button type="button" data-fx="rainbow">무지개</button>
        <button type="button" data-fx="aurora">오로라</button>
      </div>
      <div class="w2-god-row" data-group="safe">
        <span class="w2-god-cap">접근성</span>
        <button type="button" data-flash="1">광과민성 보호</button>
      </div>
    </div>
  </div>

  <p id="w2-hint">WASD·방향키로 이동 · 화면을 클릭하면 시선 조작 · Shift 달리기</p>

</body>
</html>
